name: CloudMart Authentication Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  # ============================================================
  # AUTH STACK
  # ============================================================

  deploy-auth:
    name: Deploy Authentication Stack
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS access
      # --------------------------------------------------------

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # Verify required GitHub values
      # --------------------------------------------------------

      - name: Verify configuration
        run: |

          if [ -z "${{ secrets.AUTH_TOKEN }}" ]; then
            echo "ERROR: AUTH_TOKEN GitHub secret is not configured."
            exit 1
          fi

          if [ -z "${{ vars.LAMBDA_SUBNET_IDS }}" ]; then
            echo "ERROR: LAMBDA_SUBNET_IDS repository variable is not configured."
            exit 1
          fi

          if [ -z "${{ vars.LAMBDA_SECURITY_GROUP_ID }}" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID repository variable is not configured."
            exit 1
          fi

          echo "Required configuration is present."


      # --------------------------------------------------------
      # Create / update SSM SecureString
      # --------------------------------------------------------

      - name: Create or update authentication token
        run: |

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/token" \
            --type "SecureString" \
            --value "${{ secrets.AUTH_TOKEN }}" \
            --overwrite \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Verify SSM parameter exists
      # --------------------------------------------------------

      - name: Verify authentication parameter
        run: |

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/token" \
            --with-decryption false \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


      # --------------------------------------------------------
      # Validate CloudFormation
      # --------------------------------------------------------

      - name: Validate Auth CloudFormation
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/auth/auth-stack.yaml \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Deploy Auth Stack
      # --------------------------------------------------------

      - name: Deploy Auth Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/auth/auth-stack.yaml \
            --stack-name cloudmart-dev-auth \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              AuthorizerSubnetIds="${{ vars.LAMBDA_SUBNET_IDS }}" \
              LambdaSecurityGroupId="${{ vars.LAMBDA_SECURITY_GROUP_ID }}" \
              AuthTokenParameterName="/cloudmart/${ENVIRONMENT}/auth/token" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Check Auth Stack
      # --------------------------------------------------------

      - name: Check Auth Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


      # --------------------------------------------------------
      # Display Authorizer Lambda ARN
      # --------------------------------------------------------

      - name: Display Authorizer Lambda ARN
        run: |

          echo "Authorizer Lambda ARN:"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text


      # --------------------------------------------------------
      # Display Authorizer Lambda Name
      # --------------------------------------------------------

      - name: Display Authorizer Lambda Name
        run: |

          echo "Authorizer Lambda Name:"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaName'].OutputValue" \
            --output text
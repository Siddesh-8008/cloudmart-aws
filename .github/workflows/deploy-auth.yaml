name: CloudMart Authentication Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  # ============================================================
  # AUTH STACK
  # ============================================================

  deploy-auth:
    name: Deploy Authentication Stack
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS access
      # --------------------------------------------------------

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # Verify required GitHub values
      # --------------------------------------------------------

      - name: Verify configuration
        run: |

          if [ -z "${{ secrets.AUTH_TOKEN }}" ]; then
            echo "ERROR: AUTH_TOKEN GitHub secret is not configured."
            exit 1
          fi

          if [ -z "${{ vars.LAMBDA_SECURITY_GROUP_ID }}" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID repository variable is not configured."
            exit 1
          fi

          if [ -z "${{ vars.AUTHORIZER_LAYER_ARN }}" ]; then
            echo "ERROR: AUTHORIZER_LAYER_ARN repository variable is not configured."
            exit 1
          fi

          echo "Required configuration is present."


      # --------------------------------------------------------
      # Verify Network Stack exports
      #
      # Auth Stack imports the private subnet IDs directly
      # from the Network Stack.
      # --------------------------------------------------------

      - name: Verify Network Stack exports
        run: |

          echo "Checking required Network Stack exports..."

          EXPORTS=$(aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[].Name" \
            --output text)

          echo "${EXPORTS}"

          if ! echo "${EXPORTS}" | grep -q "CloudMart-${ENVIRONMENT}-PrivateSubnetAId"; then
            echo "ERROR: CloudMart-${ENVIRONMENT}-PrivateSubnetAId export does not exist."
            exit 1
          fi

          if ! echo "${EXPORTS}" | grep -q "CloudMart-${ENVIRONMENT}-PrivateSubnetBId"; then
            echo "ERROR: CloudMart-${ENVIRONMENT}-PrivateSubnetBId export does not exist."
            exit 1
          fi

          echo "Required Network Stack subnet exports are available."


      # --------------------------------------------------------
      # Display current private subnet IDs
      # --------------------------------------------------------

      - name: Display Network Stack subnet IDs
        run: |

          echo "Private Subnet A:"

          aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-PrivateSubnetAId'].Value" \
            --output text

          echo "Private Subnet B:"

          aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-PrivateSubnetBId'].Value" \
            --output text


      # --------------------------------------------------------
      # Verify Lambda Security Group
      # --------------------------------------------------------

      - name: Verify Lambda Security Group
        run: |

          echo "Checking Lambda Security Group..."

          aws ec2 describe-security-groups \
            --group-ids "${{ vars.LAMBDA_SECURITY_GROUP_ID }}" \
            --region "${AWS_REGION}" \
            --query "SecurityGroups[0].GroupId" \
            --output text

          echo "Lambda Security Group exists."


      # --------------------------------------------------------
      # Verify Authorizer Lambda Layer
      # --------------------------------------------------------

      - name: Verify Authorizer Lambda Layer
        run: |

          echo "Checking Authorizer Lambda Layer..."

          LAYER_ARN="${{ vars.AUTHORIZER_LAYER_ARN }}"

          LAYER_NAME=$(echo "${LAYER_ARN}" | awk -F: '{print $7}')
          LAYER_VERSION=$(echo "${LAYER_ARN}" | awk -F: '{print $8}')

          aws lambda get-layer-version \
            --layer-name "${LAYER_NAME}" \
            --version-number "${LAYER_VERSION}" \
            --region "${AWS_REGION}" \
            --query "LayerVersionArn" \
            --output text

          echo "Authorizer Lambda Layer exists."


      # --------------------------------------------------------
      # Create / update ADMIN authentication token
      #
      # Customer tokens are NO LONGER stored in SSM.
      # --------------------------------------------------------

      - name: Create or update admin authentication token
        run: |

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --type "SecureString" \
            --value "${{ secrets.AUTH_TOKEN }}" \
            --overwrite \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Verify ADMIN SSM parameter
      # --------------------------------------------------------

      - name: Verify admin authentication parameter
        run: |

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


      # --------------------------------------------------------
      # Verify DB SSM parameters
      #
      # These are required by the Authorizer Lambda to connect
      # to RDS and validate customer tokens.
      # --------------------------------------------------------

      - name: Verify database SSM parameters
        run: |

          echo "Checking database SSM parameters..."

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/host" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/port" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/name" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/username" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/password" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text

          echo "All required database SSM parameters are available."


      # --------------------------------------------------------
      # Validate Auth CloudFormation
      # --------------------------------------------------------

      - name: Validate Auth CloudFormation
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/auth/auth-stack.yaml \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Deploy Auth Stack
      #
      # CustomerAuthTokenParameterName and CustomerId have
      # been removed.
      #
      # Authorizer now receives the RDS parameter names and
      # Lambda Layer ARN.
      # --------------------------------------------------------

      - name: Deploy Auth Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/auth/auth-stack.yaml \
            --stack-name cloudmart-dev-auth \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              LambdaSecurityGroupId="${{ vars.LAMBDA_SECURITY_GROUP_ID }}" \
              AdminAuthTokenParameterName="/cloudmart/${ENVIRONMENT}/auth/admin-token" \
              DBHostParameter="/cloudmart/${ENVIRONMENT}/db/host" \
              DBPortParameter="/cloudmart/${ENVIRONMENT}/db/port" \
              DBNameParameter="/cloudmart/${ENVIRONMENT}/db/name" \
              DBUsernameParameter="/cloudmart/${ENVIRONMENT}/db/username" \
              DBPasswordParameter="/cloudmart/${ENVIRONMENT}/db/password" \
              AuthorizerLayerArn="${{ vars.AUTHORIZER_LAYER_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}"


      # --------------------------------------------------------
      # Check Auth Stack
      # --------------------------------------------------------

      - name: Check Auth Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


      # --------------------------------------------------------
      # Display Authorizer Lambda ARN
      # --------------------------------------------------------

      - name: Display Authorizer Lambda ARN
        run: |

          echo "Authorizer Lambda ARN:"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
           


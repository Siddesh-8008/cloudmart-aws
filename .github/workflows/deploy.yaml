name: CloudMart Infrastructure

on:
  workflow_dispatch:
    inputs:

      operations_cidr:
        description: Public IP/CIDR allowed to access the CloudMart dashboard
        required: true
        type: string

permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev


jobs:

  # ============================================================
  # JOB 1 - NETWORK STACK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS access
        run: |
          aws sts get-caller-identity


      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network/network-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network/network-stack.yaml \
            --stack-name cloudmart-dev-network \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              OperationsCidr="${{ inputs.operations_cidr }}" \
            --region "${AWS_REGION}"


      - name: Check Network Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


  # ============================================================
  # JOB 2 - DATA STACK
  # ============================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS access
        run: |
          aws sts get-caller-identity


      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data/data-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data/data-stack.yaml \
            --stack-name cloudmart-dev-data \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              DBName=cloudmart \
              DBUsername=cloudmartadmin \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
            --region "${AWS_REGION}"


      # ========================================================
      # GET RDS MASTER SECRET ARN
      # ========================================================

      - name: Get RDS Master Secret ARN
        id: rds-secret
        run: |

          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBMasterUserSecretArn'].OutputValue" \
            --output text)

          echo "SECRET_ARN=$SECRET_ARN" >> "$GITHUB_OUTPUT"


      # ========================================================
      # STORE DB USERNAME IN SSM
      # ========================================================

      - name: Store database username in SSM SecureString
        env:
          SECRET_ARN: ${{ steps.rds-secret.outputs.SECRET_ARN }}

        run: |

          DB_USERNAME=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text | jq -r '.username')

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/username" \
            --type SecureString \
            --value "$DB_USERNAME" \
            --overwrite \
            --region "${AWS_REGION}"


      # ========================================================
      # STORE DB PASSWORD IN SSM
      # ========================================================

      - name: Store database password in SSM SecureString
        env:
          SECRET_ARN: ${{ steps.rds-secret.outputs.SECRET_ARN }}

        run: |

          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "${AWS_REGION}" \
            --query SecretString \
            --output text | jq -r '.password')

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/password" \
            --type SecureString \
            --value "$DB_PASSWORD" \
            --overwrite \
            --region "${AWS_REGION}"


      # ========================================================
      # DISPLAY ARTIFACT BUCKET
      # ========================================================

      - name: Display Lambda Artifact Bucket
        run: |

          echo "Lambda Artifact Bucket:"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text


      # ========================================================
      # CHECK DATA STACK
      # ========================================================

      - name: Check Data Stack Status
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text
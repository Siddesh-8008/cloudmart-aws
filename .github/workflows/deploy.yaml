name: CloudMart Deployment

on:
  push:
    branches:
      - milestone-3
      - orders
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-dev-network
  DATA_STACK_NAME: cloudmart-dev-data
  IAM_STACK_NAME: cloudmart-dev-iam
  AUTH_STACK_NAME: cloudmart-dev-auth
  API_STACK_NAME: cloudmart-dev-api
  EVENTBRIDGE_STACK_NAME: CloudMart-dev-eventbridge
  REPORTING_STACK_NAME: CloudMart-dev-reporting
  MONITORING_STACK_NAME: CloudMart-dev-monitoring

jobs:

  # ============================================================
  # 1. DEPLOY NETWORK
  # VPC
  # Public subnet
  # Private subnets
  # Route tables
  # Internet Gateway
  # Security Groups
  # EC2 Dashboard instance
  # ============================================================

  deploy-network:

    runs-on: ubuntu-latest

    outputs:
      dashboard_instance_id: ${{ steps.dashboard.outputs.instance_id }}
      dashboard_public_ip: ${{ steps.dashboard.outputs.public_ip }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Validate EC2 parameters
      # ----------------------------------------------------------

      - name: Verify EC2 parameters
        shell: bash
        run: |
          set -e

          if [ -z "${{ vars.EC2_KEY_PAIR_NAME }}" ]; then
            echo "ERROR: EC2_KEY_PAIR_NAME GitHub repository variable is not configured."
            exit 1
          fi

          if [ -z "${{ vars.EC2_AMI_ID }}" ]; then
            echo "ERROR: EC2_AMI_ID GitHub repository variable is not configured."
            exit 1
          fi

          echo "EC2 Key Pair: ${{ vars.EC2_KEY_PAIR_NAME }}"
          echo "EC2 AMI: ${{ vars.EC2_AMI_ID }}"
          echo "EC2 Instance Type: ${{ vars.EC2_INSTANCE_TYPE || 't3.micro' }}"

      # ----------------------------------------------------------
      # Validate CloudFormation template
      # ----------------------------------------------------------

      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network/network-stack.yaml \
            --region "${AWS_REGION}"

      # ----------------------------------------------------------
      # Get Operations CIDR
      # ----------------------------------------------------------

      - name: Set Operations CIDR
        id: cidr
        shell: bash
        run: |
          if [ -n "${{ vars.OPERATIONS_CIDR }}" ]; then
            echo "operations_cidr=${{ vars.OPERATIONS_CIDR }}" >> "$GITHUB_OUTPUT"
          else
            echo "operations_cidr=0.0.0.0/0" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------
      # Deploy Network Stack
      # ----------------------------------------------------------

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network/network-stack.yaml \
            --stack-name "${NETWORK_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              OperationsCidr="${{ steps.cidr.outputs.operations_cidr }}" \
              KeyPairName="${{ vars.EC2_KEY_PAIR_NAME }}" \
              EC2AmiId="${{ vars.EC2_AMI_ID }}" \
              EC2InstanceType="${{ vars.EC2_INSTANCE_TYPE || 't3.micro' }}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ----------------------------------------------------------
      # Get Dashboard EC2 information
      # ----------------------------------------------------------

      - name: Get Dashboard EC2 Instance
        id: dashboard
        shell: bash
        run: |
          set -e

          echo "Waiting for CloudFormation stack..."

          aws cloudformation wait stack-update-complete \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" || true

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue | [0]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: DashboardInstanceId was not found in network stack outputs."
            exit 1
          fi

          echo "Dashboard Instance ID: $INSTANCE_ID"

          echo "Waiting for EC2 instance to become running..."

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID" \
            --region "${AWS_REGION}"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "${AWS_REGION}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: Dashboard EC2 does not have a public IP."
            exit 1
          fi

          echo "Dashboard Public IP: $PUBLIC_IP"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. DEPLOY DATA
  # RDS MySQL
  # S3
  # ============================================================

  deploy-data:

    needs: deploy-network

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data/data-stack.yaml \
            --region "${AWS_REGION}"

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data/data-stack.yaml \
            --stack-name "${DATA_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ----------------------------------------------------------
      # Get RDS information
      # ----------------------------------------------------------

      - name: Get RDS Stack Outputs
        id: rds
        shell: bash
        run: |

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseName'].OutputValue | [0]" \
            --output text)

          echo "RDS Host: $DB_HOST"
          echo "RDS Port: $DB_PORT"
          echo "Database: $DB_NAME"


  # ============================================================
  # 3. DEPLOY IAM
  # ============================================================

  deploy-iam:

    needs:
      - deploy-network
      - deploy-data

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Dashboard Instance ID
        id: dashboard
        shell: bash
        run: |

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue | [0]" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam/iam-stack.yaml \
            --region "${AWS_REGION}"

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam/iam-stack.yaml \
            --stack-name "${IAM_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              DashboardInstanceId="${{ steps.dashboard.outputs.instance_id }}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ============================================================
  # 4. DEPLOY AUTHENTICATION
  # ============================================================

  deploy-auth:

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Validate Authentication Stack
      # ----------------------------------------------------------

      - name: Validate Auth Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth/auth-stack.yaml \
            --region "${AWS_REGION}"

      # ----------------------------------------------------------
      # Deploy Authentication Stack
      # ----------------------------------------------------------

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth/auth-stack.yaml \
            --stack-name "${AUTH_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ----------------------------------------------------------
      # Seed Admin Token
      #
      # ADMIN_TOKEN is taken from GitHub Secret.
      #
      # The token should be hashed using SHA-256 by the
      # authentication/schema Lambda before storing in RDS.
      # ----------------------------------------------------------

      - name: Seed Admin Authentication
        shell: bash
        env:
          ADMIN_ID: ${{ vars.ADMIN_ID || 'ADMIN001' }}
          ADMIN_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ERROR: AUTH_TOKEN GitHub secret is not configured."
            exit 1
          fi

          PAYLOAD=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "admin_id": os.environ["ADMIN_ID"],
              "admin_token": os.environ["ADMIN_TOKEN"]
          }))
          PY
          )

          echo "Seeding admin authentication..."

          aws lambda invoke \
            --function-name "CloudMart-${ENVIRONMENT}-schema" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --region "${AWS_REGION}" \
            /tmp/schema-response.json

          cat /tmp/schema-response.json


  # ============================================================
  # 5. DEPLOY API
  # Product Service
  # Order Service
  # Authorizer
  # ============================================================

  deploy-api:

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-auth

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Package Product Lambda
      # ----------------------------------------------------------

      - name: Package Product Lambda
        shell: bash
        run: |

          if [ -d "lambda/product" ]; then

            cd lambda/product

            if [ -f requirements.txt ]; then
              pip install \
                -r requirements.txt \
                -t .
            fi

            cd ../..

            zip -r product-lambda.zip lambda/product

          else
            echo "lambda/product directory not found."
          fi

      # ----------------------------------------------------------
      # Package Order Lambda
      # ----------------------------------------------------------

      - name: Package Order Lambda
        shell: bash
        run: |

          if [ -d "lambda/order" ]; then

            cd lambda/order

            if [ -f requirements.txt ]; then
              pip install \
                -r requirements.txt \
                -t .
            fi

            cd ../..

            zip -r order-lambda.zip lambda/order

          else
            echo "lambda/order directory not found."
          fi

      # ----------------------------------------------------------
      # Package Authorizer
      # ----------------------------------------------------------

      - name: Package Authorizer Lambda
        shell: bash
        run: |

          if [ -d "lambda/authorizer" ]; then

            cd lambda/authorizer

            if [ -f requirements.txt ]; then
              pip install \
                -r requirements.txt \
                -t .
            fi

            cd ../..

            zip -r authorizer-lambda.zip lambda/authorizer

          else
            echo "lambda/authorizer directory not found."
          fi

      # ----------------------------------------------------------
      # Validate API Stack
      # ----------------------------------------------------------

      - name: Validate API Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"

      # ----------------------------------------------------------
      # Deploy API Stack
      # ----------------------------------------------------------

      - name: Deploy API Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name "${API_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ============================================================
  # 6. DEPLOY EVENTBRIDGE
  # Low Stock Event
  # SNS Notification
  # ============================================================

  deploy-eventbridge:

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-api

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate EventBridge Stack
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/eventbridge/eventbridge-stack.yaml \
            --region "${AWS_REGION}"

      - name: Deploy EventBridge Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/eventbridge/eventbridge-stack.yaml \
            --stack-name "${EVENTBRIDGE_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ============================================================
  # 7. DEPLOY REPORTING
  # Report Lambda
  # S3
  # ============================================================

  deploy-reporting:

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-api

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Reporting Stack
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/reporting/reporting-stack.yaml \
            --region "${AWS_REGION}"

      - name: Deploy Reporting Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/reporting/reporting-stack.yaml \
            --stack-name "${REPORTING_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ============================================================
  # 8. DEPLOY MONITORING
  # ============================================================

  deploy-monitoring:

    needs:
      - deploy-network
      - deploy-data
      - deploy-api

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Monitoring Stack
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/monitoring/monitoring-stack.yaml \
            --region "${AWS_REGION}"

      - name: Deploy Monitoring Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/monitoring/monitoring-stack.yaml \
            --stack-name "${MONITORING_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


  # ============================================================
  # 9. DEPLOY DASHBOARD TO NEW EC2
  # ============================================================

  deploy-dashboard:

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-api
      - deploy-eventbridge
      - deploy-reporting
      - deploy-monitoring

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Get NEW EC2 instance
      # ----------------------------------------------------------

      - name: Get Dashboard EC2 Details
        id: dashboard
        shell: bash
        run: |

          set -e

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue | [0]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: DashboardInstanceId not found."
            exit 1
          fi

          echo "Dashboard Instance ID: $INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID" \
            --region "${AWS_REGION}"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "${AWS_REGION}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: Public IP not found."
            exit 1
          fi

          echo "Dashboard Public IP: $PUBLIC_IP"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Configure SSH
      # ----------------------------------------------------------

      - name: Configure SSH
        shell: bash
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/cloudmart-dashboard.pem

          chmod 600 ~/.ssh/cloudmart-dashboard.pem

          ssh-keyscan -H \
            "${{ steps.dashboard.outputs.public_ip }}" \
            >> ~/.ssh/known_hosts

      # ----------------------------------------------------------
      # Wait for EC2 SSH
      # ----------------------------------------------------------

      - name: Wait for SSH
        shell: bash
        run: |

          for i in {1..30}; do

            if ssh \
              -i ~/.ssh/cloudmart-dashboard.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ec2-user@"${{ steps.dashboard.outputs.public_ip }}" \
              "echo SSH connection successful"; then

              exit 0

            fi

            echo "Waiting for SSH..."
            sleep 10

          done

          echo "ERROR: SSH connection failed."
          exit 1

      # ----------------------------------------------------------
      # Install dashboard dependencies
      # ----------------------------------------------------------

      - name: Prepare Dashboard EC2
        shell: bash
        run: |

          ssh \
            -i ~/.ssh/cloudmart-dashboard.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@"${{ steps.dashboard.outputs.public_ip }}" \
            <<'EOF'

          set -e

          echo "Updating packages..."

          sudo dnf update -y

          echo "Installing Python..."

          sudo dnf install -y python3 python3-pip

          mkdir -p ~/cloudmart-dashboard

          EOF

      # ----------------------------------------------------------
      # Copy dashboard files
      # ----------------------------------------------------------

      - name: Copy Dashboard Files
        shell: bash
        run: |

          if [ -d "dashboard" ]; then

            scp \
              -i ~/.ssh/cloudmart-dashboard.pem \
              -o StrictHostKeyChecking=no \
              -r dashboard/* \
              ec2-user@"${{ steps.dashboard.outputs.public_ip }}":~/cloudmart-dashboard/

          elif [ -d "dashboard-app" ]; then

            scp \
              -i ~/.ssh/cloudmart-dashboard.pem \
              -o StrictHostKeyChecking=no \
              -r dashboard-app/* \
              ec2-user@"${{ steps.dashboard.outputs.public_ip }}":~/cloudmart-dashboard/

          else

            echo "Dashboard directory not found."

          fi

      # ----------------------------------------------------------
      # Install Python dependencies
      # ----------------------------------------------------------

      - name: Install Dashboard Dependencies
        shell: bash
        run: |

          ssh \
            -i ~/.ssh/cloudmart-dashboard.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@"${{ steps.dashboard.outputs.public_ip }}" \
            <<'EOF'

          set -e

          cd ~/cloudmart-dashboard

          if [ -f requirements.txt ]; then
            pip3 install --user -r requirements.txt
          fi

          EOF

      # ----------------------------------------------------------
      # Start Flask Dashboard
      # ----------------------------------------------------------

      - name: Start Dashboard
        shell: bash
        run: |

          ssh \
            -i ~/.ssh/cloudmart-dashboard.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@"${{ steps.dashboard.outputs.public_ip }}" \
            <<'EOF'

          set -e

          cd ~/cloudmart-dashboard

          if [ -f app.py ]; then

            pkill -f "python.*app.py" || true

            nohup python3 app.py \
              > dashboard.log 2>&1 &

            echo "Dashboard started."

          elif [ -f application.py ]; then

            pkill -f "python.*application.py" || true

            nohup python3 application.py \
              > dashboard.log 2>&1 &

            echo "Dashboard started."

          else

            echo "No app.py or application.py found."

          fi

          EOF

      # ----------------------------------------------------------
      # Deployment summary
      # ----------------------------------------------------------

      - name: Deployment Summary
        run: |

          echo "=============================================="
          echo "CloudMart deployment completed"
          echo "=============================================="
          echo "Environment: ${ENVIRONMENT}"
          echo "Region: ${AWS_REGION}"
          echo "Network Stack: ${NETWORK_STACK_NAME}"
          echo "Dashboard Instance: ${{ steps.dashboard.outputs.instance_id }}"
          echo "Dashboard Public IP: ${{ steps.dashboard.outputs.public_ip }}"
          echo "=============================================="
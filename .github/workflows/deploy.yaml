name: CloudMart Infrastructure

on:
  push:
    branches:
      - main
      - orders

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  id-token: write
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  NETWORK_STACK_NAME: cloudmart-dev-network
  DATA_STACK_NAME: cloudmart-dev-data
  IAM_STACK_NAME: cloudmart-dev-iam
  AUTH_STACK_NAME: cloudmart-dev-auth
  API_STACK_NAME: cloudmart-dev-api
  EVENTBRIDGE_STACK_NAME: CloudMart-dev-eventbridge


# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # JOB 1 - NETWORK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS access
        run: |
          aws sts get-caller-identity


      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network/network-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network/network-stack.yaml \
            --stack-name "${NETWORK_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      - name: Check Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


  # ============================================================
  # JOB 2 - DATA / RDS
  # ============================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify required RDS password secret
        shell: bash
        run: |
          if [ -z "${{ secrets.RDS_MASTER_PASSWORD }}" ]; then
            echo "ERROR: RDS_MASTER_PASSWORD GitHub secret is not configured."
            exit 1
          fi


      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data/data-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy Data Stack
        env:
          DB_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data/data-stack.yaml \
            --stack-name "${DATA_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="${DB_PASSWORD}" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      - name: Verify database SSM parameters are String
        run: |
          for PARAMETER in \
            "/cloudmart/${ENVIRONMENT}/db/username" \
            "/cloudmart/${ENVIRONMENT}/db/password"; do

            TYPE=$(aws ssm get-parameter \
              --name "${PARAMETER}" \
              --region "${AWS_REGION}" \
              --query "Parameter.Type" \
              --output text)

            echo "${PARAMETER}: ${TYPE}"

            if [ "${TYPE}" != "String" ]; then
              echo "ERROR: ${PARAMETER} is not an SSM String parameter."
              exit 1
            fi
          done


      - name: Check Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


  # ============================================================
  # JOB 3 - IAM
  # ============================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam/iam-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam/iam-stack.yaml \
            --stack-name "${IAM_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      - name: Verify IAM outputs
        shell: bash
        run: |
          set -e

          for OUTPUT in \
            "AuthorizerLambdaRoleArn" \
            "ProductLambdaRoleArn" \
            "OrderProcessorLambdaRoleArn"; do

            VALUE=$(aws cloudformation describe-stacks \
              --stack-name "${IAM_STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='${OUTPUT}'].OutputValue | [0]" \
              --output text)

            if [ -z "${VALUE}" ] || [ "${VALUE}" = "None" ]; then
              echo "ERROR: Missing IAM output ${OUTPUT}"
              exit 1
            fi

            echo "${OUTPUT}: ${VALUE}"
          done


  # ============================================================
  # JOB 4 - AUTHENTICATION
  # ============================================================

  deploy-auth:
    name: Deploy Authentication Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify required authentication secret
        shell: bash
        run: |
          if [ -z "${{ secrets.AUTH_TOKEN }}" ]; then
            echo "ERROR: AUTH_TOKEN GitHub secret is not configured."
            exit 1
          fi


      - name: Get Lambda artifact bucket
        id: bucket
        shell: bash
        run: |
          set -e

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          test -n "${BUCKET}" && test "${BUCKET}" != "None"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"


      - name: Package Authorizer Lambda
        run: |
          rm -rf authorizer-package authorizer.zip
          mkdir -p authorizer-package

          cp lambda/authorizer/lambda_function.py authorizer-package/index.py

          pip install \
            -r lambda/authorizer/requirements.txt \
            -t authorizer-package

          (cd authorizer-package && zip -qr ../authorizer.zip .)

          ls -lh authorizer.zip


      - name: Upload Authorizer package
        run: |
          aws s3 cp \
            authorizer.zip \
            "s3://${{ steps.bucket.outputs.bucket }}/authorizer/authorizer.zip" \
            --region "${AWS_REGION}"


      # ----------------------------------------------------------
      # ADMIN TOKEN
      #
      # Stored as normal SSM String.
      # NOT SecureString.
      # ----------------------------------------------------------

      - name: Create or update admin authentication token
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --type "String" \
            --value "${{ secrets.AUTH_TOKEN }}" \
            --overwrite \
            --region "${AWS_REGION}"


      - name: Verify admin authentication parameter is String
        run: |
          TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --region "${AWS_REGION}" \
            --query "Parameter.Type" \
            --output text)

          echo "Admin authentication parameter type: ${TYPE}"

          if [ "${TYPE}" != "String" ]; then
            echo "ERROR: Admin authentication parameter is not an SSM String."
            exit 1
          fi


      - name: Verify database SSM parameters
        run: |
          for PARAMETER in \
            "/cloudmart/${ENVIRONMENT}/db/host" \
            "/cloudmart/${ENVIRONMENT}/db/port" \
            "/cloudmart/${ENVIRONMENT}/db/name" \
            "/cloudmart/${ENVIRONMENT}/db/username" \
            "/cloudmart/${ENVIRONMENT}/db/password"; do

            aws ssm get-parameter \
              --name "${PARAMETER}" \
              --region "${AWS_REGION}" \
              --query "Parameter.Name" \
              --output text
          done


      - name: Validate Auth CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth/auth-stack.yaml \
            --region "${AWS_REGION}"


      - name: Get Lambda Security Group
        id: network
        shell: bash
        run: |
          SG=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          test -n "${SG}" && test "${SG}" != "None"

          echo "security_group=${SG}" >> "$GITHUB_OUTPUT"


      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth/auth-stack.yaml \
            --stack-name "${AUTH_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              LambdaSecurityGroupId="${{ steps.network.outputs.security_group }}" \
              AdminAuthTokenParameterName="/cloudmart/${ENVIRONMENT}/auth/admin-token" \
              DBHostParameter="/cloudmart/${ENVIRONMENT}/db/host" \
              DBPortParameter="/cloudmart/${ENVIRONMENT}/db/port" \
              DBNameParameter="/cloudmart/${ENVIRONMENT}/db/name" \
              DBUsernameParameter="/cloudmart/${ENVIRONMENT}/db/username" \
              DBPasswordParameter="/cloudmart/${ENVIRONMENT}/db/password" \
              LambdaArtifactBucketName="${{ steps.bucket.outputs.bucket }}" \
              LambdaArtifactKey="authorizer/authorizer.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      - name: Check Auth Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


  # ============================================================
  # JOB 5 - API / ORDER LAMBDAS
  # ============================================================

  deploy-api:
    name: Deploy API and Order Processing
    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-auth

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Get network outputs
        id: network
        shell: bash
        run: |
          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue | [0]" \
            --output text)

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue | [0]" \
            --output text)

          SG=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          test -n "${SUBNET_A}" && test "${SUBNET_A}" != "None"
          test -n "${SUBNET_B}" && test "${SUBNET_B}" != "None"
          test -n "${SG}" && test "${SG}" != "None"

          echo "subnets=${SUBNET_A},${SUBNET_B}" >> "$GITHUB_OUTPUT"
          echo "security_group=${SG}" >> "$GITHUB_OUTPUT"


      - name: Get Lambda artifact bucket
        id: bucket
        shell: bash
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          test -n "${BUCKET}" && test "${BUCKET}" != "None"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"


      - name: Get authorizer Lambda ARN
        id: auth
        shell: bash
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue | [0]" \
            --output text)

          test -n "${ARN}" && test "${ARN}" != "None"

          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"


      - name: Get IAM role ARNs
        id: roles
        shell: bash
        run: |
          PRODUCT=$(aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          PROCESSOR=$(aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='OrderProcessorLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          test -n "${PRODUCT}" && test "${PRODUCT}" != "None"
          test -n "${PROCESSOR}" && test "${PROCESSOR}" != "None"

          echo "product=${PRODUCT}" >> "$GITHUB_OUTPUT"
          echo "processor=${PROCESSOR}" >> "$GITHUB_OUTPUT"


      - name: Prepare Lambda build directories
        run: |
          rm -rf build
          mkdir -p build/product build/schema build/order-processor


      - name: Package Product Lambda
        run: |
          cp lambda/product/lambda_function.py build/product/
          cp lambda/product/requirements.txt build/product/

          pip install \
            -r build/product/requirements.txt \
            -t build/product

          rm build/product/requirements.txt

          (cd build/product && zip -qr ../../product.zip .)


      - name: Package Schema Lambda
        run: |
          cp lambda/schema/lambda_function.py build/schema/
          cp lambda/schema/requirements.txt build/schema/

          pip install \
            -r build/schema/requirements.txt \
            -t build/schema

          rm build/schema/requirements.txt

          (cd build/schema && zip -qr ../../schema.zip .)


      - name: Package Order Processor Lambda
        run: |
          cp lambda/order_processor/lambda_function.py build/order-processor/
          cp lambda/order_processor/requirements.txt build/order-processor/

          pip install \
            -r build/order-processor/requirements.txt \
            -t build/order-processor

          rm build/order-processor/requirements.txt

          (cd build/order-processor && zip -qr ../../order-processor.zip .)


      - name: Upload Lambda packages to S3
        run: |
          BUCKET="${{ steps.bucket.outputs.bucket }}"

          aws s3 cp \
            product.zip \
            "s3://${BUCKET}/product/product.zip"

          aws s3 cp \
            schema.zip \
            "s3://${BUCKET}/schema/schema.zip"

          aws s3 cp \
            order-processor.zip \
            "s3://${BUCKET}/order-processor/order-processor.zip"


          aws s3api head-object \
            --bucket "${BUCKET}" \
            --key product/product.zip

          aws s3api head-object \
            --bucket "${BUCKET}" \
            --key schema/schema.zip

          aws s3api head-object \
            --bucket "${BUCKET}" \
            --key order-processor/order-processor.zip


      - name: Validate API CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.network.outputs.subnets }}" \
              LambdaSecurityGroupId="${{ steps.network.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.roles.outputs.product }}" \
              OrderProcessorLambdaExecutionRoleArn="${{ steps.roles.outputs.processor }}" \
              AuthorizerLambdaArn="${{ steps.auth.outputs.arn }}" \
              ProductLambdaCodeBucket="${{ steps.bucket.outputs.bucket }}" \
              ProductLambdaCodeKey="product/product.zip" \
              SchemaLambdaCodeKey="schema/schema.zip" \
              OrderProcessorLambdaCodeKey="order-processor/order-processor.zip" \
              DBHostParameter="/cloudmart/${ENVIRONMENT}/db/host" \
              DBPortParameter="/cloudmart/${ENVIRONMENT}/db/port" \
              DBNameParameter="/cloudmart/${ENVIRONMENT}/db/name" \
              DBUsernameParameter="/cloudmart/${ENVIRONMENT}/db/username" \
              DBPasswordParameter="/cloudmart/${ENVIRONMENT}/db/password" \
              AuthorizerCacheTTL="0" \
              EventBusName="cloudmart-${ENVIRONMENT}-event-bus" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
            --no-fail-on-empty-changeset


      - name: Initialize or migrate database schema
        shell: bash
        run: |
          rm -f schema-response.json

          FUNCTION_ERROR=$(aws lambda invoke \
            --function-name "CloudMart-${ENVIRONMENT}-schema" \
            --region "${AWS_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --query 'FunctionError' \
            --output text \
            schema-response.json)

          cat schema-response.json

          if [ "${FUNCTION_ERROR}" != "None" ] && [ "${FUNCTION_ERROR}" != "null" ]; then
            echo "Schema Lambda returned a function error: ${FUNCTION_ERROR}"
            exit 1
          fi


  # ============================================================
  # JOB 6 - EVENTBRIDGE + SNS
  # ============================================================

  deploy-eventbridge:
    name: Deploy EventBridge and SNS
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Validate EventBridge CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/eventbridge/eventbridge-stack.yaml \
            --region "${AWS_REGION}"


      - name: Verify API stack exists
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


      - name: Deploy EventBridge and SNS stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/eventbridge/eventbridge-stack.yaml \
            --stack-name "${EVENTBRIDGE_STACK_NAME}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
              OrderNotificationEmail="${{ secrets.ORDER_NOTIFICATION_EMAIL }}" \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      - name: Show final stack outputs
        run: |
          echo "================ API OUTPUTS ================"

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


          echo "=========== EVENTBRIDGE OUTPUTS ============="

          aws cloudformation describe-stacks \
            --stack-name "${EVENTBRIDGE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table
  # ============================================================
  # JOB 7 - MILESTONE 5 MONITORING
  # ============================================================

  deploy-monitoring:
    name: Deploy Monitoring and EC2 Dashboard
    runs-on: ubuntu-latest

    needs:
      - deploy-eventbridge

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # GET EXISTING ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda artifact bucket
        id: bucket
        shell: bash
        run: |

          set -e

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          test -n "${BUCKET}"
          test "${BUCKET}" != "None"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"


      # ========================================================
      # PACKAGE DASHBOARD
      # ========================================================

      - name: Package dashboard
        shell: bash
        run: |

          set -e

          rm -rf dashboard-build
          rm -f dashboard.zip

          mkdir -p \
            dashboard-build/dashboard/templates

          cp \
            dashboard/app.py \
            dashboard-build/dashboard/app.py

          cp \
            dashboard/templates/index.html \
            dashboard-build/dashboard/templates/index.html

          cp \
            dashboard/templates/login.html \
            dashboard-build/dashboard/templates/login.html

          (
            cd dashboard-build
            zip -qr ../dashboard.zip dashboard
          )

          ls -lh dashboard.zip


      # ========================================================
      # PACKAGE DAILY REPORT LAMBDA
      # ========================================================

      - name: Package daily report Lambda
        shell: bash
        run: |

          set -e

          rm -rf daily-report-build
          rm -f daily-report.zip

          mkdir -p daily-report-build

          cp \
            lambda/daily_report/lambda_function.py \
            daily-report-build/index.py

          cp \
            lambda/daily_report/requirements.txt \
            daily-report-build/requirements.txt

          pip install \
            -r daily-report-build/requirements.txt \
            -t daily-report-build

          rm \
            daily-report-build/requirements.txt

          (
            cd daily-report-build
            zip -qr ../daily-report.zip .
          )

          ls -lh daily-report.zip


      # ========================================================
      # UPLOAD DASHBOARD
      #
      # SHA is used in the key so a changed dashboard
      # creates a new object and forces the EC2 deployment
      # to receive the new version.
      # ========================================================

      - name: Upload dashboard package
        run: |

          DASHBOARD_KEY="dashboard/dashboard-${GITHUB_SHA}.zip"

          aws s3 cp \
            dashboard.zip \
            "s3://${{ steps.bucket.outputs.bucket }}/${DASHBOARD_KEY}" \
            --region "${AWS_REGION}"

          echo \
            "DASHBOARD_KEY=${DASHBOARD_KEY}" \
            >> "$GITHUB_ENV"


      # ========================================================
      # UPLOAD REPORT LAMBDA
      # ========================================================

      - name: Upload daily report Lambda
        run: |

          REPORT_KEY="daily-report/daily-report-${GITHUB_SHA}.zip"

          aws s3 cp \
            daily-report.zip \
            "s3://${{ steps.bucket.outputs.bucket }}/${REPORT_KEY}" \
            --region "${AWS_REGION}"

          echo \
            "REPORT_KEY=${REPORT_KEY}" \
            >> "$GITHUB_ENV"


      # ========================================================
      # VALIDATE MONITORING TEMPLATE
      # ========================================================

      - name: Validate monitoring CloudFormation template
        run: |

          aws cloudformation validate-template \
            --template-body \
            file://cloudformation/monitoring/monitoring-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # DEPLOY MONITORING STACK
      # ========================================================

      - name: Deploy monitoring stack
        run: |

          aws cloudformation deploy \
            --template-file \
            cloudformation/monitoring/monitoring-stack.yaml \
            --stack-name \
            "cloudmart-${ENVIRONMENT}-monitoring" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              OperationsEmail="${{ secrets.OPERATIONS_EMAIL }}" \
              DashboardArtifactBucketName="${{ steps.bucket.outputs.bucket }}" \
              DashboardArtifactKey="${DASHBOARD_KEY}" \
              ReportLambdaCodeBucket="${{ steps.bucket.outputs.bucket }}" \
              ReportLambdaCodeKey="${REPORT_KEY}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset


      # ========================================================
      # WAIT FOR DASHBOARD EC2
      # ========================================================

      - name: Get dashboard report bucket
        id: report_bucket
        shell: bash
        run: |
          set -e

          REPORT_BUCKET=$(aws cloudformation describe-stacks             --stack-name "cloudmart-${ENVIRONMENT}-monitoring"             --region "${AWS_REGION}"             --query "Stacks[0].Parameters[?ParameterKey=='ReportsBucketName'].ParameterValue | [0]"             --output text)

          test -n "${REPORT_BUCKET}"
          test "${REPORT_BUCKET}" != "None"

          echo "report_bucket=${REPORT_BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Get dashboard EC2 instance ID
        id: dashboard
        shell: bash
        run: |
          set -e

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-${ENVIRONMENT}-monitoring" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue | [0]" \
            --output text)

          test -n "${INSTANCE_ID}"
          test "${INSTANCE_ID}" != "None"

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Dashboard instance: ${INSTANCE_ID}"


      - name: Wait for EC2 instance
        shell: bash
        run: |
          set -e

          aws ec2 wait instance-running \
            --instance-ids "${{ steps.dashboard.outputs.instance_id }}" \
            --region "${AWS_REGION}"


      - name: Wait for SSM agent
        shell: bash
        run: |
          set -e

          for i in $(seq 1 30); do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.dashboard.outputs.instance_id }}" \
              --region "${AWS_REGION}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "SSM status: ${STATUS}"

            if [ "${STATUS}" = "Online" ]; then
              exit 0
            fi

            sleep 10

          done

          echo "ERROR: Dashboard EC2 did not become Online in SSM."
          exit 1


      # ========================================================
      # INSTALL AND CONFIGURE DASHBOARD THROUGH SSM
      # ========================================================

      - name: Install dashboard software through SSM
        id: dashboard_setup
        shell: bash
        run: |
          set -e

          DASHBOARD_BUCKET="${{ steps.bucket.outputs.bucket }}"
          DASHBOARD_KEY="${DASHBOARD_KEY}"
          REPORT_BUCKET="${{ steps.report_bucket.outputs.report_bucket }}"

          read -r -d '' BOOTSTRAP <<EOF || true
          #!/bin/bash
          set -eux

          exec > >(tee /var/log/cloudmart-dashboard-ssm.log | logger -t cloudmart-dashboard) 2>&1

          echo "Installing CloudMart dashboard dependencies..."

          dnf update -y
          dnf install -y python3.12 python3.12-pip nginx unzip openssl

          mkdir -p /opt/cloudmart-dashboard
          mkdir -p /etc/cloudmart-dashboard

          rm -rf /opt/cloudmart-dashboard/app
          mkdir -p /opt/cloudmart-dashboard/app

          aws s3 cp "s3://${DASHBOARD_BUCKET}/${DASHBOARD_KEY}" /tmp/cloudmart-dashboard.zip --region ${AWS_REGION}

          unzip -o /tmp/cloudmart-dashboard.zip -d /opt/cloudmart-dashboard/app

          rm -rf /opt/cloudmart-dashboard/venv

          python3.12 -m venv /opt/cloudmart-dashboard/venv

          /opt/cloudmart-dashboard/venv/bin/pip install --upgrade pip

          /opt/cloudmart-dashboard/venv/bin/pip install \
            Flask \
            boto3 \
            PyMySQL \
            gunicorn

          if [ ! -s /etc/cloudmart-dashboard/flask-secret ]; then
            openssl rand -hex 32 > /etc/cloudmart-dashboard/flask-secret
            chmod 600 /etc/cloudmart-dashboard/flask-secret
          fi

          cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICE'
          [Unit]
          Description=CloudMart Flask Operations Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/cloudmart-dashboard/app/dashboard
          Environment=ENVIRONMENT=${ENVIRONMENT}
          Environment=AWS_REGION=${AWS_REGION}
          Environment=DB_HOST_PARAMETER=/cloudmart/${ENVIRONMENT}/db/host
          Environment=DB_PORT_PARAMETER=/cloudmart/${ENVIRONMENT}/db/port
          Environment=DB_NAME_PARAMETER=/cloudmart/${ENVIRONMENT}/db/name
          Environment=DB_USERNAME_PARAMETER=/cloudmart/${ENVIRONMENT}/db/username
          Environment=DB_PASSWORD_PARAMETER=/cloudmart/${ENVIRONMENT}/db/password
          Environment=ADMIN_AUTH_TOKEN_PARAMETER=/cloudmart/${ENVIRONMENT}/auth/admin-token
          Environment=FLASK_SECRET_KEY_FILE=/etc/cloudmart-dashboard/flask-secret
          Environment=REPORT_BUCKET=${REPORT_BUCKET}
          ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

          rm -f /etc/nginx/conf.d/default.conf

          nginx -t

          systemctl daemon-reload
          systemctl enable --now cloudmart-dashboard
          systemctl enable --now nginx

          systemctl is-active --quiet cloudmart-dashboard
          systemctl is-active --quiet nginx

          echo "CloudMart dashboard installation completed."
          EOF

          COMMANDS_JSON=$(jq -n --arg command "$BOOTSTRAP" '{commands:[$command]}')

          printf '%s' "$COMMANDS_JSON" > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.dashboard.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --comment "CloudMart dashboard installation from GitHub Actions" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${COMMAND_ID}"


      - name: Wait for dashboard installation
        shell: bash
        run: |
          set -e

          COMMAND_ID="${{ steps.dashboard_setup.outputs.command_id }}"
          INSTANCE_ID="${{ steps.dashboard.outputs.instance_id }}"

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Dashboard installation status: ${STATUS}"

            case "${STATUS}" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "ERROR: Dashboard installation failed."
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query "[Status,StatusDetails,StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10

          done

          echo "ERROR: Timed out waiting for dashboard installation."
          exit 1


      - name: Verify dashboard services
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.dashboard.outputs.instance_id }}"

          read -r -d '' VERIFY <<'EOF' || true
          set -e
          systemctl is-active --quiet cloudmart-dashboard
          systemctl is-active --quiet nginx
          curl -fsS http://127.0.0.1/ >/tmp/cloudmart-dashboard-check.html
          test -s /tmp/cloudmart-dashboard-check.html
          echo "Dashboard services and local HTTP endpoint are healthy."
          EOF

          VERIFY_JSON=$(jq -n --arg command "$VERIFY" '{commands:[$command]}')
          printf '%s' "$VERIFY_JSON" > verify-commands.json

          VERIFY_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://verify-commands.json \
            --comment "Verify CloudMart dashboard services" \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          for i in $(seq 1 30); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${VERIFY_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Dashboard verification status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              exit 0
            fi

            if [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "${VERIFY_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "[Status,StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi

            sleep 5

          done

          echo "ERROR: Dashboard verification timed out."
          exit 1


      - name: Verify dashboard from GitHub runner
        shell: bash
        run: |
          set -e

          DASHBOARD_URL=$(aws cloudformation describe-stacks             --stack-name "cloudmart-${ENVIRONMENT}-monitoring"             --region "${AWS_REGION}"             --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue | [0]"             --output text)

          test -n "${DASHBOARD_URL}"
          test "${DASHBOARD_URL}" != "None"

          echo "Dashboard URL: ${DASHBOARD_URL}"

          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${DASHBOARD_URL}" >/tmp/cloudmart-dashboard.html; then
              test -s /tmp/cloudmart-dashboard.html
              echo "Dashboard is reachable."
              exit 0
            fi
            echo "Dashboard is not reachable yet. Retrying..."
            sleep 10
          done

          echo "ERROR: Dashboard URL is not reachable."
          exit 1


      # ========================================================
      # SHOW MONITORING OUTPUTS
      # ========================================================

      - name: Show monitoring outputs
        run: |

          echo "================ MONITORING OUTPUTS ================"

          aws cloudformation describe-stacks \
            --stack-name \
            "cloudmart-${ENVIRONMENT}-monitoring" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table
            
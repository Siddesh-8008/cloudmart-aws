name: CloudMart Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  # ============================================================
  # NETWORK
  # ============================================================

    deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate Network CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network/network-stack.yaml

      - name: Get GitHub Actions public IP
        id: public-ip
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=${IP}/32" >> "$GITHUB_OUTPUT"
          echo "GitHub Actions public IP detected."

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network/network-stack.yaml \
            --stack-name cloudmart-dev-network \
            --parameter-overrides \
              Environment=dev \
              OperationsCidr="${{ steps.public-ip.outputs.ip }}" \
            --region ${AWS_REGION}

      - name: Check Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region ${AWS_REGION}


  # ============================================================
  # DATA
  # ============================================================

    deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Data CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data/data-stack.yaml

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data/data-stack.yaml \
            --stack-name cloudmart-dev-data \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
            --region ${AWS_REGION}

      - name: Check Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region ${AWS_REGION}


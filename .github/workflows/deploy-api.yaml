name: CloudMart API Infrastructure

on:
  push:
    branches:
      - milestone-3
    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  API_STACK_NAME: cloudmart-dev-api
  DATA_STACK_NAME: cloudmart-dev-data
  NETWORK_STACK_NAME: cloudmart-dev-network
  IAM_STACK_NAME: cloudmart-dev-iam
  AUTH_STACK_NAME: cloudmart-dev-auth

jobs:

  build-and-deploy:
    name: Build and Deploy API Stack
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT SOURCE CODE
      # ------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. SETUP PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ------------------------------------------------------------
      # 3. CONFIGURE AWS CREDENTIALS
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------------
      # 4. VERIFY AWS CONNECTION
      # ------------------------------------------------------------
      - name: Verify AWS identity
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "AWS ACCOUNT"
          echo "======================================"

          aws sts get-caller-identity

          echo ""
          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"


      # ------------------------------------------------------------
      # 5. VERIFY REQUIRED STACKS
      # ------------------------------------------------------------
      - name: Verify required CloudFormation stacks
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING REQUIRED STACKS"
          echo "======================================"

          for STACK in \
            "${NETWORK_STACK_NAME}" \
            "${DATA_STACK_NAME}" \
            "${IAM_STACK_NAME}" \
            "${AUTH_STACK_NAME}"
          do
            echo ""
            echo "Checking: ${STACK}"

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${STACK}" \
              --query "Stacks[0].StackStatus" \
              --output text)

            echo "Status: ${STATUS}"

            case "${STATUS}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                echo "Stack is available."
                ;;
              *)
                echo "ERROR: Stack ${STACK} is not in a usable state."
                exit 1
                ;;
            esac
          done


      # ------------------------------------------------------------
      # 6. GET LAMBDA ARTIFACT BUCKET
      # ------------------------------------------------------------
      - name: Get Lambda Artifact Bucket
        id: artifact-bucket
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GETTING LAMBDA ARTIFACT BUCKET"
          echo "======================================"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          if [ -z "${BUCKET_NAME}" ] || [ "${BUCKET_NAME}" = "None" ]; then
            echo "ERROR: LambdaArtifactBucketName output was not found."
            echo ""
            echo "Available Data Stack outputs:"
            aws cloudformation describe-stacks \
              --stack-name "${DATA_STACK_NAME}" \
              --query "Stacks[0].Outputs" \
              --output table

            exit 1
          fi

          echo "Lambda Artifact Bucket: ${BUCKET_NAME}"

          echo "bucket=${BUCKET_NAME}" >> "${GITHUB_OUTPUT}"


      # ------------------------------------------------------------
      # 7. PACKAGE PRODUCT LAMBDA
      # ------------------------------------------------------------
      - name: Package Product Lambda
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          rm -rf build
          rm -f product.zip

          mkdir -p build/product

          echo ""
          echo "Copying Lambda source..."

          cp lambda/product/lambda_function.py build/product/

          echo ""
          echo "Checking requirements..."

          if [ -f lambda/product/requirements.txt ]; then

            if [ -s lambda/product/requirements.txt ]; then
              echo "Installing Product Lambda dependencies..."

              python -m pip install \
                -r lambda/product/requirements.txt \
                -t build/product \
                --upgrade \
                --no-cache-dir
            else
              echo "requirements.txt is empty."
              echo "No external dependencies required."
            fi

          else
            echo "No requirements.txt found."
            echo "No external dependencies required."
          fi

          echo ""
          echo "Creating product.zip..."

          python - <<'PY'
          import os
          import zipfile

          source_dir = "build/product"
          zip_file = "product.zip"

          with zipfile.ZipFile(
              zip_file,
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as z:

              for root, dirs, files in os.walk(source_dir):

                  for file_name in files:
                      file_path = os.path.join(root, file_name)

                      archive_name = os.path.relpath(
                          file_path,
                          source_dir
                      )

                      z.write(
                          file_path,
                          archive_name
                      )

          print(f"Created {zip_file}")
          PY

          echo ""
          echo "======================================"
          echo "PRODUCT ZIP CREATED"
          echo "======================================"

          ls -lh product.zip

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l product.zip | head -100


      # ------------------------------------------------------------
      # 8. VERIFY PRODUCT ZIP
      # ------------------------------------------------------------
      - name: Verify Product Lambda package
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING PRODUCT LAMBDA PACKAGE"
          echo "======================================"

          if [ ! -f product.zip ]; then
            echo "ERROR: product.zip was not created."
            exit 1
          fi

          if ! unzip -t product.zip >/dev/null; then
            echo "ERROR: product.zip is corrupted."
            exit 1
          fi

          if ! unzip -l product.zip | grep -q "lambda_function.py"; then
            echo "ERROR: lambda_function.py is missing from product.zip."
            exit 1
          fi

          echo "Product Lambda package is valid."


      # ------------------------------------------------------------
      # 9. UPLOAD PRODUCT ZIP TO S3
      # ------------------------------------------------------------
      - name: Upload Product Lambda package
        shell: bash
        run: |
          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"

          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          echo "Bucket: ${BUCKET_NAME}"

          aws s3 cp \
            product.zip \
            "s3://${BUCKET_NAME}/product/product.zip"

          echo ""
          echo "Product Lambda uploaded successfully."

          aws s3 ls \
            "s3://${BUCKET_NAME}/product/product.zip"


      # ------------------------------------------------------------
      # 10. VERIFY PRODUCT ZIP IN S3
      # ------------------------------------------------------------
      - name: Verify Product Lambda package in S3
        shell: bash
        run: |
          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"

          echo "======================================"
          echo "VERIFYING S3 LAMBDA PACKAGE"
          echo "======================================"

          aws s3api head-object \
            --bucket "${BUCKET_NAME}" \
            --key "product/product.zip"

          echo ""
          echo "S3 Product Lambda package verified."


      # ------------------------------------------------------------
      # 11. GET NETWORK VALUES
      # ------------------------------------------------------------
      - name: Get Network Stack values
        id: network
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GETTING NETWORK VALUES"
          echo "======================================"

          echo ""
          echo "Network Stack Outputs:"
          aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table

          PRIVATE_SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          echo ""
          echo "Private Subnet A: ${PRIVATE_SUBNET_A}"
          echo "Private Subnet B: ${PRIVATE_SUBNET_B}"
          echo "Lambda Security Group: ${LAMBDA_SECURITY_GROUP}"

          if [ -z "${PRIVATE_SUBNET_A}" ] || [ "${PRIVATE_SUBNET_A}" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          if [ -z "${PRIVATE_SUBNET_B}" ] || [ "${PRIVATE_SUBNET_B}" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          if [ -z "${LAMBDA_SECURITY_GROUP}" ] || [ "${LAMBDA_SECURITY_GROUP}" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "private_subnet_a=${PRIVATE_SUBNET_A}" >> "${GITHUB_OUTPUT}"
          echo "private_subnet_b=${PRIVATE_SUBNET_B}" >> "${GITHUB_OUTPUT}"
          echo "lambda_security_group=${LAMBDA_SECURITY_GROUP}" >> "${GITHUB_OUTPUT}"


      # ------------------------------------------------------------
      # 12. GET IAM PRODUCT LAMBDA ROLE
      # ------------------------------------------------------------
      - name: Get Product Lambda IAM Role
        id: iam
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GETTING PRODUCT LAMBDA IAM ROLE"
          echo "======================================"

          echo ""
          echo "IAM Stack Outputs:"
          aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table

          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "${ROLE_ARN}" ] || [ "${ROLE_ARN}" = "None" ]; then
            echo "ERROR: ProductLambdaExecutionRoleArn not found."
            exit 1
          fi

          echo "Product Lambda Role ARN: ${ROLE_ARN}"

          echo "role_arn=${ROLE_ARN}" >> "${GITHUB_OUTPUT}"


      # ------------------------------------------------------------
      # 13. GET AUTHORIZER ARN
      # ------------------------------------------------------------
      - name: Get Authorizer Lambda ARN
        id: authorizer
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GETTING AUTHORIZER LAMBDA ARN"
          echo "======================================"

          echo ""
          echo "Auth Stack Outputs:"
          aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table

          AUTHORIZE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue | [0]" \
            --output text)

          if [ -z "${AUTHORIZE_ARN}" ] || [ "${AUTHORIZE_ARN}" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "Authorizer Lambda ARN: ${AUTHORIZE_ARN}"

          echo "authorizer_arn=${AUTHORIZE_ARN}" >> "${GITHUB_OUTPUT}"


      # ------------------------------------------------------------
      # 14. VALIDATE API CLOUDFORMATION
      # ------------------------------------------------------------
      - name: Validate API CloudFormation
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VALIDATING API CLOUDFORMATION"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml

          echo ""
          echo "CloudFormation template validation successful."


      # ------------------------------------------------------------
      # 15. CREATE / UPDATE API STACK
      # ------------------------------------------------------------
      - name: Deploy API CloudFormation
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          PRIVATE_SUBNET_A="${{ steps.network.outputs.private_subnet_a }}"
          PRIVATE_SUBNET_B="${{ steps.network.outputs.private_subnet_b }}"

          PRIVATE_SUBNETS="${PRIVATE_SUBNET_A},${PRIVATE_SUBNET_B}"

          LAMBDA_SECURITY_GROUP="${{ steps.network.outputs.lambda_security_group }}"

          PRODUCT_ROLE="${{ steps.iam.outputs.role_arn }}"

          AUTHORIZE_ARN="${{ steps.authorizer.outputs.authorizer_arn }}"

          ARTIFACT_BUCKET="${{ steps.artifact-bucket.outputs.bucket }}"

          echo ""
          echo "Environment: ${ENVIRONMENT}"
          echo "Private Subnets: ${PRIVATE_SUBNETS}"
          echo "Lambda Security Group: ${LAMBDA_SECURITY_GROUP}"
          echo "Product Lambda Role: ${PRODUCT_ROLE}"
          echo "Authorizer ARN: ${AUTHORIZE_ARN}"
          echo "Artifact Bucket: ${ARTIFACT_BUCKET}"

          echo ""
          echo "Starting CloudFormation deployment..."

          aws cloudformation deploy \
            --stack-name "${API_STACK_NAME}" \
            --template-file cloudformation/api/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${PRIVATE_SUBNETS}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP}" \
              ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" \
              AuthorizerLambdaArn="${AUTHORIZE_ARN}" \
              ProductLambdaCodeKey="product/product.zip" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              AuthorizerCacheTTL="300" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
            --no-fail-on-empty-changeset

          echo ""
          echo "======================================"
          echo "API CLOUDFORMATION DEPLOYMENT COMPLETE"
          echo "======================================"


      # ------------------------------------------------------------
      # 16. SHOW API STACK STATUS
      # ------------------------------------------------------------
      - name: Show API Stack status
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CLOUDFORMATION STACK STATUS"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table


      # ------------------------------------------------------------
      # 17. SHOW API STACK OUTPUTS
      # ------------------------------------------------------------
      - name: Show API Stack outputs
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "API STACK OUTPUTS"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ------------------------------------------------------------
      # 18. SHOW CLOUDFORMATION EVENTS IF SOMETHING FAILS
      # ------------------------------------------------------------
      - name: Show CloudFormation events
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "CLOUDFORMATION EVENTS"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name "${API_STACK_NAME}" \
            --max-items 30 \
            --query "StackEvents[*].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true
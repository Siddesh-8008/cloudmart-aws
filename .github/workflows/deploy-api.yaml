name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "lambda/schema/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


permissions:

  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev


jobs:

  deploy-api:

    name: Build and Deploy CloudMart API

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume:
            ${{ secrets.AWS_ROLE_ARN }}

          aws-region:
            ${{ env.AWS_REGION }}


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS access

        run: |

          aws sts get-caller-identity


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # VERIFY FILES
      # ======================================================

      - name: Verify files

        run: |

          echo "======================================"
          echo "VERIFYING FILES"
          echo "======================================"

          test -f cloudformation/api/api-stack.yaml
          test -f lambda/product/lambda_function.py
          test -f lambda/product/requirements.txt

          test -f lambda/schema/lambda_function.py
          test -f lambda/schema/requirements.txt

          test -f schema/schema.sql

          echo "All required files exist."


      # ======================================================
      # GET ARTIFACT BUCKET
      # ======================================================

      - name: Get Lambda artifact bucket

        id: artifact

        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Artifact bucket not found."
            exit 1
          fi

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ======================================================
      # BUILD PRODUCT LAMBDA
      # ======================================================

      - name: Build Product Lambda

        run: |

          rm -rf lambda/product/package
          mkdir -p lambda/product/package

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/package/

          cp lambda/product/lambda_function.py \
             lambda/product/package/


      # ======================================================
      # PACKAGE PRODUCT LAMBDA
      # ======================================================

      - name: Package Product Lambda

        run: |

          cd lambda/product/package

          zip -r ../../../product.zip .

          cd ../../..

          echo "Product ZIP created."

          ls -lh product.zip


      # ======================================================
      # VERIFY PRODUCT ZIP
      # ======================================================

      - name: Verify Product Lambda ZIP

        run: |

          echo "======================================"
          echo "VERIFYING PRODUCT ZIP"
          echo "======================================"

          unzip -l product.zip > /tmp/product_zip.txt

          echo "Checking lambda_function.py..."

          grep "lambda_function.py" \
            /tmp/product_zip.txt || {
              echo "ERROR: lambda_function.py missing."
              exit 1
            }

          echo "Checking PyMySQL..."

          grep "pymysql" \
            /tmp/product_zip.txt || {
              echo "ERROR: PyMySQL missing."
              exit 1
            }

          echo "Checking cryptography..."

          grep "cryptography" \
            /tmp/product_zip.txt || {
              echo "ERROR: cryptography missing."
              exit 1
            }

          echo "Product Lambda package looks correct."


      # ======================================================
      # UPLOAD PRODUCT
      # ======================================================

      - name: Upload Product Lambda

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

        run: |

          PRODUCT_KEY="product/${GITHUB_SHA}/product.zip"

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_KEY}" \
            --region "${AWS_REGION}"

          echo "PRODUCT_KEY=${PRODUCT_KEY}" >> "$GITHUB_ENV"


      # ======================================================
      # BUILD SCHEMA LAMBDA
      # ======================================================

      - name: Build Schema Lambda

        run: |

          rm -rf lambda/schema/package
          mkdir -p lambda/schema/package

          python -m pip install \
            -r lambda/schema/requirements.txt \
            -t lambda/schema/package/

          cp lambda/schema/lambda_function.py \
             lambda/schema/package/


      # ======================================================
      # PACKAGE SCHEMA LAMBDA
      # ======================================================

      - name: Package Schema Lambda

        run: |

          cd lambda/schema/package

          zip -r ../../../schema.zip .

          cd ../../..

          echo "Schema ZIP created."

          ls -lh schema.zip


      # ======================================================
      # VERIFY SCHEMA ZIP
      # ======================================================

      - name: Verify Schema Lambda ZIP

        run: |

          unzip -l schema.zip > /tmp/schema_zip.txt

          grep "lambda_function.py" \
            /tmp/schema_zip.txt

          grep "pymysql" \
            /tmp/schema_zip.txt

          grep "cryptography" \
            /tmp/schema_zip.txt

          echo "Schema Lambda package looks correct."


      # ======================================================
      # UPLOAD SCHEMA
      # ======================================================

      - name: Upload Schema Lambda

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

        run: |

          SCHEMA_KEY="schema/${GITHUB_SHA}/schema.zip"

          aws s3 cp \
            schema.zip \
            "s3://${ARTIFACT_BUCKET}/${SCHEMA_KEY}" \
            --region "${AWS_REGION}"

          echo "SCHEMA_KEY=${SCHEMA_KEY}" >> "$GITHUB_ENV"


      # ======================================================
      # GET NETWORK
      # ======================================================

      - name: Get network configuration

        id: network

        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          echo "subnet_a=$SUBNET_A" >> "$GITHUB_OUTPUT"
          echo "subnet_b=$SUBNET_B" >> "$GITHUB_OUTPUT"
          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ======================================================
      # GET PRODUCT ROLE
      # ======================================================

      - name: Get Product Lambda IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # GET AUTHORIZER
      # ======================================================

      - name: Get Authorizer Lambda

        id: auth

        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # VALIDATE CLOUDFORMATION
      # ======================================================

      - name: Validate API CloudFormation

        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ======================================================
      # DEPLOY API STACK
      # ======================================================

      - name: Deploy API Stack

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket:"
          echo "${ARTIFACT_BUCKET}"

          echo "Product code:"
          echo "${PRODUCT_KEY}"

          echo "Schema code:"
          echo "${SCHEMA_KEY}"

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name cloudmart-dev-api \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.network.outputs.subnet_a }},${{ steps.network.outputs.subnet_b }}" \
              LambdaSecurityGroupId="${{ steps.network.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \
              AuthorizerLambdaArn="${{ steps.auth.outputs.authorizer_arn }}" \
              LambdaCodeBucket="${ARTIFACT_BUCKET}" \
              ProductLambdaCodeKey="${PRODUCT_KEY}" \
              SchemaLambdaCodeKey="${SCHEMA_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"


      # ======================================================
      # GET SCHEMA LAMBDA ARN
      # ======================================================

      - name: Get Schema Lambda ARN

        id: schema

        run: |

          SCHEMA_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='SchemaLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$SCHEMA_ARN" ] || [ "$SCHEMA_ARN" = "None" ]; then
            echo "ERROR: Schema Lambda ARN not found."
            exit 1
          fi

          echo "Schema Lambda:"
          echo "$SCHEMA_ARN"

          echo "schema_arn=$SCHEMA_ARN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # INITIALIZE DATABASE
      # ======================================================

      - name: Initialize RDS Database Schema

        env:

          SCHEMA_ARN:
            ${{ steps.schema.outputs.schema_arn }}

        run: |

          echo "======================================"
          echo "INITIALIZING RDS DATABASE"
          echo "======================================"

          aws lambda invoke \
            --function-name "${SCHEMA_ARN}" \
            --region "${AWS_REGION}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json

          cat schema-response.json

          if grep -q '"FunctionError"' schema-response.json; then
            echo "ERROR: Schema Lambda failed."
            exit 1
          fi

          echo "Database schema initialized."


      # ======================================================
      # CHECK API STACK
      # ======================================================

      - name: Check API Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status: ${STATUS}"

          case "${STATUS}" in

            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "API stack is healthy."
              ;;

            *)
              echo "ERROR: API stack is not healthy."
              exit 1
              ;;

          esac


      # ======================================================
      # DISPLAY API URL
      # ======================================================

      - name: Display API URL

        run: |

          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text

          echo "======================================"
name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev


jobs:

  deploy-api:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 3. VERIFY AWS
      # ========================================================

      - name: Verify AWS access
        run: |

          echo "======================================"
          echo "AWS ACCESS"
          echo "======================================"

          aws sts get-caller-identity

          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"


      # ========================================================
      # 4. SETUP PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # 5. VERIFY REPOSITORY FILES
      # ========================================================

      - name: Verify repository files
        shell: bash
        run: |

          echo "======================================"
          echo "VERIFYING FILES"
          echo "======================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "Checking Lambda directory..."

          if [ ! -d "lambda/product" ]; then
            echo "ERROR: lambda/product directory does not exist."
            exit 1
          fi

          echo "Lambda directory found."

          echo ""
          echo "Lambda directory:"
          ls -la lambda/product

          if [ ! -f "lambda/product/lambda_function.py" ]; then
            echo "ERROR: lambda/product/lambda_function.py not found."
            exit 1
          fi

          echo "OK: lambda_function.py found."

          if [ ! -f "lambda/product/requirements.txt" ]; then
            echo "ERROR: lambda/product/requirements.txt not found."
            exit 1
          fi

          echo "OK: requirements.txt found."

          if [ ! -f "schema/schema.sql" ]; then
            echo "ERROR: schema/schema.sql not found."
            exit 1
          fi

          echo "OK: schema/schema.sql found."

          if [ ! -f "cloudformation/api/api-stack.yaml" ]; then
            echo "ERROR: api-stack.yaml not found."
            exit 1
          fi

          echo "OK: api-stack.yaml found."

          echo ""
          echo "======================================"
          echo "FILE VERIFICATION PASSED"
          echo "======================================"


      # ========================================================
      # 6. INSTALL LAMBDA DEPENDENCIES
      # ========================================================

      - name: Install Product Lambda dependencies
        shell: bash
        run: |

          echo "======================================"
          echo "INSTALLING LAMBDA DEPENDENCIES"
          echo "======================================"

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/

          echo ""
          echo "Checking dependencies..."

          python - <<'PY'
          import sys

          sys.path.insert(0, "lambda/product")

          import pymysql
          import cryptography

          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)

          print("All Lambda dependencies are installed.")
          PY


      # ========================================================
      # 7. PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda
        shell: bash
        run: |

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          rm -f product.zip

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          echo ""
          echo "Product Lambda package:"
          ls -lh product.zip

          echo ""
          echo "Checking ZIP for dependencies..."

          unzip -l product.zip | grep -E \
            "pymysql|cryptography|lambda_function.py" | head -30


      # ========================================================
      # 8. GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda Artifact Bucket
        id: artifact
        shell: bash
        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket not found."
            exit 1
          fi

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 9. UPLOAD LAMBDA ZIP
      # ========================================================

      - name: Upload Product Lambda package
        id: upload
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          echo "Bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "Key:"
          echo "$PRODUCT_CODE_KEY"

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"

          echo "code_key=$PRODUCT_CODE_KEY" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 10. VERIFY S3 PACKAGE
      # ========================================================

      - name: Verify Product Lambda package
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.upload.outputs.code_key }}

        run: |

          echo "======================================"
          echo "VERIFYING S3 PACKAGE"
          echo "======================================"

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 11. VALIDATE CLOUDFORMATION
      # ========================================================

      - name: Validate API CloudFormation
        shell: bash
        run: |

          echo "======================================"
          echo "VALIDATING API CLOUDFORMATION"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # 12. GET PRIVATE SUBNET A
      # ========================================================

      - name: Get Private Subnet A
        id: subnet-a
        shell: bash
        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          echo "Private Subnet A:"
          echo "$SUBNET_A"

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 13. GET PRIVATE SUBNET B
      # ========================================================

      - name: Get Private Subnet B
        id: subnet-b
        shell: bash
        run: |

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          echo "Private Subnet B:"
          echo "$SUBNET_B"

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 14. GET LAMBDA SECURITY GROUP
      # ========================================================

      - name: Get Lambda Security Group
        id: lambda-sg
        shell: bash
        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "Lambda Security Group:"
          echo "$LAMBDA_SG"

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 15. GET PRODUCT IAM ROLE
      # ========================================================

      - name: Get Product Lambda IAM Role
        id: iam
        shell: bash
        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn not found."
            exit 1
          fi

          echo "Product Lambda Role:"
          echo "$PRODUCT_ROLE"

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 16. GET AUTHORIZE LAMBDA ARN
      # ========================================================

      - name: Get Authorizer Lambda ARN
        id: auth
        shell: bash
        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "Authorizer:"
          echo "$AUTHORIZER_ARN"

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 17. DEPLOY API STACK
      # ========================================================

      - name: Deploy API Stack
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.upload.outputs.code_key }}
          SUBNET_A: ${{ steps.subnet-a.outputs.subnet }}
          SUBNET_B: ${{ steps.subnet-b.outputs.subnet }}
          LAMBDA_SG: ${{ steps.lambda-sg.outputs.security_group }}
          PRODUCT_ROLE: ${{ steps.iam.outputs.product_role }}
          AUTHORIZER_ARN: ${{ steps.auth.outputs.authorizer_arn }}

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "Product code:"
          echo "$PRODUCT_CODE_KEY"

          echo "Subnet A:"
          echo "$SUBNET_A"

          echo "Subnet B:"
          echo "$SUBNET_B"

          echo "Security Group:"
          echo "$LAMBDA_SG"

          echo "Product Role:"
          echo "$PRODUCT_ROLE"

          echo "Authorizer:"
          echo "$AUTHORIZER_ARN"

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name cloudmart-dev-api \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${SUBNET_A},${SUBNET_B}" \
              LambdaSecurityGroupId="${LAMBDA_SG}" \
              ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" \
              AuthorizerLambdaArn="${AUTHORIZER_ARN}" \
              LambdaCodeBucket="${ARTIFACT_BUCKET}" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"


      # ========================================================
      # 18. CHECK STACK
      # ========================================================

      - name: Check API Stack
        shell: bash
        run: |

          echo "======================================"
          echo "API STACK STATUS"
          echo "======================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status:"
          echo "$STATUS"

          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              echo "API stack is healthy."
              ;;

            *)
              echo "ERROR: CloudFormation stack is not healthy."
              exit 1
              ;;

          esac


      # ========================================================
      # 19. DISPLAY API URL
      # ========================================================

      - name: Display API URL
        shell: bash
        run: |

          echo "======================================"
          echo "CLOUDMART API URL"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
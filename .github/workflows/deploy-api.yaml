name: CloudMart API Infrastructure

on:
  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  deploy-api:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # ======================================================
      # GET IAM OUTPUTS
      # ======================================================

      - name: Get Product Lambda IAM Role
        id: iam
        run: |

          echo "======================================"
          echo "GETTING PRODUCT LAMBDA IAM ROLE"
          echo "======================================"

          PRODUCT_LAMBDA_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          AUTHORIZE_LAMBDA_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          echo "Product Lambda Role:"
          echo "$PRODUCT_LAMBDA_ROLE_ARN"

          echo "Authorizer Lambda:"
          echo "$AUTHORIZE_LAMBDA_ARN"

          if [ -z "$PRODUCT_LAMBDA_ROLE_ARN" ] || \
             [ "$PRODUCT_LAMBDA_ROLE_ARN" = "None" ]; then

            echo "ERROR: Product Lambda role not found."

            exit 1

          fi

          if [ -z "$AUTHORIZE_LAMBDA_ARN" ] || \
             [ "$AUTHORIZE_LAMBDA_ARN" = "None" ]; then

            echo "ERROR: Authorizer Lambda ARN not found."

            exit 1

          fi

          echo "PRODUCT_LAMBDA_ROLE_ARN=$PRODUCT_LAMBDA_ROLE_ARN" >> "$GITHUB_ENV"

          echo "AUTHORIZE_LAMBDA_ARN=$AUTHORIZE_LAMBDA_ARN" >> "$GITHUB_ENV"


      # ======================================================
      # PACKAGE PRODUCT LAMBDA
      # ======================================================

      - name: Package Product Lambda
        run: |

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          rm -rf lambda/product/package

          mkdir -p lambda/product/package

          pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/package

          cp lambda/product/lambda_function.py \
             lambda/product/package/

          cd lambda/product/package

          zip -r ../../product.zip .

          cd ../../../

          ls -lh lambda/product.zip


      # ======================================================
      # GET ARTIFACT BUCKET
      # ======================================================

      - name: Get Lambda Artifact Bucket
        run: |

          echo "======================================"
          echo "GETTING LAMBDA ARTIFACT BUCKET"
          echo "======================================"

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          if [ -z "$ARTIFACT_BUCKET" ] || \
             [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi

          echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"


      # ======================================================
      # UPLOAD PRODUCT LAMBDA
      # ======================================================

      - name: Upload Product Lambda package
        run: |

          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          aws s3 cp \
            lambda/product.zip \
            "s3://$ARTIFACT_BUCKET/product/product.zip"


      # ======================================================
      # VERIFY PACKAGE
      # ======================================================

      - name: Verify Product Lambda package
        run: |

          aws s3api head-object \
            --bucket "$ARTIFACT_BUCKET" \
            --key product/product.zip


      # ======================================================
      # GET NETWORK INFORMATION
      # ======================================================

      - name: Get Private Subnets
        run: |

          PRIVATE_SUBNETS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetIds'].OutputValue" \
            --output text)

          echo "Private Subnets:"
          echo "$PRIVATE_SUBNETS"

          echo "PRIVATE_SUBNETS=$PRIVATE_SUBNETS" >> "$GITHUB_ENV"


      # ======================================================
      # GET LAMBDA SECURITY GROUP
      # ======================================================

      - name: Get Lambda Security Group
        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          echo "Lambda Security Group:"
          echo "$LAMBDA_SG"

          echo "LAMBDA_SG=$LAMBDA_SG" >> "$GITHUB_ENV"


      # ======================================================
      # DEPLOY API STACK
      # ======================================================

      - name: Deploy API CloudFormation Stack
        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Environment:"
          echo "$ENVIRONMENT"

          echo "Private Subnets:"
          echo "$PRIVATE_SUBNETS"

          echo "Lambda Security Group:"
          echo "$LAMBDA_SG"

          echo "Product Lambda Role:"
          echo "$PRODUCT_LAMBDA_ROLE_ARN"

          echo "Authorizer Lambda:"
          echo "$AUTHORIZE_LAMBDA_ARN"

          echo "Starting CloudFormation deployment..."

          aws cloudformation deploy \
            --stack-name cloudmart-dev-api \
            --template-file cloudformation/api/api-stack.yaml \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              PrivateSubnetIds="$PRIVATE_SUBNETS" \
              LambdaSecurityGroupId="$LAMBDA_SG" \
              ProductLambdaExecutionRoleArn="$PRODUCT_LAMBDA_ROLE_ARN" \
              AuthorizerLambdaArn="$AUTHORIZE_LAMBDA_ARN" \
              ProductLambdaCodeBucket="$ARTIFACT_BUCKET" \
              ProductLambdaCodeKey="product/product.zip" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
            --no-fail-on-empty-changeset


      # ======================================================
      # SHOW STACK OUTPUTS
      # ======================================================

      - name: Show API Stack Outputs
        run: |

          echo "======================================"
          echo "API STACK OUTPUTS"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # ======================================================
      # SHOW EVENTS IF FAILURE
      # ======================================================

      - name: Show CloudFormation Events
        if: failure()
        run: |

          echo "======================================"
          echo "CLOUDFORMATION EVENTS"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-api \
            --region "$AWS_REGION" \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table
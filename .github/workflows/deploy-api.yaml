name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  API_STACK: cloudmart-dev-api
  DATA_STACK: cloudmart-dev-data
  NETWORK_STACK: cloudmart-dev-network
  IAM_STACK: cloudmart-dev-iam
  AUTH_STACK: cloudmart-dev-auth


jobs:

  deploy-api:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 2. AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # 3. VERIFY AWS
      # ======================================================

      - name: Verify AWS access

        run: |

          echo "======================================"
          echo "AWS ACCESS"
          echo "======================================"

          aws sts get-caller-identity

          echo "Region: ${AWS_REGION}"


      # ======================================================
      # 4. PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # 5. VERIFY PRODUCT FILES
      # ======================================================

      - name: Verify Product Lambda files

        run: |

          echo "======================================"
          echo "PRODUCT LAMBDA FILES"
          echo "======================================"

          ls -la lambda/product

          test -f lambda/product/lambda_function.py

          test -f lambda/product/requirements.txt


      # ======================================================
      # 6. VERIFY REQUIREMENTS
      # ======================================================

      - name: Check Product Lambda requirements

        run: |

          echo "======================================"
          echo "REQUIREMENTS"
          echo "======================================"

          cat lambda/product/requirements.txt


      # ======================================================
      # 7. CLEAN PACKAGE DIRECTORY
      # ======================================================

      - name: Clean Lambda package

        run: |

          find lambda/product \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          rm -rf lambda/product/boto3
          rm -rf lambda/product/botocore


      # ======================================================
      # 8. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Product Lambda dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/ \
            --upgrade


      # ======================================================
      # 9. VERIFY DEPENDENCIES
      # ======================================================

      - name: Verify Lambda dependencies

        run: |

          echo "======================================"
          echo "VERIFYING DEPENDENCIES"
          echo "======================================"

          python - <<'PY'

          import sys

          sys.path.insert(0, "lambda/product")

          import pymysql
          import cryptography

          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)

          PY


      # ======================================================
      # 10. VERIFY REQUIRED FILES
      # ======================================================

      - name: Verify dependency files

        run: |

          test -d lambda/product/pymysql

          test -d lambda/product/cryptography

          echo "PyMySQL package found."
          echo "cryptography package found."


      # ======================================================
      # 11. CREATE ZIP
      # ======================================================

      - name: Package Product Lambda

        run: |

          rm -f product.zip

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          echo "======================================"
          echo "PRODUCT ZIP"
          echo "======================================"

          ls -lh product.zip


      # ======================================================
      # 12. VERIFY ZIP CONTENT
      # ======================================================

      - name: Verify Lambda ZIP

        run: |

          echo "======================================"
          echo "ZIP CONTENT CHECK"
          echo "======================================"

          unzip -l product.zip | grep -E \
            "lambda_function.py|pymysql|cryptography"


      # ======================================================
      # 13. GET ARTIFACT BUCKET
      # ======================================================

      - name: Get Lambda Artifact Bucket

        id: artifact

        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi

          echo "Artifact bucket: $ARTIFACT_BUCKET"

          echo "bucket=${ARTIFACT_BUCKET}" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 14. UPLOAD ZIP
      # ======================================================

      - name: Upload Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          echo "Product code key: ${PRODUCT_CODE_KEY}"

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"

          echo "product_key=${PRODUCT_CODE_KEY}" >> "$GITHUB_ENV"


      # ======================================================
      # 15. VERIFY S3
      # ======================================================

      - name: Verify Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ======================================================
      # 16. VALIDATE CLOUDFORMATION
      # ======================================================

      - name: Validate API CloudFormation

        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ======================================================
      # 17. GET NETWORK RESOURCES
      # ======================================================

      - name: Get network resources

        id: network

        run: |

          echo "======================================"
          echo "NETWORK RESOURCES"
          echo "======================================"

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)


          echo "Subnet A: ${SUBNET_A}"
          echo "Subnet B: ${SUBNET_B}"
          echo "Lambda SG: ${LAMBDA_SG}"


          test -n "${SUBNET_A}"
          test "${SUBNET_A}" != "None"

          test -n "${SUBNET_B}"
          test "${SUBNET_B}" != "None"

          test -n "${LAMBDA_SG}"
          test "${LAMBDA_SG}" != "None"


          echo "subnet_a=${SUBNET_A}" >> "$GITHUB_OUTPUT"

          echo "subnet_b=${SUBNET_B}" >> "$GITHUB_OUTPUT"

          echo "security_group=${LAMBDA_SG}" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 18. VERIFY NETWORK RESOURCES REALLY EXIST
      # ======================================================

      - name: Verify network resources

        run: |

          echo "Checking subnet A..."

          aws ec2 describe-subnets \
            --subnet-ids "${{ steps.network.outputs.subnet_a }}" \
            --region "${AWS_REGION}" \
            --query "Subnets[0].SubnetId" \
            --output text


          echo "Checking subnet B..."

          aws ec2 describe-subnets \
            --subnet-ids "${{ steps.network.outputs.subnet_b }}" \
            --region "${AWS_REGION}" \
            --query "Subnets[0].SubnetId" \
            --output text


          echo "Checking security group..."

          aws ec2 describe-security-groups \
            --group-ids "${{ steps.network.outputs.security_group }}" \
            --region "${AWS_REGION}" \
            --query "SecurityGroups[0].GroupId" \
            --output text


      # ======================================================
      # 19. GET PRODUCT IAM ROLE
      # ======================================================

      - name: Get Product Lambda IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then

            echo "ERROR: Product Lambda role not found."

            exit 1

          fi

          echo "Product role: ${PRODUCT_ROLE}"

          echo "product_role=${PRODUCT_ROLE}" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 20. VERIFY IAM ROLE REALLY EXISTS
      # ======================================================

      - name: Verify Product IAM role

        run: |

          ROLE_ARN="${{ steps.iam.outputs.product_role }}"

          echo "Checking role:"
          echo "${ROLE_ARN}"

          ROLE_NAME=$(echo "${ROLE_ARN}" | awk -F/ '{print $NF}')

          aws iam get-role \
            --role-name "${ROLE_NAME}" \
            --query "Role.Arn" \
            --output text


      # ======================================================
      # 21. GET AUTHORIZER ARN
      # ======================================================

      - name: Get Authorizer Lambda ARN

        id: auth

        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then

            echo "ERROR: Authorizer Lambda ARN not found."

            exit 1

          fi

          echo "Authorizer ARN:"
          echo "${AUTHORIZER_ARN}"

          echo "authorizer_arn=${AUTHORIZER_ARN}" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 22. VERIFY AUTHORIZER REALLY EXISTS
      # ======================================================

      - name: Verify Authorizer Lambda

        run: |

          AUTHORIZER_ARN="${{ steps.auth.outputs.authorizer_arn }}"

          echo "Checking authorizer..."

          aws lambda get-function \
            --function-name "${AUTHORIZER_ARN}" \
            --region "${AWS_REGION}" \
            --query "Configuration.FunctionArn" \
            --output text


      # ======================================================
      # 23. VERIFY SSM PARAMETERS
      # ======================================================

      - name: Verify database SSM parameters

        run: |

          echo "Checking database parameters..."

          aws ssm get-parameter \
            --name "/cloudmart/dev/db/host" \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


          aws ssm get-parameter \
            --name "/cloudmart/dev/db/name" \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


          aws ssm get-parameter \
            --name "/cloudmart/dev/db/username" \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


          aws ssm get-parameter \
            --name "/cloudmart/dev/db/password" \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


          aws ssm get-parameter \
            --name "/cloudmart/dev/db/port" \
            --region "${AWS_REGION}" \
            --query "Parameter.Name" \
            --output text


      # ======================================================
      # 24. DELETE OLD REVIEW STACK
      # ======================================================

      - name: Remove failed API stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || true)


          echo "Existing API stack status: ${STATUS}"


          if [ "${STATUS}" = "REVIEW_IN_PROGRESS" ]; then

            echo "Deleting REVIEW_IN_PROGRESS stack..."

            aws cloudformation delete-stack \
              --stack-name "${API_STACK}" \
              --region "${AWS_REGION}"

            aws cloudformation wait stack-delete-complete \
              --stack-name "${API_STACK}" \
              --region "${AWS_REGION}"

            echo "Old review stack deleted."

          fi


      # ======================================================
      # 25. DEPLOY API STACK
      # ======================================================

      - name: Deploy API Stack

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket:"
          echo "${{ steps.artifact.outputs.bucket }}"

          echo "Product code:"
          echo "${PRODUCT_CODE_KEY}"

          echo "Subnet A:"
          echo "${{ steps.network.outputs.subnet_a }}"

          echo "Subnet B:"
          echo "${{ steps.network.outputs.subnet_b }}"

          echo "Security Group:"
          echo "${{ steps.network.outputs.security_group }}"

          echo "Product Role:"
          echo "${{ steps.iam.outputs.product_role }}"

          echo "Authorizer:"
          echo "${{ steps.auth.outputs.authorizer_arn }}"


          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name "${API_STACK}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.network.outputs.subnet_a }},${{ steps.network.outputs.subnet_b }}" \
              LambdaSecurityGroupId="${{ steps.network.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \
              AuthorizerLambdaArn="${{ steps.auth.outputs.authorizer_arn }}" \
              LambdaCodeBucket="${{ steps.artifact.outputs.bucket }}" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --capabilities CAPABILITY_IAM \
            --region "${AWS_REGION}"


      # ======================================================
      # 26. SHOW CLOUDFORMATION EVENTS
      # ======================================================

      - name: Show CloudFormation Events

        if: always()

        run: |

          echo "======================================"
          echo "CLOUDFORMATION EVENTS"
          echo "======================================"


          aws cloudformation describe-stack-events \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


      # ======================================================
      # 27. CHECK API STACK
      # ======================================================

      - name: Check API Stack

        run: |

          echo "======================================"
          echo "API STACK STATUS"
          echo "======================================"


          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)


          echo "Stack status: ${STATUS}"


          case "${STATUS}" in

            CREATE_COMPLETE)
              echo "API stack created successfully."
              ;;

            UPDATE_COMPLETE)
              echo "API stack updated successfully."
              ;;

            *)
              echo "ERROR: API stack is not healthy."
              exit 1
              ;;

          esac


      # ======================================================
      # 28. DISPLAY API URL
      # ======================================================

      - name: Display API URL

        run: |

          echo "======================================"
          echo "CLOUDMART API URL"
          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
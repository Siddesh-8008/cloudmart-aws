name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "lambda/schema/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================

permissions:
  id-token: write
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:

  AWS_REGION: ap-south-1

  ENVIRONMENT: dev

  API_STACK_NAME: cloudmart-dev-api

  DATA_STACK_NAME: cloudmart-dev-data

  NETWORK_STACK_NAME: cloudmart-dev-network

  IAM_STACK_NAME: cloudmart-dev-iam

  AUTH_STACK_NAME: cloudmart-dev-auth


# ============================================================
# JOB
# ============================================================

jobs:

  build-and-deploy:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.13"


      # ======================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # 4. VERIFY AWS
      # ======================================================

      - name: Verify AWS identity

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "AWS ACCOUNT"
          echo "======================================"

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "Environment:"
          echo "${ENVIRONMENT}"


      # ======================================================
      # 5. VERIFY REQUIRED STACKS
      # ======================================================

      - name: Verify required CloudFormation stacks

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "VERIFYING REQUIRED STACKS"
          echo "======================================"

          for STACK in \
            "${NETWORK_STACK_NAME}" \
            "${DATA_STACK_NAME}" \
            "${IAM_STACK_NAME}" \
            "${AUTH_STACK_NAME}"
          do

            echo ""
            echo "Checking stack:"
            echo "${STACK}"

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${STACK}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].StackStatus" \
              --output text)

            echo "Status:"
            echo "${STATUS}"

            case "${STATUS}" in

              CREATE_COMPLETE)
                echo "Stack is ready."
                ;;

              UPDATE_COMPLETE)
                echo "Stack is ready."
                ;;

              UPDATE_ROLLBACK_COMPLETE)
                echo "Stack is available after rollback."
                ;;

              *)
                echo ""
                echo "ERROR: Stack ${STACK} is not ready."
                exit 1
                ;;

            esac

          done


      # ======================================================
      # 6. SHOW DATA STACK OUTPUTS
      # ======================================================

      - name: Show Data Stack Outputs

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "DATA STACK OUTPUTS"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ======================================================
      # 7. GET LAMBDA ARTIFACT BUCKET
      # ======================================================

      - name: Get Lambda Artifact Bucket

        id: artifact-bucket

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "GETTING LAMBDA ARTIFACT BUCKET"
          echo "======================================"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          if [ -z "${BUCKET_NAME}" ] || [ "${BUCKET_NAME}" = "None" ]; then

            echo ""
            echo "ERROR: LambdaArtifactBucketName was not found."

            echo ""
            echo "Available Data Stack outputs:"

            aws cloudformation describe-stacks \
              --stack-name "${DATA_STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs" \
              --output table

            exit 1

          fi

          echo ""
          echo "Lambda Artifact Bucket:"
          echo "${BUCKET_NAME}"

          echo "bucket=${BUCKET_NAME}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 8. PACKAGE PRODUCT LAMBDA
      # ======================================================

      - name: Package Product Lambda

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          rm -rf build/product

          rm -f product.zip

          mkdir -p build/product


          echo ""
          echo "Copying Product Lambda source..."

          cp lambda/product/lambda_function.py \
             build/product/


          echo ""
          echo "Checking Product Lambda requirements..."

          if [ -f lambda/product/requirements.txt ]; then

            if [ -s lambda/product/requirements.txt ]; then

              echo "Installing Product Lambda dependencies..."

              python -m pip install \
                -r lambda/product/requirements.txt \
                -t build/product \
                --upgrade \
                --no-cache-dir

            else

              echo "Product requirements.txt is empty."

            fi

          else

            echo "No Product requirements.txt found."

          fi


          echo ""
          echo "Creating product.zip..."

          cd build/product

          zip -r ../../product.zip .

          cd ../..


          echo ""
          echo "======================================"
          echo "PRODUCT ZIP CREATED"
          echo "======================================"

          ls -lh product.zip


          echo ""
          echo "PRODUCT ZIP CONTENTS:"

          unzip -l product.zip | head -100


      # ======================================================
      # 9. VERIFY PRODUCT ZIP
      # ======================================================

      - name: Verify Product Lambda package

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "VERIFYING PRODUCT LAMBDA PACKAGE"
          echo "======================================"

          if [ ! -f product.zip ]; then

            echo "ERROR: product.zip was not created."

            exit 1

          fi


          unzip -t product.zip >/dev/null


          if ! unzip -l product.zip | grep -q "lambda_function.py"; then

            echo "ERROR: Product lambda_function.py is missing."

            exit 1

          fi


          echo ""
          echo "Product Lambda package is valid."


      # ======================================================
      # 10. PACKAGE SCHEMA LAMBDA
      # ======================================================

      - name: Package Schema Lambda

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "PACKAGING SCHEMA LAMBDA"
          echo "======================================"

          rm -rf build/schema

          rm -f schema.zip

          mkdir -p build/schema


          echo ""
          echo "Copying Schema Lambda source..."

          cp lambda/schema/lambda_function.py \
             build/schema/


          echo ""
          echo "Checking Schema Lambda requirements..."

          if [ -f lambda/schema/requirements.txt ]; then

            if [ -s lambda/schema/requirements.txt ]; then

              echo "Installing Schema Lambda dependencies..."

              python -m pip install \
                -r lambda/schema/requirements.txt \
                -t build/schema \
                --upgrade \
                --no-cache-dir

            else

              echo "Schema requirements.txt is empty."

            fi

          else

            echo "No Schema requirements.txt found."

          fi


          echo ""
          echo "Creating schema.zip..."

          cd build/schema

          zip -r ../../schema.zip .

          cd ../..


          echo ""
          echo "======================================"
          echo "SCHEMA ZIP CREATED"
          echo "======================================"

          ls -lh schema.zip


          echo ""
          echo "SCHEMA ZIP CONTENTS:"

          unzip -l schema.zip | head -100


      # ======================================================
      # 11. VERIFY SCHEMA ZIP
      # ======================================================

      - name: Verify Schema Lambda package

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "VERIFYING SCHEMA LAMBDA PACKAGE"
          echo "======================================"

          if [ ! -f schema.zip ]; then

            echo "ERROR: schema.zip was not created."

            exit 1

          fi


          unzip -t schema.zip >/dev/null


          if ! unzip -l schema.zip | grep -q "lambda_function.py"; then

            echo "ERROR: Schema lambda_function.py is missing."

            exit 1

          fi


          echo ""
          echo "Schema Lambda package is valid."


      # ======================================================
      # 12. UPLOAD PRODUCT LAMBDA
      # ======================================================

      - name: Upload Product Lambda package

        shell: bash

        run: |

          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"


          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          echo ""
          echo "Bucket:"
          echo "${BUCKET_NAME}"


          aws s3 cp \
            product.zip \
            "s3://${BUCKET_NAME}/product/product.zip"


          echo ""
          echo "Product Lambda uploaded successfully."


          aws s3 ls \
            "s3://${BUCKET_NAME}/product/product.zip"


      # ======================================================
      # 13. UPLOAD SCHEMA LAMBDA
      # ======================================================

      - name: Upload Schema Lambda package

        shell: bash

        run: |

          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"


          echo "======================================"
          echo "UPLOADING SCHEMA LAMBDA"
          echo "======================================"

          echo ""
          echo "Bucket:"
          echo "${BUCKET_NAME}"


          aws s3 cp \
            schema.zip \
            "s3://${BUCKET_NAME}/schema/schema.zip"


          echo ""
          echo "Schema Lambda uploaded successfully."


          aws s3 ls \
            "s3://${BUCKET_NAME}/schema/schema.zip"


      # ======================================================
      # 14. VERIFY PRODUCT PACKAGE IN S3
      # ======================================================

      - name: Verify Product Lambda package in S3

        shell: bash

        run: |

          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"


          echo "======================================"
          echo "VERIFYING PRODUCT PACKAGE IN S3"
          echo "======================================"


          aws s3api head-object \
            --bucket "${BUCKET_NAME}" \
            --key "product/product.zip"


          echo ""
          echo "Product package verified in S3."


      # ======================================================
      # 15. VERIFY SCHEMA PACKAGE IN S3
      # ======================================================

      - name: Verify Schema Lambda package in S3

        shell: bash

        run: |

          set -e

          BUCKET_NAME="${{ steps.artifact-bucket.outputs.bucket }}"


          echo "======================================"
          echo "VERIFYING SCHEMA PACKAGE IN S3"
          echo "======================================"


          aws s3api head-object \
            --bucket "${BUCKET_NAME}" \
            --key "schema/schema.zip"


          echo ""
          echo "Schema package verified in S3."


      # ======================================================
      # 16. SHOW NETWORK OUTPUTS
      # ======================================================

      - name: Show Network Stack Outputs

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "NETWORK STACK OUTPUTS"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ======================================================
      # 17. GET PRIVATE SUBNET A
      # ======================================================

      - name: Get Private Subnet A

        id: subnet-a

        shell: bash

        run: |

          set -e

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue | [0]" \
            --output text)


          if [ -z "${SUBNET_A}" ] || [ "${SUBNET_A}" = "None" ]; then

            echo "ERROR: PrivateSubnetAId not found."

            exit 1

          fi


          echo "Private Subnet A:"
          echo "${SUBNET_A}"


          echo "subnet=${SUBNET_A}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 18. GET PRIVATE SUBNET B
      # ======================================================

      - name: Get Private Subnet B

        id: subnet-b

        shell: bash

        run: |

          set -e

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue | [0]" \
            --output text)


          if [ -z "${SUBNET_B}" ] || [ "${SUBNET_B}" = "None" ]; then

            echo "ERROR: PrivateSubnetBId not found."

            exit 1

          fi


          echo "Private Subnet B:"
          echo "${SUBNET_B}"


          echo "subnet=${SUBNET_B}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 19. GET LAMBDA SECURITY GROUP
      # ======================================================

      - name: Get Lambda Security Group

        id: security-group

        shell: bash

        run: |

          set -e

          SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)


          if [ -z "${SECURITY_GROUP}" ] || [ "${SECURITY_GROUP}" = "None" ]; then

            echo "ERROR: LambdaSecurityGroupId not found."

            exit 1

          fi


          echo "Lambda Security Group:"
          echo "${SECURITY_GROUP}"


          echo "security_group=${SECURITY_GROUP}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 20. GET PRODUCT LAMBDA IAM ROLE
      # ======================================================

      - name: Get Product Lambda IAM Role

        id: iam

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "GETTING PRODUCT LAMBDA IAM ROLE"
          echo "======================================"


          echo ""
          echo "IAM Stack Outputs:"


          aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


          PRODUCT_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${IAM_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue | [0]" \
            --output text)


          if [ -z "${PRODUCT_ROLE_ARN}" ] || [ "${PRODUCT_ROLE_ARN}" = "None" ]; then

            echo ""
            echo "ERROR: ProductLambdaRoleArn not found."

            exit 1

          fi


          echo ""
          echo "Product Lambda IAM Role:"
          echo "${PRODUCT_ROLE_ARN}"


          echo "role_arn=${PRODUCT_ROLE_ARN}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 21. GET AUTHORIZER LAMBDA ARN
      # ======================================================

      - name: Get Authorizer Lambda ARN

        id: authorizer

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "GETTING AUTHORIZER LAMBDA ARN"
          echo "======================================"


          echo ""
          echo "Auth Stack Outputs:"


          aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


          AUTHORIZE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue | [0]" \
            --output text)


          if [ -z "${AUTHORIZE_ARN}" ] || [ "${AUTHORIZE_ARN}" = "None" ]; then

            echo ""
            echo "ERROR: AuthorizerLambdaArn not found."

            exit 1

          fi


          echo ""
          echo "Authorizer Lambda:"
          echo "${AUTHORIZE_ARN}"


          echo "authorizer_arn=${AUTHORIZE_ARN}" >> "${GITHUB_OUTPUT}"


      # ======================================================
      # 22. VALIDATE API CLOUDFORMATION
      # ======================================================

      - name: Validate API CloudFormation

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "VALIDATING API CLOUDFORMATION"
          echo "======================================"


          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


          echo ""
          echo "CloudFormation validation successful."


      # ======================================================
      # 23. DEPLOY API STACK
      # ======================================================

      - name: Deploy API CloudFormation

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"


          PRIVATE_SUBNET_A="${{ steps.subnet-a.outputs.subnet }}"

          PRIVATE_SUBNET_B="${{ steps.subnet-b.outputs.subnet }}"

          PRIVATE_SUBNETS="${PRIVATE_SUBNET_A},${PRIVATE_SUBNET_B}"


          LAMBDA_SECURITY_GROUP="${{ steps.security-group.outputs.security_group }}"


          PRODUCT_ROLE="${{ steps.iam.outputs.role_arn }}"


          AUTHORIZE_ARN="${{ steps.authorizer.outputs.authorizer_arn }}"


          PRODUCT_BUCKET="${{ steps.artifact-bucket.outputs.bucket }}"


          echo ""
          echo "Environment:"
          echo "${ENVIRONMENT}"


          echo ""
          echo "Private Subnets:"
          echo "${PRIVATE_SUBNETS}"


          echo ""
          echo "Lambda Security Group:"
          echo "${LAMBDA_SECURITY_GROUP}"


          echo ""
          echo "Product Lambda IAM Role:"
          echo "${PRODUCT_ROLE}"


          echo ""
          echo "Authorizer Lambda:"
          echo "${AUTHORIZE_ARN}"


          echo ""
          echo "Lambda Artifact Bucket:"
          echo "${PRODUCT_BUCKET}"


          echo ""
          echo "Starting CloudFormation deployment..."


          aws cloudformation deploy \
            --stack-name "${API_STACK_NAME}" \
            --template-file cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${PRIVATE_SUBNETS}" \
              LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP}" \
              ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" \
              AuthorizerLambdaArn="${AUTHORIZE_ARN}" \
              ProductLambdaCodeBucket="${PRODUCT_BUCKET}" \
              ProductLambdaCodeKey="product/product.zip" \
              SchemaLambdaCodeKey="schema/schema.zip" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              AuthorizerCacheTTL="300" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
            --no-fail-on-empty-changeset


          echo ""
          echo "======================================"
          echo "API DEPLOYMENT COMPLETE"
          echo "======================================"


      # ======================================================
      # 24. SHOW API STACK STATUS
      # ======================================================

      - name: Show API Stack status

        shell: bash

        run: |

          echo "======================================"
          echo "CLOUDFORMATION STACK STATUS"
          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table


      # ======================================================
      # 25. SHOW API STACK OUTPUTS
      # ======================================================

      - name: Show API Stack outputs

        shell: bash

        run: |

          echo "======================================"
          echo "API STACK OUTPUTS"
          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ======================================================
      # 26. SHOW CLOUDFORMATION EVENTS
      # ======================================================

      - name: Show CloudFormation events

        if: always()

        shell: bash

        run: |

          echo "======================================"
          echo "CLOUDFORMATION EVENTS"
          echo "======================================"


          aws cloudformation describe-stack-events \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --max-items 30 \
            --query "StackEvents[*].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true
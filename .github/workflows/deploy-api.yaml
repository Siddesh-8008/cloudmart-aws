name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev


jobs:

  deploy-api:

    name: Build and Deploy CloudMart API

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # 2. AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 3. VERIFY AWS
      # ========================================================

      - name: Verify AWS access

        run: |

          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"

          aws sts get-caller-identity


      # ========================================================
      # 4. PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ========================================================
      # 5. VERIFY FILES
      # ========================================================

      - name: Verify Product Lambda files

        run: |

          echo "======================================"
          echo "CHECKING PRODUCT LAMBDA"
          echo "======================================"

          ls -la lambda/product

          test -f lambda/product/lambda_function.py

          test -f lambda/product/requirements.txt

          echo "Lambda files found."


      # ========================================================
      # 6. INSTALL DEPENDENCIES
      # ========================================================

      - name: Install Product Lambda dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/


      # ========================================================
      # 7. VERIFY DEPENDENCIES
      # ========================================================

      - name: Verify installed dependencies

        run: |

          echo "======================================"
          echo "VERIFYING DEPENDENCIES"
          echo "======================================"

          cd lambda/product

          python - <<'PY'

          import pymysql
          import cryptography

          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)

          print("Dependencies OK.")

          PY

          cd ../..


      # ========================================================
      # 8. PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda

        run: |

          rm -f product.zip

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          echo "======================================"
          echo "PRODUCT LAMBDA PACKAGE"
          echo "======================================"

          ls -lh product.zip


      # ========================================================
      # 9. VERIFY ZIP
      # ========================================================

      - name: Verify Lambda package

        run: |

          echo "======================================"
          echo "CHECKING ZIP CONTENT"
          echo "======================================"

          unzip -l product.zip | grep -E \
            "lambda_function.py|pymysql|cryptography"

          echo "Lambda package verified."


      # ========================================================
      # 10. GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda Artifact Bucket

        id: artifact

        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi

          echo "Artifact bucket: $ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 11. CREATE UNIQUE S3 KEY
      # ========================================================

      - name: Create Product Lambda S3 key

        id: package

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          echo "Product code key: ${PRODUCT_CODE_KEY}"

          echo "key=${PRODUCT_CODE_KEY}" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 12. UPLOAD ZIP
      # ========================================================

      - name: Upload Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.package.outputs.key }}

        run: |

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 13. VERIFY S3
      # ========================================================

      - name: Verify Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.package.outputs.key }}

        run: |

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 14. GET SUBNET A
      # ========================================================

      - name: Get Private Subnet A

        id: subnet-a

        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          test -n "$SUBNET_A"

          test "$SUBNET_A" != "None"

          echo "Private Subnet A: $SUBNET_A"

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 15. GET SUBNET B
      # ========================================================

      - name: Get Private Subnet B

        id: subnet-b

        run: |

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          test -n "$SUBNET_B"

          test "$SUBNET_B" != "None"

          echo "Private Subnet B: $SUBNET_B"

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 16. GET LAMBDA SECURITY GROUP
      # ========================================================

      - name: Get Lambda Security Group

        id: lambda-sg

        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          test -n "$LAMBDA_SG"

          test "$LAMBDA_SG" != "None"

          echo "Lambda Security Group: $LAMBDA_SG"

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 17. GET PRODUCT IAM ROLE
      # ========================================================

      - name: Get Product Lambda IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          test -n "$PRODUCT_ROLE"

          test "$PRODUCT_ROLE" != "None"

          echo "Product Role: $PRODUCT_ROLE"

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 18. GET AUTHORIZER ARN
      # ========================================================

      - name: Get Authorizer Lambda ARN

        id: auth

        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          test -n "$AUTHORIZER_ARN"

          test "$AUTHORIZER_ARN" != "None"

          echo "Authorizer ARN: $AUTHORIZER_ARN"

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 19. VALIDATE CLOUDFORMATION
      # ========================================================

      - name: Validate API CloudFormation

        run: |

          echo "======================================"
          echo "VALIDATING API STACK"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # 20. DEPLOY API STACK
      # ========================================================

      - name: Deploy API Stack

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.package.outputs.key }}

          SUBNET_A: ${{ steps.subnet-a.outputs.subnet }}

          SUBNET_B: ${{ steps.subnet-b.outputs.subnet }}

          LAMBDA_SG: ${{ steps.lambda-sg.outputs.security_group }}

          PRODUCT_ROLE: ${{ steps.iam.outputs.product_role }}

          AUTHORIZER_ARN: ${{ steps.auth.outputs.authorizer_arn }}

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket:"
          echo "${ARTIFACT_BUCKET}"

          echo "Product code:"
          echo "${PRODUCT_CODE_KEY}"

          echo "Subnet A:"
          echo "${SUBNET_A}"

          echo "Subnet B:"
          echo "${SUBNET_B}"

          echo "Security Group:"
          echo "${LAMBDA_SG}"

          echo "Product Role:"
          echo "${PRODUCT_ROLE}"

          echo "Authorizer:"
          echo "${AUTHORIZER_ARN}"


          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name cloudmart-dev-api \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${SUBNET_A},${SUBNET_B}" \
              LambdaSecurityGroupId="${LAMBDA_SG}" \
              ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" \
              AuthorizerLambdaArn="${AUTHORIZER_ARN}" \
              LambdaCodeBucket="${ARTIFACT_BUCKET}" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"


      # ========================================================
      # 21. CHECK STACK
      # ========================================================

      - name: Check API Stack

        run: |

          echo "======================================"
          echo "API STACK STATUS"
          echo "======================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status: ${STATUS}"

          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "API stack is healthy."

              ;;

            *)

              echo "ERROR: API stack is not healthy."

              exit 1

              ;;

          esac


      # ========================================================
      # 22. DISPLAY API URL
      # ========================================================

      - name: Display API URL

        run: |

          echo "======================================"
          echo "CLOUDMART API URL"
          echo "======================================"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "${API_URL}"

          echo "======================================"
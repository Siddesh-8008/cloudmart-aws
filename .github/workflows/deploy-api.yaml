name: CloudMart API Infrastructure

on:
  push:
    branches:
      - milestone-3
    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  deploy-api:

    name: Build and Deploy API Stack
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. VERIFY AWS
      # ==========================================================

      - name: Verify AWS access
        run: |
          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"

          aws sts get-caller-identity


      # ==========================================================
      # 4. SETUP PYTHON
      # Lambda runtime = Python 3.12
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 5. VERIFY LAMBDA DIRECTORY
      # ==========================================================

      - name: Verify Product Lambda files
        run: |

          echo "======================================"
          echo "Repository structure"
          echo "======================================"

          pwd
          ls -la

          echo "======================================"
          echo "Lambda directory"
          echo "======================================"

          if [ ! -d "lambda/product" ]; then
            echo "ERROR: lambda/product directory not found."
            echo "Available directories:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          ls -la lambda/product

          if [ ! -f "lambda/product/lambda_function.py" ]; then
            echo "ERROR: lambda_function.py not found."
            exit 1
          fi

          if [ ! -f "lambda/product/requirements.txt" ]; then
            echo "ERROR: requirements.txt not found."
            exit 1
          fi

          echo "Lambda files verified."


      # ==========================================================
      # 6. DISPLAY REQUIREMENTS
      # ==========================================================

      - name: Check Product Lambda requirements
        run: |

          echo "======================================"
          echo "requirements.txt"
          echo "======================================"

          cat lambda/product/requirements.txt


      # ==========================================================
      # 7. CLEAN OLD DEPENDENCIES
      # ==========================================================

      - name: Clean Lambda package
        run: |

          echo "Cleaning old Python dependencies..."

          find lambda/product \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name "lambda_function.py" \
            ! -name "requirements.txt" \
            -exec rm -rf {} +

          echo "Clean complete."

          ls -la lambda/product


      # ==========================================================
      # 8. INSTALL DEPENDENCIES INTO LAMBDA DIRECTORY
      # ==========================================================

      - name: Install Product Lambda dependencies
        run: |

          echo "======================================"
          echo "Installing Lambda dependencies"
          echo "======================================"

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/

          echo "Dependencies installed."


      # ==========================================================
      # 9. VERIFY DEPENDENCIES INSIDE PACKAGE
      # ==========================================================

      - name: Verify Lambda dependencies
        run: |

          echo "======================================"
          echo "Checking installed dependencies"
          echo "======================================"

          python - <<'PY'
          import sys

          sys.path.insert(0, "lambda/product")

          import pymysql
          import cryptography

          print("PyMySQL version:", pymysql.__version__)
          print("Cryptography version:", cryptography.__version__)
          print("Lambda dependencies verified successfully.")
          PY


      # ==========================================================
      # 10. VERIFY REQUIRED PACKAGES EXIST
      # ==========================================================

      - name: Verify dependency files
        run: |

          echo "Checking PyMySQL..."

          if [ ! -d "lambda/product/pymysql" ]; then
            echo "ERROR: PyMySQL was not installed."
            exit 1
          fi

          echo "Checking cryptography..."

          if [ ! -d "lambda/product/cryptography" ]; then
            echo "ERROR: cryptography was not installed."
            exit 1
          fi

          echo "Required packages exist."


      # ==========================================================
      # 11. CREATE LAMBDA ZIP
      # ==========================================================

      - name: Package Product Lambda
        run: |

          echo "======================================"
          echo "Creating Product Lambda ZIP"
          echo "======================================"

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          echo "Package created:"
          ls -lh product.zip


      # ==========================================================
      # 12. CHECK ZIP CONTENT
      # ==========================================================

      - name: Verify Lambda ZIP
        run: |

          echo "======================================"
          echo "Checking ZIP contents"
          echo "======================================"

          unzip -l product.zip | grep -E \
            "lambda_function.py|pymysql|cryptography"

          echo "ZIP verification completed."


      # ==========================================================
      # 13. GET ARTIFACT BUCKET
      # ==========================================================

      - name: Get Lambda Artifact Bucket
        id: artifact
        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket not found."
            exit 1
          fi

          echo "Artifact bucket: $ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 14. UPLOAD ZIP TO S3
      # ==========================================================

      - name: Upload Product Lambda package
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          echo "Uploading Product Lambda..."

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/product/product.zip" \
            --region "${AWS_REGION}"

          echo "Upload completed."


      # ==========================================================
      # 15. VERIFY S3
      # ==========================================================

      - name: Verify Product Lambda package
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/product/product.zip" \
            --region "${AWS_REGION}"


      # ==========================================================
      # 16. VALIDATE CLOUDFORMATION
      # ==========================================================

      - name: Validate API CloudFormation
        run: |

          echo "======================================"
          echo "Validating API CloudFormation"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"

          echo "CloudFormation template is valid."


      # ==========================================================
      # 17. GET PRIVATE SUBNET A
      # ==========================================================

      - name: Get Private Subnet A
        id: subnet-a
        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          echo "Private Subnet A: $SUBNET_A"

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 18. GET PRIVATE SUBNET B
      # ==========================================================

      - name: Get Private Subnet B
        id: subnet-b
        run: |

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          echo "Private Subnet B: $SUBNET_B"

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 19. GET LAMBDA SECURITY GROUP
      # ==========================================================

      - name: Get Lambda Security Group
        id: lambda-sg
        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "Lambda Security Group: $LAMBDA_SG"

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 20. GET PRODUCT IAM ROLE
      # ==========================================================

      - name: Get Product Lambda IAM Role
        id: iam
        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn not found."
            exit 1
          fi

          echo "Product Lambda Role: $PRODUCT_ROLE"

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 21. GET AUTHORIZER ARN
      # ==========================================================

      - name: Get Authorizer Lambda ARN
        id: auth
        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "Authorizer ARN: $AUTHORIZER_ARN"

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 22. CHECK LOW STOCK EMAIL
      # ==========================================================

      - name: Verify Low Stock Email
        run: |

          if [ -z "${{ secrets.LOW_STOCK_EMAIL }}" ]; then
            echo "ERROR: LOW_STOCK_EMAIL GitHub secret is not configured."
            exit 1
          fi

          echo "Low stock email secret is configured."


      # ==========================================================
      # 23. DEPLOY API STACK
      # ==========================================================

      - name: Deploy API Stack
        run: |

          echo "======================================"
          echo "Deploying CloudMart API stack"
          echo "======================================"

          set +e

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name cloudmart-dev-api \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.subnet-a.outputs.subnet }},${{ steps.subnet-b.outputs.subnet }}" \
              LambdaSecurityGroupId="${{ steps.lambda-sg.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \
              AuthorizerLambdaArn="${{ steps.auth.outputs.authorizer_arn }}" \
              ProductLambdaCodeKey="product/product.zip" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBPortParameter="/cloudmart/dev/db/port" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}" \
            --region "${AWS_REGION}"

          DEPLOY_EXIT_CODE=$?

          set -e

          echo "Deployment exit code: ${DEPLOY_EXIT_CODE}"


      # ==========================================================
      # 24. SHOW CLOUDFORMATION EVENTS
      # ==========================================================

      - name: Show CloudFormation Events
        if: always()
        run: |

          echo "======================================"
          echo "CloudFormation Events"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


      # ==========================================================
      # 25. CHECK API STACK
      # ==========================================================

      - name: Check API Stack
        run: |

          echo "======================================"
          echo "API Stack Status"
          echo "======================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status: ${STATUS}"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS)
              echo "CloudFormation stack deployment completed successfully."
              ;;
            *)
              echo "ERROR: CloudFormation stack is not healthy."
              exit 1
              ;;
          esac


      # ==========================================================
      # 26. DISPLAY API URL
      # ==========================================================

      - name: Display API URL
        run: |

          echo "======================================"
          echo "CloudMart API URL"
          echo "======================================"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "${API_URL}"

          echo "======================================"
          echo "Product API endpoints"
          echo "======================================"

          echo "GET    ${API_URL}/products"
          echo "POST   ${API_URL}/products"
          echo "GET    ${API_URL}/products/{id}"
          echo "PUT    ${API_URL}/products/{id}"
          echo "DELETE ${API_URL}/products/{id}"
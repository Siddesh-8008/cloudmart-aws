name: CloudMart API Infrastructure


# ============================================================
# TRIGGERS
# ============================================================

on:

  push:

    branches:
      - milestone-3

    paths:

      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# ENVIRONMENT
# ============================================================

env:

  AWS_REGION: ap-south-1

  ENVIRONMENT: dev


# ============================================================
# JOB
# ============================================================

jobs:

  deploy-api:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # 2. AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 3. VERIFY AWS
      # ========================================================

      - name: Verify AWS access

        run: |

          echo "======================================"

          echo "AWS ACCESS"

          echo "======================================"

          echo "Region: ${AWS_REGION}"

          echo "Environment: ${ENVIRONMENT}"

          aws sts get-caller-identity


      # ========================================================
      # 4. SETUP PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ========================================================
      # 5. VERIFY PRODUCT FILES
      # ========================================================

      - name: Verify Product Lambda files

        run: |

          echo "======================================"

          echo "PRODUCT LAMBDA FILES"

          echo "======================================"

          ls -la lambda/product

          test -f lambda/product/lambda_function.py

          test -f lambda/product/requirements.txt


      # ========================================================
      # 6. SHOW REQUIREMENTS
      # ========================================================

      - name: Check Product Lambda requirements

        run: |

          echo "======================================"

          echo "REQUIREMENTS"

          echo "======================================"

          cat lambda/product/requirements.txt


      # ========================================================
      # 7. CLEAN OLD PACKAGE
      # ========================================================

      - name: Clean Lambda package

        run: |

          rm -rf lambda/product/pymysql
          rm -rf lambda/product/PyMySQL*
          rm -rf lambda/product/cryptography
          rm -rf lambda/product/cryptography-*
          rm -rf lambda/product/cffi
          rm -rf lambda/product/cffi-*

          rm -f product.zip


      # ========================================================
      # 8. INSTALL DEPENDENCIES
      # ========================================================

      - name: Install Product Lambda dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/


      # ========================================================
      # 9. VERIFY DEPENDENCIES
      # ========================================================

      - name: Verify Lambda dependencies

        run: |

          echo "======================================"

          echo "VERIFYING DEPENDENCIES"

          echo "======================================"

          python - <<'PY'
          import sys

          sys.path.insert(
              0,
              "lambda/product"
          )

          import pymysql
          import cryptography

          print("Python:", sys.version)
          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)

          print("Dependencies OK")
          PY


      # ========================================================
      # 10. CREATE ZIP
      # ========================================================

      - name: Package Product Lambda

        run: |

          echo "======================================"

          echo "PACKAGING PRODUCT LAMBDA"

          echo "======================================"

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          ls -lh product.zip


      # ========================================================
      # 11. VERIFY ZIP
      # ========================================================

      - name: Verify Lambda ZIP

        run: |

          echo "======================================"

          echo "VERIFYING ZIP CONTENT"

          echo "======================================"

          unzip -l product.zip | grep "pymysql/__init__.py"

          unzip -l product.zip | grep "cryptography/__init__.py"

          echo "Required packages found in ZIP"


      # ========================================================
      # 12. GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda Artifact Bucket

        id: artifact

        run: |

          ARTIFACT_BUCKET=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-data \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
              --output text

          )


          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi


          echo "Artifact bucket: $ARTIFACT_BUCKET"


          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 13. UPLOAD UNIQUE ZIP
      # ========================================================

      - name: Upload Product Lambda package

        id: upload-product

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"


          echo "======================================"

          echo "UPLOADING PRODUCT LAMBDA"

          echo "======================================"

          echo "Bucket: ${ARTIFACT_BUCKET}"

          echo "Key: ${PRODUCT_CODE_KEY}"


          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


          echo "product_code_key=${PRODUCT_CODE_KEY}" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 14. VERIFY S3
      # ========================================================

      - name: Verify Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.upload-product.outputs.product_code_key }}

        run: |

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 15. VALIDATE CLOUDFORMATION
      # ========================================================

      - name: Validate API CloudFormation

        run: |

          echo "======================================"

          echo "VALIDATING API STACK"

          echo "======================================"


          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # 16. GET PRIVATE SUBNET A
      # ========================================================

      - name: Get Private Subnet A

        id: subnet-a

        run: |

          SUBNET_A=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-network \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
              --output text

          )


          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then

            echo "ERROR: PrivateSubnetAId not found."

            exit 1

          fi


          echo "Private Subnet A: $SUBNET_A"

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 17. GET PRIVATE SUBNET B
      # ========================================================

      - name: Get Private Subnet B

        id: subnet-b

        run: |

          SUBNET_B=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-network \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
              --output text

          )


          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then

            echo "ERROR: PrivateSubnetBId not found."

            exit 1

          fi


          echo "Private Subnet B: $SUBNET_B"

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 18. GET LAMBDA SECURITY GROUP
      # ========================================================

      - name: Get Lambda Security Group

        id: lambda-sg

        run: |

          LAMBDA_SG=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-network \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
              --output text

          )


          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then

            echo "ERROR: LambdaSecurityGroupId not found."

            exit 1

          fi


          echo "Lambda Security Group: $LAMBDA_SG"

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 19. GET IAM ROLE
      # ========================================================

      - name: Get Product Lambda IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-iam \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
              --output text

          )


          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then

            echo "ERROR: ProductLambdaRoleArn not found."

            exit 1

          fi


          echo "Product Lambda Role: $PRODUCT_ROLE"

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 20. GET AUTHORIZER ARN
      # ========================================================

      - name: Get Authorizer Lambda ARN

        id: auth

        run: |

          AUTHORIZER_ARN=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-auth \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
              --output text

          )


          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then

            echo "ERROR: AuthorizerLambdaArn not found."

            exit 1

          fi


          echo "Authorizer ARN: $AUTHORIZER_ARN"

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 21. CLEAN FAILED REVIEW STACK
      # ========================================================

      - name: Clean failed API stack

        run: |

          STATUS=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || true

          )


          echo "Current API stack status: ${STATUS}"


          if [ "$STATUS" = "REVIEW_IN_PROGRESS" ] || \
             [ "$STATUS" = "ROLLBACK_COMPLETE" ] || \
             [ "$STATUS" = "ROLLBACK_FAILED" ]; then

            echo "Deleting unhealthy API stack..."

            aws cloudformation delete-stack \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"


            echo "Waiting for stack deletion..."

            aws cloudformation wait stack-delete-complete \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"

            echo "Unhealthy stack deleted."

          fi


      # ========================================================
      # 22. DEPLOY API STACK
      # ========================================================

      - name: Deploy API Stack

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.upload-product.outputs.product_code_key }}

        run: |

          echo "======================================"

          echo "DEPLOYING CLOUDMART API"

          echo "======================================"

          echo "Artifact bucket: ${ARTIFACT_BUCKET}"

          echo "Product code key: ${PRODUCT_CODE_KEY}"


          aws cloudformation deploy \

            --template-file cloudformation/api/api-stack.yaml \

            --stack-name cloudmart-dev-api \

            --capabilities CAPABILITY_IAM \

            --parameter-overrides \

              Environment="${ENVIRONMENT}" \

              PrivateSubnetIds="${{ steps.subnet-a.outputs.subnet }},${{ steps.subnet-b.outputs.subnet }}" \

              LambdaSecurityGroupId="${{ steps.lambda-sg.outputs.security_group }}" \

              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \

              AuthorizerLambdaArn="${{ steps.auth.outputs.authorizer_arn }}" \

              LambdaCodeBucket="${ARTIFACT_BUCKET}" \

              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \

              DBHostParameter="/cloudmart/dev/db/host" \

              DBNameParameter="/cloudmart/dev/db/name" \

              DBUsernameParameter="/cloudmart/dev/db/username" \

              DBPasswordParameter="/cloudmart/dev/db/password" \

              DBPortParameter="/cloudmart/dev/db/port" \

            --region "${AWS_REGION}"


      # ========================================================
      # 23. WAIT FOR STACK
      # ========================================================

      - name: Wait for API stack

        run: |

          echo "Waiting for CloudFormation stack..."


          aws cloudformation wait stack-create-complete \

            --stack-name cloudmart-dev-api \

            --region "${AWS_REGION}" || \

          aws cloudformation wait stack-update-complete \

            --stack-name cloudmart-dev-api \

            --region "${AWS_REGION}"


      # ========================================================
      # 24. CHECK API STACK
      # ========================================================

      - name: Check API Stack

        run: |

          echo "======================================"

          echo "API STACK STATUS"

          echo "======================================"


          STATUS=$(

            aws cloudformation describe-stacks \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}" \
              --query "Stacks[0].StackStatus" \
              --output text

          )


          echo "Stack status: ${STATUS}"


          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "API Stack is healthy."

              ;;

            *)

              echo "ERROR: CloudFormation stack is not healthy."

              exit 1

              ;;

          esac


      # ========================================================
      # 25. DISPLAY API URL
      # ========================================================

      - name: Display API URL

        run: |

          echo "======================================"

          echo "CLOUDMART API URL"

          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text


          echo "======================================"
name: CloudMart API Infrastructure


# ============================================================
# TRIGGERS
# ============================================================

on:

  push:

    branches:
      - milestone-3

    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  id-token: write
  contents: read


# ============================================================
# ENVIRONMENT
# ============================================================

env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev


# ============================================================
# JOB
# ============================================================

jobs:

  deploy-api:

    name: Build and Deploy API Stack

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 2. AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # 3. VERIFY AWS
      # ======================================================

      - name: Verify AWS access

        run: |

          echo "======================================"
          echo "AWS ACCESS"
          echo "======================================"

          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"

          aws sts get-caller-identity


      # ======================================================
      # 4. SETUP PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # 5. VERIFY PRODUCT FILES
      # ======================================================

      - name: Verify Product Lambda files

        run: |

          echo "======================================"
          echo "PRODUCT LAMBDA FILES"
          echo "======================================"

          ls -la lambda/product

          test -f lambda/product/lambda_function.py
          test -f lambda/product/requirements.txt

          echo "Product Lambda files found."


      # ======================================================
      # 6. SHOW REQUIREMENTS
      # ======================================================

      - name: Check Product Lambda requirements

        run: |

          echo "======================================"
          echo "REQUIREMENTS"
          echo "======================================"

          cat lambda/product/requirements.txt


      # ======================================================
      # 7. CLEAN OLD PACKAGE
      # ======================================================

      - name: Clean Lambda package

        run: |

          echo "======================================"
          echo "CLEANING OLD DEPENDENCIES"
          echo "======================================"

          find lambda/product \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name "lambda_function.py" \
            ! -name "requirements.txt" \
            -exec rm -rf {} +

          rm -f product.zip

          echo "Clean completed."


      # ======================================================
      # 8. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Product Lambda dependencies

        run: |

          echo "======================================"
          echo "INSTALLING LAMBDA DEPENDENCIES"
          echo "======================================"

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/

          echo "Dependencies installed."


      # ======================================================
      # 9. VERIFY DEPENDENCIES
      # ======================================================

      - name: Verify Lambda dependencies

        run: |

          echo "======================================"
          echo "VERIFYING DEPENDENCIES"
          echo "======================================"

          python - <<'PY'
          import sys

          sys.path.insert(0, "lambda/product")

          import pymysql
          import cryptography

          print("Python:", sys.version)
          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)

          print("Dependency verification successful.")
          PY


      # ======================================================
      # 10. VERIFY REQUIRED PACKAGE FILES
      # ======================================================

      - name: Verify dependency files

        run: |

          echo "======================================"
          echo "VERIFY PACKAGE FILES"
          echo "======================================"

          test -d lambda/product/pymysql
          test -d lambda/product/cryptography

          echo "PyMySQL directory found."
          echo "cryptography directory found."


      # ======================================================
      # 11. CREATE ZIP
      # ======================================================

      - name: Package Product Lambda

        run: |

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          cd lambda/product

          zip -r ../../product.zip . \
            -x "*.pyc" \
            -x "__pycache__/*"

          cd ../..

          ls -lh product.zip

          echo "Lambda package created."


      # ======================================================
      # 12. VERIFY ZIP CONTENT
      # ======================================================

      - name: Verify Lambda ZIP

        run: |

          echo "======================================"
          echo "VERIFYING ZIP"
          echo "======================================"

          unzip -l product.zip | grep -E \
            "pymysql|cryptography|lambda_function.py" | head -50

          echo "ZIP verification completed."


      # ======================================================
      # 13. GET ARTIFACT BUCKET
      # ======================================================

      - name: Get Lambda Artifact Bucket

        id: artifact

        run: |

          echo "======================================"
          echo "GETTING ARTIFACT BUCKET"
          echo "======================================"

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket not found."
            exit 1
          fi

          echo "Artifact bucket: $ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 14. CREATE UNIQUE PRODUCT CODE KEY
      # ======================================================

      - name: Create Product Lambda S3 key

        id: code

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          echo "Product code key: ${PRODUCT_CODE_KEY}"

          echo "code_key=${PRODUCT_CODE_KEY}" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 15. UPLOAD ZIP
      # ======================================================

      - name: Upload Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.code.outputs.code_key }}

        run: |

          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"

          echo "Upload successful."


      # ======================================================
      # 16. VERIFY S3 PACKAGE
      # ======================================================

      - name: Verify Product Lambda package

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.code.outputs.code_key }}

        run: |

          echo "======================================"
          echo "VERIFYING S3 PACKAGE"
          echo "======================================"

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ======================================================
      # 17. VALIDATE CLOUDFORMATION
      # ======================================================

      - name: Validate API CloudFormation

        run: |

          echo "======================================"
          echo "VALIDATING API STACK"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"

          echo "CloudFormation validation successful."


      # ======================================================
      # 18. GET PRIVATE SUBNET A
      # ======================================================

      - name: Get Private Subnet A

        id: subnet-a

        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          echo "Private Subnet A: $SUBNET_A"

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 19. GET PRIVATE SUBNET B
      # ======================================================

      - name: Get Private Subnet B

        id: subnet-b

        run: |

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          echo "Private Subnet B: $SUBNET_B"

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 20. GET LAMBDA SECURITY GROUP
      # ======================================================

      - name: Get Lambda Security Group

        id: lambda-sg

        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "Lambda Security Group: $LAMBDA_SG"

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 21. GET PRODUCT IAM ROLE
      # ======================================================

      - name: Get Product Lambda IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn not found."
            exit 1
          fi

          echo "Product Lambda role: $PRODUCT_ROLE"

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 22. GET AUTHORIZER ARN
      # ======================================================

      - name: Get Authorizer Lambda ARN

        id: auth

        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "Authorizer ARN: $AUTHORIZER_ARN"

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # 23. CLEAN FAILED REVIEW STACK
      # ======================================================

      - name: Clean failed API stack

        run: |

          echo "======================================"
          echo "CHECKING EXISTING API STACK"
          echo "======================================"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "Current stack status: ${STACK_STATUS}"

          if [ "${STACK_STATUS}" = "REVIEW_IN_PROGRESS" ]; then

            echo "Deleting REVIEW_IN_PROGRESS stack..."

            aws cloudformation delete-stack \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"

            aws cloudformation wait stack-delete-complete \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"

            echo "Old REVIEW_IN_PROGRESS stack deleted."

          elif [ "${STACK_STATUS}" = "ROLLBACK_COMPLETE" ]; then

            echo "Deleting ROLLBACK_COMPLETE stack..."

            aws cloudformation delete-stack \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"

            aws cloudformation wait stack-delete-complete \
              --stack-name cloudmart-dev-api \
              --region "${AWS_REGION}"

            echo "Old ROLLBACK_COMPLETE stack deleted."

          else

            echo "No failed stack cleanup required."

          fi


      # ======================================================
      # 24. DEPLOY API STACK
      # ======================================================

      - name: Deploy API Stack

        env:

          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY: ${{ steps.code.outputs.code_key }}

          PRIVATE_SUBNET_A: ${{ steps.subnet-a.outputs.subnet }}

          PRIVATE_SUBNET_B: ${{ steps.subnet-b.outputs.subnet }}

          LAMBDA_SECURITY_GROUP: ${{ steps.lambda-sg.outputs.security_group }}

          PRODUCT_ROLE: ${{ steps.iam.outputs.product_role }}

          AUTHORIZER_ARN: ${{ steps.auth.outputs.authorizer_arn }}

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket: ${ARTIFACT_BUCKET}"
          echo "Product code key: ${PRODUCT_CODE_KEY}"
          echo "Subnet A: ${PRIVATE_SUBNET_A}"
          echo "Subnet B: ${PRIVATE_SUBNET_B}"
          echo "Lambda SG: ${LAMBDA_SECURITY_GROUP}"
          echo "Product Role: ${PRODUCT_ROLE}"
          echo "Authorizer: ${AUTHORIZER_ARN}"

          aws cloudformation deploy --template-file cloudformation/api/api-stack.yaml --stack-name cloudmart-dev-api --parameter-overrides Environment="${ENVIRONMENT}" PrivateSubnetIds="${PRIVATE_SUBNET_A},${PRIVATE_SUBNET_B}" LambdaSecurityGroupId="${LAMBDA_SECURITY_GROUP}" ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" AuthorizerLambdaArn="${AUTHORIZER_ARN}" LambdaCodeBucket="${ARTIFACT_BUCKET}" ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" DBHostParameter="/cloudmart/dev/db/host" DBNameParameter="/cloudmart/dev/db/name" DBUsernameParameter="/cloudmart/dev/db/username" DBPasswordParameter="/cloudmart/dev/db/password" DBPortParameter="/cloudmart/dev/db/port" AuthorizerCacheTTL="300" --region "${AWS_REGION}" --no-fail-on-empty-changeset

          echo "CloudFormation deployment command completed."


      # ======================================================
      # 25. SHOW CLOUDFORMATION EVENTS
      # ======================================================

      - name: Show CloudFormation Events

        if: always()

        run: |

          echo "======================================"
          echo "CLOUDFORMATION EVENTS"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


      # ======================================================
      # 26. CHECK API STACK
      # ======================================================

      - name: Check API Stack

        run: |

          echo "======================================"
          echo "API STACK STATUS"
          echo "======================================"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status: ${STACK_STATUS}"

          case "${STACK_STATUS}" in

            CREATE_COMPLETE)
              echo "API stack created successfully."
              ;;

            UPDATE_COMPLETE)
              echo "API stack updated successfully."
              ;;

            *)
              echo "ERROR: CloudFormation stack is not healthy."
              exit 1
              ;;

          esac


      # ======================================================
      # 27. DISPLAY API URL
      # ======================================================

      - name: Display API URL

        run: |

          echo "======================================"
          echo "CLOUDMART API URL"
          echo "======================================"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "${API_URL}"

          echo "======================================"
name: CloudMart API Infrastructure

on:

  push:
    branches:
      - milestone-3

    paths:
      - "cloudformation/api/**"
      - "cloudformation/schema/**"
      - "lambda/product/**"
      - "lambda/schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1

  ENVIRONMENT: dev


jobs:

  deploy-api:

    name: Build and Deploy CloudMart API

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ========================================================
      # 2. AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume:
            ${{ secrets.AWS_ROLE_ARN }}

          aws-region:
            ${{ env.AWS_REGION }}


      # ========================================================
      # 3. VERIFY AWS
      # ========================================================

      - name: Verify AWS access

        run: |

          echo "======================================"
          echo "AWS CONFIGURATION"
          echo "======================================"

          echo "Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"

          aws sts get-caller-identity


      # ========================================================
      # 4. PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ========================================================
      # 5. VERIFY FILES
      # ========================================================

      - name: Verify Lambda files

        run: |

          echo "======================================"
          echo "VERIFYING FILES"
          echo "======================================"

          test -f lambda/product/lambda_function.py
          test -f lambda/product/requirements.txt

          test -f lambda/schema/schema_function.py
          test -f lambda/schema/requirements.txt
          test -f lambda/schema/schema.sql

          test -f cloudformation/api/api-stack.yaml
          test -f cloudformation/schema/schema-stack.yaml

          echo "All required files exist."


      # ========================================================
      # 6. INSTALL PRODUCT DEPENDENCIES
      # ========================================================

      - name: Install Product Lambda dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/


      # ========================================================
      # 7. VERIFY PRODUCT DEPENDENCIES
      # ========================================================

      - name: Verify Product Lambda dependencies

        run: |

          python - <<'PY'

          import sys

          sys.path.insert(
              0,
              "lambda/product"
          )

          import pymysql
          import cryptography

          print(
              "PyMySQL:",
              pymysql.__version__
          )

          print(
              "cryptography:",
              cryptography.__version__
          )

          print(
              "Product Lambda dependencies OK"
          )

          PY


      # ========================================================
      # 8. PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda

        run: |

          rm -f product.zip

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          echo "Product Lambda package:"
          ls -lh product.zip


      # ========================================================
      # 9. INSTALL SCHEMA DEPENDENCIES
      # ========================================================

      - name: Install Schema Lambda dependencies

        run: |

          python -m pip install \
            -r lambda/schema/requirements.txt \
            -t lambda/schema/


      # ========================================================
      # 10. VERIFY SCHEMA DEPENDENCIES
      # ========================================================

      - name: Verify Schema Lambda dependencies

        run: |

          python - <<'PY'

          import sys

          sys.path.insert(
              0,
              "lambda/schema"
          )

          import pymysql
          import cryptography

          print(
              "PyMySQL:",
              pymysql.__version__
          )

          print(
              "cryptography:",
              cryptography.__version__
          )

          print(
              "Schema Lambda dependencies OK"
          )

          PY


      # ========================================================
      # 11. PACKAGE SCHEMA LAMBDA
      # ========================================================

      - name: Package Schema Lambda

        run: |

          rm -f schema.zip

          cd lambda/schema

          zip -r ../../schema.zip .

          cd ../..

          echo "Schema Lambda package:"
          ls -lh schema.zip


      # ========================================================
      # 12. GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda Artifact Bucket

        id: artifact

        run: |

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi

          echo "Artifact bucket: $ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 13. CREATE UNIQUE CODE KEY
      # ========================================================

      - name: Create Lambda package keys

        id: package

        run: |

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          SCHEMA_CODE_KEY="schema/${GITHUB_SHA}/schema.zip"

          echo "product_key=$PRODUCT_CODE_KEY" \
            >> "$GITHUB_OUTPUT"

          echo "schema_key=$SCHEMA_CODE_KEY" \
            >> "$GITHUB_OUTPUT"

          echo "Product key:"
          echo "$PRODUCT_CODE_KEY"

          echo "Schema key:"
          echo "$SCHEMA_CODE_KEY"


      # ========================================================
      # 14. UPLOAD PRODUCT PACKAGE
      # ========================================================

      - name: Upload Product Lambda

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY:
            ${{ steps.package.outputs.product_key }}

        run: |

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 15. UPLOAD SCHEMA PACKAGE
      # ========================================================

      - name: Upload Schema Lambda

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

          SCHEMA_CODE_KEY:
            ${{ steps.package.outputs.schema_key }}

        run: |

          aws s3 cp \
            schema.zip \
            "s3://${ARTIFACT_BUCKET}/${SCHEMA_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ========================================================
      # 16. GET PRIVATE SUBNET A
      # ========================================================

      - name: Get Private Subnet A

        id: subnet-a

        run: |

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then

            echo "ERROR: PrivateSubnetAId not found."

            exit 1

          fi

          echo "subnet=$SUBNET_A" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 17. GET PRIVATE SUBNET B
      # ========================================================

      - name: Get Private Subnet B

        id: subnet-b

        run: |

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then

            echo "ERROR: PrivateSubnetBId not found."

            exit 1

          fi

          echo "subnet=$SUBNET_B" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 18. GET LAMBDA SECURITY GROUP
      # ========================================================

      - name: Get Lambda Security Group

        id: lambda-sg

        run: |

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then

            echo "ERROR: LambdaSecurityGroupId not found."

            exit 1

          fi

          echo "security_group=$LAMBDA_SG" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 19. GET PRODUCT IAM ROLE
      # ========================================================

      - name: Get Product IAM Role

        id: iam

        run: |

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then

            echo "ERROR: ProductLambdaRoleArn not found."

            exit 1

          fi

          echo "product_role=$PRODUCT_ROLE" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 20. GET AUTHORIZER ARN
      # ========================================================

      - name: Get Authorizer Lambda ARN

        id: auth

        run: |

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then

            echo "ERROR: AuthorizerLambdaArn not found."

            exit 1

          fi

          echo "authorizer_arn=$AUTHORIZER_ARN" \
            >> "$GITHUB_OUTPUT"


      # ========================================================
      # 21. VALIDATE SCHEMA STACK
      # ========================================================

      - name: Validate Schema Stack

        run: |

          aws cloudformation validate-template \
            --template-body \
            file://cloudformation/schema/schema-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # 22. DEPLOY SCHEMA STACK
      # ========================================================

      - name: Deploy Database Schema Stack

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

          SCHEMA_CODE_KEY:
            ${{ steps.package.outputs.schema_key }}

        run: |

          echo "======================================"
          echo "DEPLOYING DATABASE SCHEMA"
          echo "======================================"

          aws cloudformation deploy \
            --template-file cloudformation/schema/schema-stack.yaml \
            --stack-name cloudmart-dev-schema \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.subnet-a.outputs.subnet }},${{ steps.subnet-b.outputs.subnet }}" \
              LambdaSecurityGroupId="${{ steps.lambda-sg.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \
              LambdaCodeBucket="${ARTIFACT_BUCKET}" \
              SchemaLambdaCodeKey="${SCHEMA_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"


      # ========================================================
      # 23. WAIT FOR SCHEMA STACK
      # ========================================================

      - name: Wait for Schema Stack

        run: |

          echo "Waiting for database schema initialization..."

          aws cloudformation wait \
            stack-create-complete \
            --stack-name cloudmart-dev-schema \
            --region "${AWS_REGION}"


      # ========================================================
      # 24. CHECK SCHEMA STACK
      # ========================================================

      - name: Check Schema Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-schema \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Schema stack status: $STATUS"

          if [ "$STATUS" != "CREATE_COMPLETE" ] \
             && [ "$STATUS" != "UPDATE_COMPLETE" ]; then

            echo "ERROR: Schema stack is not healthy."

            exit 1

          fi


      # ========================================================
      # 25. VALIDATE API STACK
      # ========================================================

      - name: Validate API Stack

        run: |

          aws cloudformation validate-template \
            --template-body \
            file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ========================================================
      # 26. DEPLOY API STACK
      # ========================================================

      - name: Deploy API Stack

        env:

          ARTIFACT_BUCKET:
            ${{ steps.artifact.outputs.bucket }}

          PRODUCT_CODE_KEY:
            ${{ steps.package.outputs.product_key }}

        run: |

          echo "======================================"
          echo "DEPLOYING CLOUDMART API"
          echo "======================================"

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "Product code:"
          echo "$PRODUCT_CODE_KEY"

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name cloudmart-dev-api \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${{ steps.subnet-a.outputs.subnet }},${{ steps.subnet-b.outputs.subnet }}" \
              LambdaSecurityGroupId="${{ steps.lambda-sg.outputs.security_group }}" \
              ProductLambdaExecutionRoleArn="${{ steps.iam.outputs.product_role }}" \
              AuthorizerLambdaArn="${{ steps.auth.outputs.authorizer_arn }}" \
              LambdaCodeBucket="${ARTIFACT_BUCKET}" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              DBPortParameter="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"


      # ========================================================
      # 27. WAIT FOR API STACK
      # ========================================================

      - name: Wait for API Stack

        run: |

          echo "Waiting for API stack..."

          aws cloudformation wait \
            stack-create-complete \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}"


      # ========================================================
      # 28. CHECK API STACK
      # ========================================================

      - name: Check API Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "API stack status: $STATUS"

          if [ "$STATUS" != "CREATE_COMPLETE" ] \
             && [ "$STATUS" != "UPDATE_COMPLETE" ]; then

            echo "ERROR: API stack is not healthy."

            exit 1

          fi


      # ========================================================
      # 29. DISPLAY API URL
      # ========================================================

      - name: Display API URL

        run: |

          echo "======================================"
          echo "CLOUDMART API"
          echo "======================================"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-api \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "API URL:"
          echo "${API_URL}"

          echo "======================================"
          echo "GET PRODUCTS:"
          echo "${API_URL}/products"
          echo "======================================"
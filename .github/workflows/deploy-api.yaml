```yaml
name: CloudMart API Infrastructure

on:
  push:
    branches:
      - milestone-3
    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  API_STACK: cloudmart-dev-api

jobs:

  deploy-api:

    name: Build and Deploy API Stack
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 3. VERIFY AWS
      # ========================================================

      - name: Verify AWS access
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "AWS ACCESS"
          echo "======================================"

          aws sts get-caller-identity

          echo "AWS Region: ${AWS_REGION}"
          echo "Environment: ${ENVIRONMENT}"


      # ========================================================
      # 4. SETUP PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # 5. VERIFY FILES
      # ========================================================

      - name: Verify repository files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING FILES"
          echo "======================================"

          test -f cloudformation/api/api-stack.yaml
          test -f lambda/product/lambda_function.py
          test -f lambda/product/requirements.txt
          test -f schema/schema.sql

          echo "All required files found."


      # ========================================================
      # 6. INSTALL PRODUCT LAMBDA DEPENDENCIES
      # ========================================================

      - name: Install Product Lambda dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING LAMBDA DEPENDENCIES"
          echo "======================================"

          python -m pip install --upgrade pip

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t lambda/product/

          python - <<'PY'
          import sys

          sys.path.insert(0, "lambda/product")

          import boto3
          import pymysql
          import cryptography

          print("boto3:", boto3.__version__)
          print("PyMySQL:", pymysql.__version__)
          print("cryptography:", cryptography.__version__)
          print("Lambda dependencies OK.")
          PY


      # ========================================================
      # 7. PACKAGE PRODUCT LAMBDA
      # ========================================================

      - name: Package Product Lambda
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING PRODUCT LAMBDA"
          echo "======================================"

          rm -f product.zip

          cd lambda/product

          zip -r ../../product.zip .

          cd ../..

          test -f product.zip

          echo "Product Lambda package:"
          ls -lh product.zip

          echo ""
          echo "Checking ZIP contents..."

          unzip -l product.zip | grep -E \
            "boto3|botocore|pymysql|cryptography|lambda_function.py" | head -50


      # ========================================================
      # 8. GET ARTIFACT BUCKET
      # ========================================================

      - name: Get Lambda Artifact Bucket
        id: artifact
        shell: bash
        run: |
          set -e

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket not found."
            exit 1
          fi

          echo "Artifact bucket:"
          echo "$ARTIFACT_BUCKET"

          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 9. UPLOAD PRODUCT LAMBDA
      # ========================================================

      - name: Upload Product Lambda package
        id: upload
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}

        run: |
          set -e

          PRODUCT_CODE_KEY="product/${GITHUB_SHA}/product.zip"

          echo "======================================"
          echo "UPLOADING PRODUCT LAMBDA"
          echo "======================================"

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"

          echo "code_key=$PRODUCT_CODE_KEY" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 10. VERIFY S3 PACKAGE
      # ========================================================

      - name: Verify Product Lambda package
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.upload.outputs.code_key }}

        run: |
          set -e

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"

          echo "Lambda package exists in S3."


      # ========================================================
      # 11. VALIDATE CLOUDFORMATION
      # ========================================================

      - name: Validate API CloudFormation
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VALIDATING API CLOUDFORMATION"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"

          echo "CloudFormation template syntax is valid."


      # ========================================================
      # 12. GET PRIVATE SUBNET A
      # ========================================================

      - name: Get Private Subnet A
        id: subnet-a
        shell: bash
        run: |
          set -e

          SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_A" ] || [ "$SUBNET_A" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          echo "subnet=$SUBNET_A" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 13. GET PRIVATE SUBNET B
      # ========================================================

      - name: Get Private Subnet B
        id: subnet-b
        shell: bash
        run: |
          set -e

          SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_B" ] || [ "$SUBNET_B" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          echo "subnet=$SUBNET_B" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 14. GET LAMBDA SECURITY GROUP
      # ========================================================

      - name: Get Lambda Security Group
        id: lambda-sg
        shell: bash
        run: |
          set -e

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "security_group=$LAMBDA_SG" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 15. GET PRODUCT IAM ROLE
      # ========================================================

      - name: Get Product Lambda IAM Role
        id: iam
        shell: bash
        run: |
          set -e

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn not found."
            exit 1
          fi

          echo "product_role=$PRODUCT_ROLE" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 16. GET AUTHORIZER LAMBDA ARN
      # ========================================================

      - name: Get Authorizer Lambda ARN
        id: auth
        shell: bash
        run: |
          set -e

          AUTHORIZER_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORIZER_ARN" ] || [ "$AUTHORIZER_ARN" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "authorizer_arn=$AUTHORIZER_ARN" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 17. VERIFY REQUIRED SSM PARAMETERS
      # ========================================================

      - name: Verify database parameters
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING SSM PARAMETERS"
          echo "======================================"

          for PARAM in \
            "/cloudmart/dev/db/host" \
            "/cloudmart/dev/db/name" \
            "/cloudmart/dev/db/username" \
            "/cloudmart/dev/db/password" \
            "/cloudmart/dev/db/port"
          do
            echo "Checking $PARAM"

            aws ssm get-parameter \
              --name "$PARAM" \
              --region "${AWS_REGION}" \
              --with-decryption \
              --query "Parameter.Name" \
              --output text > /dev/null
          done

          echo "All required database parameters exist."


      # ========================================================
      # 18. CREATE CHANGE SET
      # ========================================================

      - name: Create API CloudFormation Change Set
        id: changeset
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.artifact.outputs.bucket }}
          PRODUCT_CODE_KEY: ${{ steps.upload.outputs.code_key }}
          SUBNET_A: ${{ steps.subnet-a.outputs.subnet }}
          SUBNET_B: ${{ steps.subnet-b.outputs.subnet }}
          LAMBDA_SG: ${{ steps.lambda-sg.outputs.security_group }}
          PRODUCT_ROLE: ${{ steps.iam.outputs.product_role }}
          AUTHORIZER_ARN: ${{ steps.auth.outputs.authorizer_arn }}

        run: |
          set -e

          CHANGESET_NAME="cloudmart-api-${GITHUB_SHA}"

          echo "======================================"
          echo "CREATING API CHANGE SET"
          echo "======================================"

          echo "Change set:"
          echo "$CHANGESET_NAME"

          STACK_EXISTS=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackName" \
            --output text 2>/dev/null || true)

          if [ -z "$STACK_EXISTS" ] || [ "$STACK_EXISTS" = "None" ]; then
            CHANGESET_TYPE="CREATE"
          else
            CHANGESET_TYPE="UPDATE"
          fi

          echo "Change set type: $CHANGESET_TYPE"

          set +e

          aws cloudformation create-change-set \
            --stack-name "${API_STACK}" \
            --change-set-name "${CHANGESET_NAME}" \
            --change-set-type "${CHANGESET_TYPE}" \
            --template-body file://cloudformation/api/api-stack.yaml \
            --capabilities CAPABILITY_IAM \
            --parameters \
              ParameterKey=Environment,ParameterValue="${ENVIRONMENT}" \
              ParameterKey=PrivateSubnetIds,ParameterValue="${SUBNET_A},${SUBNET_B}" \
              ParameterKey=LambdaSecurityGroupId,ParameterValue="${LAMBDA_SG}" \
              ParameterKey=ProductLambdaExecutionRoleArn,ParameterValue="${PRODUCT_ROLE}" \
              ParameterKey=AuthorizerLambdaArn,ParameterValue="${AUTHORIZER_ARN}" \
              ParameterKey=LambdaCodeBucket,ParameterValue="${ARTIFACT_BUCKET}" \
              ParameterKey=ProductLambdaCodeKey,ParameterValue="${PRODUCT_CODE_KEY}" \
              ParameterKey=DBHostParameter,ParameterValue="/cloudmart/dev/db/host" \
              ParameterKey=DBNameParameter,ParameterValue="/cloudmart/dev/db/name" \
              ParameterKey=DBUsernameParameter,ParameterValue="/cloudmart/dev/db/username" \
              ParameterKey=DBPasswordParameter,ParameterValue="/cloudmart/dev/db/password" \
              ParameterKey=DBPortParameter,ParameterValue="/cloudmart/dev/db/port" \
            --region "${AWS_REGION}"

          CREATE_EXIT=$?

          set -e

          if [ "$CREATE_EXIT" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "CHANGE SET CREATION FAILED"
            echo "======================================"

            echo ""
            echo "DETAILED CLOUDFORMATION EVENTS"
            echo ""

            aws cloudformation describe-events \
              --stack-name "${API_STACK}" \
              --region "${AWS_REGION}" \
              --query "Events[?EventType=='VALIDATION_ERROR'].[Timestamp,LogicalResourceId,ResourceType,ValidationFailureMode,ValidationStatusReason,ValidationPath]" \
              --output table || true

            echo ""
            echo "RECENT STACK EVENTS"
            echo ""

            aws cloudformation describe-stack-events \
              --stack-name "${API_STACK}" \
              --region "${AWS_REGION}" \
              --max-items 20 \
              --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            exit "$CREATE_EXIT"
          fi

          echo "Waiting for change set..."

          aws cloudformation wait change-set-create-complete \
            --stack-name "${API_STACK}" \
            --change-set-name "${CHANGESET_NAME}" \
            --region "${AWS_REGION}"

          echo "Change set created successfully."

          echo ""
          echo "======================================"
          echo "CHANGE SET"
          echo "======================================"

          aws cloudformation describe-change-set \
            --stack-name "${API_STACK}" \
            --change-set-name "${CHANGESET_NAME}" \
            --region "${AWS_REGION}" \
            --query "Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement]" \
            --output table

          echo "changeset=$CHANGESET_NAME" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 19. EXECUTE CHANGE SET
      # ========================================================

      - name: Execute API CloudFormation Change Set
        shell: bash
        env:
          CHANGESET_NAME: ${{ steps.changeset.outputs.changeset }}

        run: |
          set -e

          echo "======================================"
          echo "EXECUTING API CHANGE SET"
          echo "======================================"

          aws cloudformation execute-change-set \
            --stack-name "${API_STACK}" \
            --change-set-name "${CHANGESET_NAME}" \
            --region "${AWS_REGION}"

          echo "Waiting for stack update..."

          aws cloudformation wait stack-update-complete \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" || {

              echo ""
              echo "======================================"
              echo "STACK UPDATE FAILED"
              echo "======================================"

              aws cloudformation describe-stack-events \
                --stack-name "${API_STACK}" \
                --region "${AWS_REGION}" \
                --max-items 30 \
                --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
                --output table

              exit 1
            }


      # ========================================================
      # 20. CHECK STACK
      # ========================================================

      - name: Check API Stack
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "API STACK STATUS"
          echo "======================================"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Stack status:"
          echo "$STATUS"

          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "API stack is healthy."
              ;;

            *)
              echo "ERROR: CloudFormation stack is not healthy."
              exit 1
              ;;

          esac


      # ========================================================
      # 21. DISPLAY API URL
      # ========================================================

      - name: Display API URL
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CLOUDMART API URL"
          echo "======================================"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo ""
          echo "API URL:"
          echo "$API_URL"
          echo ""


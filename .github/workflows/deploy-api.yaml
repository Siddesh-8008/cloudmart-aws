name: Deploy CloudMart API

on:
  push:
    branches:
      - orders
    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "lambda/schema/**"
      - "lambda/order_processor/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  API_STACK_NAME: cloudmart-dev-api
  DATA_STACK_NAME: cloudmart-dev-data-new
  NETWORK_STACK_NAME: cloudmart-dev-network
  IAM_STACK_NAME: cloudmart-dev-iam
  AUTH_STACK_NAME: cloudmart-dev-auth

  PRODUCT_CODE_KEY: product/product-${{ github.sha }}.zip
  SCHEMA_CODE_KEY: schema/schema-${{ github.sha }}.zip
  ORDER_PROCESSOR_CODE_KEY: order-processor/order-processor-${{ github.sha }}.zip


jobs:

  deploy-api:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. CONFIGURE AWS OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 4. VERIFY AWS IDENTITY
      # ==========================================================

      - name: Verify AWS identity
        run: |
          set -e

          aws sts get-caller-identity


      # ==========================================================
      # 5. VERIFY REQUIRED STACKS
      # ==========================================================

      - name: Verify required CloudFormation stacks
        run: |
          set -e

          echo "Checking required CloudFormation stacks..."

          for STACK in \
            "${NETWORK_STACK_NAME}" \
            "${DATA_STACK_NAME}" \
            "${IAM_STACK_NAME}" \
            "${AUTH_STACK_NAME}"
          do

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${STACK}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].StackStatus" \
              --output text)

            echo "${STACK}: ${STATUS}"

            case "${STATUS}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                ;;
              *)
                echo "ERROR: Stack ${STACK} is not in a usable state."
                exit 1
                ;;
            esac

          done

          echo "Required stacks verified."


      # ==========================================================
      # 6. SHOW DATA STACK OUTPUTS
      # ==========================================================

      - name: Show Data Stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${DATA_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ==========================================================
      # 7. GET ARTIFACT BUCKET
      # ==========================================================

      - name: Get Lambda artifact bucket
        id: artifact-bucket
        run: |
          set -e

          ARTIFACT_BUCKET=$(aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-LambdaArtifactBucketName'].Value" \
            --output text)

          if [ -z "${ARTIFACT_BUCKET}" ] || [ "${ARTIFACT_BUCKET}" = "None" ]; then
            echo "ERROR: Lambda artifact bucket export was not found."
            exit 1
          fi

          echo "Artifact bucket: ${ARTIFACT_BUCKET}"

          echo "ARTIFACT_BUCKET=${ARTIFACT_BUCKET}" >> "${GITHUB_ENV}"


      # ==========================================================
      # 8. PACKAGE PRODUCT LAMBDA
      # ==========================================================

      - name: Package Product Lambda
        run: |
          set -e

          rm -rf product-package
          mkdir -p product-package

          cp lambda/product/* product-package/

          if [ -f lambda/product/requirements.txt ]; then
            pip install \
              -r lambda/product/requirements.txt \
              -t product-package
          fi

          cd product-package

          zip -r ../product.zip .

          cd ..


      # ==========================================================
      # 9. VERIFY PRODUCT PACKAGE
      # ==========================================================

      - name: Verify Product package
        run: |
          set -e

          unzip -l product.zip


      # ==========================================================
      # 10. PACKAGE SCHEMA LAMBDA
      # ==========================================================

      - name: Package Schema Lambda
        run: |
          set -e

          rm -rf schema-package
          mkdir -p schema-package

          cp lambda/schema/* schema-package/

          if [ -f lambda/schema/requirements.txt ]; then
            pip install \
              -r lambda/schema/requirements.txt \
              -t schema-package
          fi

          cd schema-package

          zip -r ../schema.zip .

          cd ..


      # ==========================================================
      # 11. VERIFY SCHEMA PACKAGE
      # ==========================================================

      - name: Verify Schema package
        run: |
          set -e

          unzip -l schema.zip


      # ==========================================================
      # 12. PACKAGE ORDER PROCESSOR
      # ==========================================================

      - name: Package Order Processor Lambda
        run: |
          set -e

          rm -rf order-processor-package
          mkdir -p order-processor-package

          cp lambda/order_processor/* order-processor-package/

          if [ -f lambda/order_processor/requirements.txt ]; then
            pip install \
              -r lambda/order_processor/requirements.txt \
              -t order-processor-package
          fi

          cd order-processor-package

          zip -r ../order-processor.zip .

          cd ..


      # ==========================================================
      # 13. VERIFY ORDER PROCESSOR PACKAGE
      # ==========================================================

      - name: Verify Order Processor package
        run: |
          set -e

          unzip -l order-processor.zip


      # ==========================================================
      # 14. UPLOAD PRODUCT LAMBDA
      # ==========================================================

      - name: Upload Product Lambda
        run: |
          set -e

          aws s3 cp \
            product.zip \
            "s3://${ARTIFACT_BUCKET}/${PRODUCT_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ==========================================================
      # 15. UPLOAD SCHEMA LAMBDA
      # ==========================================================

      - name: Upload Schema Lambda
        run: |
          set -e

          aws s3 cp \
            schema.zip \
            "s3://${ARTIFACT_BUCKET}/${SCHEMA_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ==========================================================
      # 16. UPLOAD ORDER PROCESSOR LAMBDA
      # ==========================================================

      - name: Upload Order Processor Lambda
        run: |
          set -e

          aws s3 cp \
            order-processor.zip \
            "s3://${ARTIFACT_BUCKET}/${ORDER_PROCESSOR_CODE_KEY}" \
            --region "${AWS_REGION}"


      # ==========================================================
      # 17. VERIFY PRODUCT S3
      # ==========================================================

      - name: Verify Product artifact
        run: |
          set -e

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${PRODUCT_CODE_KEY}"


      # ==========================================================
      # 18. VERIFY SCHEMA S3
      # ==========================================================

      - name: Verify Schema artifact
        run: |
          set -e

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${SCHEMA_CODE_KEY}"


      # ==========================================================
      # 19. VERIFY ORDER PROCESSOR S3
      # ==========================================================

      - name: Verify Order Processor artifact
        run: |
          set -e

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${ORDER_PROCESSOR_CODE_KEY}"


      # ==========================================================
      # 20. SHOW NETWORK OUTPUTS
      # ==========================================================

      - name: Show Network outputs
        run: |
          set -e

          aws cloudformation describe-stacks \
            --stack-name "${NETWORK_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table


      # ==========================================================
      # 21. GET PRIVATE SUBNET A
      # ==========================================================

      - name: Get Private Subnet A
        run: |
          set -e

          SUBNET_A=$(aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-PrivateSubnetAId'].Value" \
            --output text)

          if [ -z "${SUBNET_A}" ] || [ "${SUBNET_A}" = "None" ]; then
            echo "ERROR: PrivateSubnetA export not found."
            exit 1
          fi

          echo "SUBNET_A=${SUBNET_A}" >> "${GITHUB_ENV}"

          echo "Private Subnet A: ${SUBNET_A}"


      # ==========================================================
      # 22. GET PRIVATE SUBNET B
      # ==========================================================

      - name: Get Private Subnet B
        run: |
          set -e

          SUBNET_B=$(aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-PrivateSubnetBId'].Value" \
            --output text)

          if [ -z "${SUBNET_B}" ] || [ "${SUBNET_B}" = "None" ]; then
            echo "ERROR: PrivateSubnetB export not found."
            exit 1
          fi

          echo "SUBNET_B=${SUBNET_B}" >> "${GITHUB_ENV}"

          echo "Private Subnet B: ${SUBNET_B}"


      # ==========================================================
      # 23. GET LAMBDA SECURITY GROUP
      # ==========================================================

      - name: Get Lambda Security Group
        run: |
          set -e

          LAMBDA_SG=$(aws cloudformation list-exports \
            --region "${AWS_REGION}" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-LambdaSecurityGroupId'].Value" \
            --output text)

          if [ -z "${LAMBDA_SG}" ] || [ "${LAMBDA_SG}" = "None" ]; then
            echo "ERROR: Lambda Security Group export not found."
            exit 1
          fi

          echo "LAMBDA_SG=${LAMBDA_SG}" >> "${GITHUB_ENV}"

          echo "Lambda Security Group: ${LAMBDA_SG}"


      # ==========================================================
      # 24. GET IAM ROLE ARNS
      # ==========================================================

      - name: Get IAM role ARNs
        run: |
          set -e

          PRODUCT_ROLE=$(aws iam get-role \
            --role-name "CloudMart-${ENVIRONMENT}-product-lambda-role" \
            --query "Role.Arn" \
            --output text)

          ORDER_PROCESSOR_ROLE=$(aws iam get-role \
            --role-name "CloudMart-${ENVIRONMENT}-order-processor-lambda-role" \
            --query "Role.Arn" \
            --output text)

          if [ -z "${PRODUCT_ROLE}" ] || [ "${PRODUCT_ROLE}" = "None" ]; then
            echo "ERROR: Product Lambda IAM role was not found."
            exit 1
          fi

          if [ -z "${ORDER_PROCESSOR_ROLE}" ] || [ "${ORDER_PROCESSOR_ROLE}" = "None" ]; then
            echo "ERROR: Order Processor IAM role was not found."
            exit 1
          fi

          echo "PRODUCT_ROLE=${PRODUCT_ROLE}" >> "${GITHUB_ENV}"
          echo "ORDER_PROCESSOR_ROLE=${ORDER_PROCESSOR_ROLE}" >> "${GITHUB_ENV}"

          echo "Product role: ${PRODUCT_ROLE}"
          echo "Order Processor role: ${ORDER_PROCESSOR_ROLE}"


      # ==========================================================
      # 25. GET AUTHORIZER ARN
      # ==========================================================

      - name: Get Authorizer Lambda ARN
        run: |
          set -e

          AUTHORIZE_ARN=$(aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-authorizer" \
            --region "${AWS_REGION}" \
            --query "Configuration.FunctionArn" \
            --output text)

          if [ -z "${AUTHORIZE_ARN}" ] || [ "${AUTHORIZE_ARN}" = "None" ]; then
            echo "ERROR: Authorizer Lambda was not found."
            exit 1
          fi

          echo "AUTHORIZE_ARN=${AUTHORIZE_ARN}" >> "${GITHUB_ENV}"

          echo "Authorizer ARN: ${AUTHORIZE_ARN}"


      # ==========================================================
      # 26. VALIDATE API CLOUDFORMATION
      # ==========================================================

      - name: Validate API CloudFormation template
        run: |
          set -e

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "${AWS_REGION}"


      # ==========================================================
      # 27. DEPLOY API CLOUDFORMATION
      # ==========================================================

      - name: Deploy API CloudFormation stack
        run: |
          set -e

          echo "Deploying CloudMart API stack..."

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              PrivateSubnetIds="${SUBNET_A},${SUBNET_B}" \
              LambdaSecurityGroupId="${LAMBDA_SG}" \
              ProductLambdaExecutionRoleArn="${PRODUCT_ROLE}" \
              OrderProcessorLambdaExecutionRoleArn="${ORDER_PROCESSOR_ROLE}" \
              AuthorizerLambdaArn="${AUTHORIZE_ARN}" \
              ProductLambdaCodeBucket="${ARTIFACT_BUCKET}" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              SchemaLambdaCodeKey="${SCHEMA_CODE_KEY}" \
              OrderProcessorLambdaCodeKey="${ORDER_PROCESSOR_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBPortParameter="/cloudmart/dev/db/port" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              AuthorizerCacheTTL="300" \
              EventBusName="cloudmart-dev-event-bus" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}"

          echo "API stack deployment completed."


      # ==========================================================
      # 28. INITIALIZE / UPDATE DATABASE SCHEMA
      # ==========================================================

      - name: Initialize database schema
        run: |
          set -e

          echo "Checking API stack deployment..."

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo "Checking Schema Lambda..."

          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-schema" \
            --region "${AWS_REGION}" \
            --query "Configuration.FunctionName" \
            --output text

          echo "Database schema Lambda is available."


      # ==========================================================
      # 29. GET API ID AND VERIFY PATCH
      # ==========================================================

      - name: Verify PATCH orders method
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING PATCH /orders/{id}"
          echo "=============================================="

          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiId'].OutputValue" \
            --output text)

          if [ -z "${API_ID}" ] || [ "${API_ID}" = "None" ]; then
            echo "ERROR: ProductApiId output was not found."
            exit 1
          fi

          echo "API Gateway REST API ID: ${API_ID}"

          echo ""
          echo "Checking that API Gateway REST API exists..."

          aws apigateway get-rest-api \
            --rest-api-id "${API_ID}" \
            --region "${AWS_REGION}" \
            --query "[id,name]" \
            --output table

          echo ""
          echo "Finding /orders/{id} resource..."

          ORDER_ID_RESOURCE=$(aws apigateway get-resources \
            --rest-api-id "${API_ID}" \
            --region "${AWS_REGION}" \
            --query "items[?path=='/orders/{id}'].id | [0]" \
            --output text)

          if [ -z "${ORDER_ID_RESOURCE}" ] || [ "${ORDER_ID_RESOURCE}" = "None" ]; then
            echo "ERROR: /orders/{id} resource was not found."
            exit 1
          fi

          echo "Orders ID resource: ${ORDER_ID_RESOURCE}"

          echo ""
          echo "Checking PATCH method configuration..."

          PATCH_METHOD=$(aws apigateway get-method \
            --rest-api-id "${API_ID}" \
            --resource-id "${ORDER_ID_RESOURCE}" \
            --http-method PATCH \
            --region "${AWS_REGION}" \
            --output json)

          echo "${PATCH_METHOD}"

          AUTH_TYPE=$(echo "${PATCH_METHOD}" | jq -r '.authorizationType')
          AUTHORIZER_ID=$(echo "${PATCH_METHOD}" | jq -r '.authorizerId')
          INTEGRATION_TYPE=$(echo "${PATCH_METHOD}" | jq -r '.methodIntegration.type')

          echo ""
          echo "PATCH authorization type: ${AUTH_TYPE}"
          echo "PATCH authorizer ID: ${AUTHORIZER_ID}"
          echo "PATCH integration type: ${INTEGRATION_TYPE}"

          if [ "${AUTH_TYPE}" != "CUSTOM" ]; then
            echo "ERROR: PATCH is not using CUSTOM authorization."
            exit 1
          fi

          if [ -z "${AUTHORIZER_ID}" ] || [ "${AUTHORIZER_ID}" = "null" ]; then
            echo "ERROR: PATCH does not have a Lambda authorizer."
            exit 1
          fi

          if [ "${INTEGRATION_TYPE}" != "AWS_PROXY" ]; then
            echo "ERROR: PATCH is not configured with AWS_PROXY."
            exit 1
          fi

          echo ""
          echo "SUCCESS: PATCH /orders/{id} is correctly configured."


      # ==========================================================
      # 30. VERIFY DEV STAGE
      # ==========================================================

      - name: Verify API Gateway dev stage
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING DEV STAGE"
          echo "=============================================="

          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductApiId'].OutputValue" \
            --output text)

          if [ -z "${API_ID}" ] || [ "${API_ID}" = "None" ]; then
            echo "ERROR: ProductApiId output was not found."
            exit 1
          fi

          echo "API ID: ${API_ID}"

          STAGE_INFO=$(aws apigateway get-stage \
            --rest-api-id "${API_ID}" \
            --stage-name "${ENVIRONMENT}" \
            --region "${AWS_REGION}" \
            --output json)

          echo "Stage information:"
          echo "${STAGE_INFO}"

          DEPLOYMENT_ID=$(echo "${STAGE_INFO}" | jq -r '.deploymentId')

          if [ -z "${DEPLOYMENT_ID}" ] || [ "${DEPLOYMENT_ID}" = "null" ]; then
            echo "ERROR: No deployment is attached to the ${ENVIRONMENT} stage."
            exit 1
          fi

          echo ""
          echo "Current ${ENVIRONMENT} deployment ID: ${DEPLOYMENT_ID}"

          echo ""
          echo "SUCCESS: ${ENVIRONMENT} stage exists and has a deployment."


      # ==========================================================
      # 31. SHOW API STACK STATUS
      # ==========================================================

      - name: Show API stack status
        run: |
          set -e

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


      # ==========================================================
      # 32. SHOW API STACK OUTPUTS AND EVENTS
      # ==========================================================

      - name: Show API stack outputs and events
        run: |
          echo "=============================================="
          echo "API STACK OUTPUTS"
          echo "=============================================="

          aws cloudformation describe-stacks \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table

          echo ""
          echo "=============================================="
          echo "RECENT CLOUDFORMATION EVENTS"
          echo "=============================================="

          aws cloudformation describe-stack-events \
            --stack-name "${API_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true
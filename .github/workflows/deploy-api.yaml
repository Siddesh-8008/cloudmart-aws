name: CloudMart API Infrastructure

on:
  push:
    branches:
      - milestone-3
    paths:
      - "cloudformation/api/api-stack.yaml"
      - "lambda/product/**"
      - "lambda/schema/**"
      - "lambda/order_processor/**"
      - "schema/**"
      - ".github/workflows/deploy-api.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  API_STACK_NAME: cloudmart-dev-api
  DATA_STACK_NAME: cloudmart-dev-data
  NETWORK_STACK_NAME: cloudmart-dev-network
  IAM_STACK_NAME: cloudmart-dev-iam
  AUTH_STACK_NAME: cloudmart-dev-auth

  # Unique S3 keys force Lambda/CloudFormation to use the
  # newly packaged code for every GitHub commit.
  PRODUCT_CODE_KEY: product/product-${{ github.sha }}.zip
  SCHEMA_CODE_KEY: schema/schema-${{ github.sha }}.zip
  ORDER_PROCESSOR_CODE_KEY: order-processor/order-processor-${{ github.sha }}.zip

jobs:

  deploy-api:
    name: Deploy API Stack
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Configure AWS
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # 3. Setup Python 3.12
      #
      # IMPORTANT:
      # Lambda runtime is Python 3.12.
      # Therefore dependencies such as cryptography are
      # packaged using Python 3.12.
      # ---------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 4. Verify required CloudFormation stacks
      # ---------------------------------------------------------
      - name: Verify prerequisite stacks
        shell: bash
        run: |
          set -e

          echo "Checking Network stack..."
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" > /dev/null

          echo "Checking Data stack..."
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" > /dev/null

          echo "Checking IAM stack..."
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" > /dev/null

          echo "Checking Auth stack..."
          aws cloudformation describe-stacks \
            --stack-name "$AUTH_STACK_NAME" \
            --region "$AWS_REGION" > /dev/null

          echo "All prerequisite stacks exist."

      # ---------------------------------------------------------
      # 5. Get Lambda artifact bucket
      # ---------------------------------------------------------
      - name: Get Lambda artifact bucket
        shell: bash
        run: |
          set -e

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$ARTIFACT_BUCKET" ] || [ "$ARTIFACT_BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket was not found."
            exit 1
          fi

          echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"

          echo "Lambda artifact bucket:"
          echo "$ARTIFACT_BUCKET"

      # ---------------------------------------------------------
      # 6. Clean build directories
      # ---------------------------------------------------------
      - name: Clean build directories
        shell: bash
        run: |
          set -e

          rm -rf build

          mkdir -p build/product
          mkdir -p build/schema
          mkdir -p build/order_processor

      # ---------------------------------------------------------
      # 7. Package Product Lambda
      # ---------------------------------------------------------
      - name: Package Product Lambda
        shell: bash
        run: |
          set -e

          echo "Packaging Product Lambda..."

          python -m pip install \
            -r lambda/product/requirements.txt \
            -t build/product \
            --upgrade \
            --no-cache-dir

          cp lambda/product/lambda_function.py build/product/

          cd build/product

          zip -r ../../product.zip . > /dev/null

          cd ../..

          echo "Product Lambda package created."

      # ---------------------------------------------------------
      # 8. Package Schema Lambda
      #
      # IMPORTANT:
      # This package MUST contain cryptography.
      # ---------------------------------------------------------
      - name: Package Schema Lambda
        shell: bash
        run: |
          set -e

          echo "Packaging Schema Lambda..."

          python -m pip install \
            -r lambda/schema/requirements.txt \
            -t build/schema \
            --upgrade \
            --no-cache-dir

          cp lambda/schema/lambda_function.py build/schema/

          cd build/schema

          zip -r ../../schema.zip . > /dev/null

          cd ../..

          echo "Schema Lambda package created."

      # ---------------------------------------------------------
      # 9. Package Order Processor Lambda
      # ---------------------------------------------------------
      - name: Package Order Processor Lambda
        shell: bash
        run: |
          set -e

          echo "Packaging Order Processor Lambda..."

          python -m pip install \
            -r lambda/order_processor/requirements.txt \
            -t build/order_processor \
            --upgrade \
            --no-cache-dir

          cp lambda/order_processor/lambda_function.py build/order_processor/

          cd build/order_processor

          zip -r ../../order-processor.zip . > /dev/null

          cd ../..

          echo "Order Processor Lambda package created."

      # ---------------------------------------------------------
      # 10. Verify cryptography exists in packages
      # ---------------------------------------------------------
      - name: Verify Lambda dependencies
        shell: bash
        run: |
          set -e

          echo "Checking Product package..."
          unzip -l product.zip | grep -E "pymysql|cryptography" || true

          echo ""
          echo "Checking Schema package..."
          unzip -l schema.zip | grep -E "pymysql|cryptography"

          echo ""
          echo "Checking Order Processor package..."
          unzip -l order-processor.zip | grep -E "pymysql|cryptography"

          echo ""
          echo "Dependency verification completed."

      # ---------------------------------------------------------
      # 11. Upload Product Lambda
      # ---------------------------------------------------------
      - name: Upload Product Lambda package
        shell: bash
        run: |
          set -e

          aws s3 cp \
            product.zip \
            "s3://$ARTIFACT_BUCKET/${PRODUCT_CODE_KEY}" \
            --region "$AWS_REGION"

          echo "Uploaded:"
          echo "s3://$ARTIFACT_BUCKET/${PRODUCT_CODE_KEY}"

      # ---------------------------------------------------------
      # 12. Upload Schema Lambda
      # ---------------------------------------------------------
      - name: Upload Schema Lambda package
        shell: bash
        run: |
          set -e

          aws s3 cp \
            schema.zip \
            "s3://$ARTIFACT_BUCKET/${SCHEMA_CODE_KEY}" \
            --region "$AWS_REGION"

          echo "Uploaded:"
          echo "s3://$ARTIFACT_BUCKET/${SCHEMA_CODE_KEY}"

      # ---------------------------------------------------------
      # 13. Upload Order Processor Lambda
      # ---------------------------------------------------------
      - name: Upload Order Processor Lambda package
        shell: bash
        run: |
          set -e

          aws s3 cp \
            order-processor.zip \
            "s3://$ARTIFACT_BUCKET/${ORDER_PROCESSOR_CODE_KEY}" \
            --region "$AWS_REGION"

          echo "Uploaded:"
          echo "s3://$ARTIFACT_BUCKET/${ORDER_PROCESSOR_CODE_KEY}"

      # ---------------------------------------------------------
      # 14. Get Network outputs
      # ---------------------------------------------------------
      - name: Get Network stack outputs
        shell: bash
        run: |
          set -e

          PRIVATE_SUBNET_A=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetAId'].OutputValue" \
            --output text)

          PRIVATE_SUBNET_B=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetBId'].OutputValue" \
            --output text)

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          if [ -z "$PRIVATE_SUBNET_A" ] || [ "$PRIVATE_SUBNET_A" = "None" ]; then
            echo "ERROR: PrivateSubnetAId not found."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_B" ] || [ "$PRIVATE_SUBNET_B" = "None" ]; then
            echo "ERROR: PrivateSubnetBId not found."
            exit 1
          fi

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId not found."
            exit 1
          fi

          echo "PRIVATE_SUBNET_A=$PRIVATE_SUBNET_A" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET_B=$PRIVATE_SUBNET_B" >> "$GITHUB_ENV"
          echo "LAMBDA_SG=$LAMBDA_SG" >> "$GITHUB_ENV"

          echo "Private Subnet A: $PRIVATE_SUBNET_A"
          echo "Private Subnet B: $PRIVATE_SUBNET_B"
          echo "Lambda Security Group: $LAMBDA_SG"

      # ---------------------------------------------------------
      # 15. Get IAM outputs
      # ---------------------------------------------------------
      - name: Get IAM stack outputs
        shell: bash
        run: |
          set -e

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue" \
            --output text)

          ORDER_PROCESSOR_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='OrderProcessorLambdaRoleArn'].OutputValue" \
            --output text)

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn not found."
            exit 1
          fi

          if [ -z "$ORDER_PROCESSOR_ROLE" ] || [ "$ORDER_PROCESSOR_ROLE" = "None" ]; then
            echo "ERROR: OrderProcessorLambdaRoleArn not found."
            exit 1
          fi

          echo "PRODUCT_ROLE=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_PROCESSOR_ROLE=$ORDER_PROCESSOR_ROLE" >> "$GITHUB_ENV"

          echo "Product Lambda role found."
          echo "Order Processor Lambda role found."

      # ---------------------------------------------------------
      # 16. Get Authorizer ARN
      # ---------------------------------------------------------
      - name: Get Authorizer Lambda ARN
        shell: bash
        run: |
          set -e

          AUTHORizer_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$AUTH_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthorizerLambdaArn'].OutputValue" \
            --output text)

          if [ -z "$AUTHORizer_ARN" ] || [ "$AUTHORizer_ARN" = "None" ]; then
            echo "ERROR: AuthorizerLambdaArn not found."
            exit 1
          fi

          echo "AUTHORizer_ARN=$AUTHORizer_ARN" >> "$GITHUB_ENV"

          echo "Authorizer ARN found."

      # ---------------------------------------------------------
      # 17. Validate API CloudFormation template
      # ---------------------------------------------------------
      - name: Validate API CloudFormation template
        shell: bash
        run: |
          set -e

          aws cloudformation validate-template \
            --template-body file://cloudformation/api/api-stack.yaml \
            --region "$AWS_REGION"

          echo "API CloudFormation template is valid."

      # ---------------------------------------------------------
      # 18. Deploy API stack
      # ---------------------------------------------------------
      - name: Deploy API CloudFormation stack
        shell: bash
        run: |
          set -e

          echo "Deploying API stack..."

          aws cloudformation deploy \
            --template-file cloudformation/api/api-stack.yaml \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              PrivateSubnetIds="$PRIVATE_SUBNET_A,$PRIVATE_SUBNET_B" \
              LambdaSecurityGroupId="$LAMBDA_SG" \
              ProductLambdaExecutionRoleArn="$PRODUCT_ROLE" \
              OrderProcessorLambdaExecutionRoleArn="$ORDER_PROCESSOR_ROLE" \
              AuthorizerLambdaArn="$AUTHORizer_ARN" \
              ProductLambdaCodeBucket="$ARTIFACT_BUCKET" \
              ProductLambdaCodeKey="${PRODUCT_CODE_KEY}" \
              SchemaLambdaCodeKey="${SCHEMA_CODE_KEY}" \
              OrderProcessorLambdaCodeKey="${ORDER_PROCESSOR_CODE_KEY}" \
              DBHostParameter="/cloudmart/dev/db/host" \
              DBPortParameter="/cloudmart/dev/db/port" \
              DBNameParameter="/cloudmart/dev/db/name" \
              DBUsernameParameter="/cloudmart/dev/db/username" \
              DBPasswordParameter="/cloudmart/dev/db/password" \
              AuthorizerCacheTTL="300" \
              EventBusName="cloudmart-dev-event-bus" \
              LowStockEmail="${{ secrets.LOW_STOCK_EMAIL }}"

          echo "API stack deployment completed."

      # ---------------------------------------------------------
      # 19. Invoke Schema Lambda
      # ---------------------------------------------------------
      - name: Invoke Schema Lambda
        shell: bash
        run: |
          set -e

          echo "Invoking schema Lambda..."

          aws lambda invoke \
            --function-name "CloudMart-${ENVIRONMENT}-schema" \
            --invocation-type RequestResponse \
            --region "$AWS_REGION" \
            schema-response.json

          echo ""
          echo "Schema Lambda response:"
          cat schema-response.json

          echo ""

          if grep -q '"errorMessage"' schema-response.json; then
            echo ""
            echo "ERROR: Schema Lambda failed."
            echo ""
            cat schema-response.json
            exit 1
          fi

          echo "Schema Lambda completed successfully."

      # ---------------------------------------------------------
      # 20. Show API stack status
      # ---------------------------------------------------------
      - name: Show API stack status
        shell: bash
        run: |
          set -e

          aws cloudformation describe-stacks \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].{StackName:StackName,Status:StackStatus}" \
            --output table

      # ---------------------------------------------------------
      # 21. Show API stack outputs
      # ---------------------------------------------------------
      - name: Show API stack outputs
        shell: bash
        run: |
          set -e

          aws cloudformation describe-stacks \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

      # ---------------------------------------------------------
      # 22. Show CloudFormation events if deployment failed
      # ---------------------------------------------------------
      - name: Show API stack events
        if: always()
        shell: bash
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true


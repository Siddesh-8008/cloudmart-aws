AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 Authentication Stack.
  Creates the Lambda Authorizer used by API Gateway.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthorizerRoleArn:
    Type: String
    Description: ARN of the existing IAM execution role for the Lambda Authorizer

  AuthTokenParameterName:
    Type: String
    Default: /cloudmart/dev/auth/token
    Description: SSM Parameter Store SecureString containing the CloudMart bearer token

  AuthorizerSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs used by the Lambda Authorizer

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group created by the Network stack


Resources:

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub CloudMart-${Environment}-authorizer

      Description: CloudMart Bearer token Lambda Authorizer

      Runtime: python3.13

      Handler: index.handler

      Role: !Ref AuthorizerRoleArn

      Timeout: 10

      MemorySize: 128

      VpcConfig:
        SubnetIds: !Ref AuthorizerSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          AUTH_TOKEN_PARAMETER: !Ref AuthTokenParameterName

      Code:
        ZipFile: |
          import json
          import os
          import boto3

          ssm = boto3.client("ssm")

          PARAMETER_NAME = os.environ["AUTH_TOKEN_PARAMETER"]


          def response(effect, principal_id, method_arn):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": method_arn
                          }
                      ]
                  }
              }


          def handler(event, context):

              method_arn = event.get("methodArn", "*")

              authorization_token = event.get("authorizationToken")

              if not authorization_token:
                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "missing"
                  }))

                  raise Exception("Unauthorized")

              if not authorization_token.startswith("Bearer "):
                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "invalid_format"
                  }))

                  raise Exception("Unauthorized")

              supplied_token = authorization_token[7:].strip()

              if not supplied_token:
                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "empty"
                  }))

                  raise Exception("Unauthorized")

              try:
                  parameter = ssm.get_parameter(
                      Name=PARAMETER_NAME,
                      WithDecryption=True
                  )

                  expected_token = parameter["Parameter"]["Value"]

              except Exception:
                  print(json.dumps({
                      "level": "ERROR",
                      "event": "token_validation",
                      "result": "configuration_error"
                  }))

                  raise Exception("Unauthorized")

              if supplied_token != expected_token:

                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "failure"
                  }))

                  raise Exception("Unauthorized")

              print(json.dumps({
                  "level": "INFO",
                  "event": "token_validation",
                  "result": "success"
              }))

              return response(
                  "Allow",
                  "cloudmart-authenticated-client",
                  method_arn
              )


Outputs:

  AuthorizerLambdaArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerLambdaArn

  AuthorizerLambdaName:
    Description: Lambda Authorizer function name
    Value: !Ref LambdaAuthorizer
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerLambdaName

  AuthTokenParameter:
    Description: SSM SecureString parameter name used by the authorizer
    Value: !Ref AuthTokenParameterName

AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 5 monitoring, daily reporting,
  CloudWatch alarms, CloudWatch dashboard, and EC2
  operations dashboard.


# ==============================================================
# PARAMETERS
# ==============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  OperationsEmail:
    Type: String
    Description: Email address for CloudWatch alarm notifications


  DashboardArtifactBucketName:
    Type: String
    Description: S3 bucket containing the dashboard ZIP


  DashboardArtifactKey:
    Type: String
    Description: S3 key for the dashboard ZIP


  ReportLambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the daily report Lambda ZIP


  ReportLambdaCodeKey:
    Type: String
    Description: S3 key for the daily report Lambda ZIP


  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>

    Default:
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # REPORTS S3 BUCKET
  # ============================================================

  ReportsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-reports-${AWS::AccountId}

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:

        Status: Enabled

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

        - Key: Purpose
          Value: OperationsReports


  # ============================================================
  # OPERATIONS ALARM SNS
  # ============================================================

  OperationsAlarmTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-operations-alarms

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  OperationsAlarmSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OperationsAlarmTopic

      Protocol:
        email

      Endpoint:
        !Ref OperationsEmail


  # ============================================================
  # DAILY REPORT LAMBDA ROLE
  # ============================================================

  DailyReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-daily-report-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-daily-report


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-daily-report:*


        # --------------------------------------------------------
        # DATABASE SSM PARAMETERS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportReadDatabaseParameters

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # WRITE REPORT TO S3
        # --------------------------------------------------------

        - PolicyName:
            DailyReportWriteS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:PutObject

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}/*


        # --------------------------------------------------------
        # VPC ACCESS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface

                  - ec2:DescribeNetworkInterfaces

                  - ec2:DeleteNetworkInterface

                Resource: "*"


  # ============================================================
  # DAILY REPORT LAMBDA
  # ============================================================

  DailyReportLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-daily-report

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        !GetAtt DailyReportLambdaRole.Arn

      Timeout:
        60

      MemorySize:
        256

      Code:

        S3Bucket:
          !Ref ReportLambdaCodeBucket

        S3Key:
          !Ref ReportLambdaCodeKey


      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-PrivateSubnetAId

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-LambdaSecurityGroupId


      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          AWS_REGION:
            !Ref AWS::Region

          REPORT_BUCKET:
            !Ref ReportsBucket

          DB_HOST_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/host

          DB_PORT_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/port

          DB_NAME_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/name

          DB_USERNAME_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/username

          DB_PASSWORD_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/password


  # ============================================================
  # DAILY REPORT LOG GROUP
  # ============================================================

  DailyReportLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub /aws/lambda/CloudMart-${Environment}-daily-report

      RetentionInDays:
        14


  # ============================================================
  # DAILY REPORT EVENTBRIDGE SCHEDULE
  #
  # 18:00 UTC = 23:30 IST
  # ============================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-daily-report-schedule

      Description:
        Runs the CloudMart daily CSV report once per day

      ScheduleExpression:
        cron(0 18 * * ? *)

      State:
        ENABLED

      Targets:

        - Id:
            DailyReportLambdaTarget

          Arn:
            !GetAtt DailyReportLambda.Arn


  DailyReportSchedulePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref DailyReportLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


  # ============================================================
  # EC2 DASHBOARD IAM ROLE
  # ============================================================

  DashboardEC2Role:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-dashboard-ec2-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # --------------------------------------------------------
        # DATABASE PARAMETERS
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # READ REPORTS
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadReports

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt ReportsBucket.Arn


              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub
                    ${ReportsBucket.Arn}/*


        # --------------------------------------------------------
        # DOWNLOAD DASHBOARD PACKAGE
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadArtifact

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::${DashboardArtifactBucketName}/${DashboardArtifactKey}


  # ============================================================
  # EC2 INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-dashboard-instance-profile

      Roles:

        - !Ref DashboardEC2Role


  # ============================================================
  # EC2 DASHBOARD INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        t3.micro


      SubnetId:

        Fn::ImportValue:
          !Sub
            CloudMart-${Environment}-PublicSubnetId


      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub
              CloudMart-${Environment}-EC2SecurityGroupId


      IamInstanceProfile:
        !Ref DashboardInstanceProfile


      BlockDeviceMappings:

        - DeviceName:
            /dev/xvda

          Ebs:

            VolumeSize:
              10

            VolumeType:
              gp3

            Encrypted:
              true

            DeleteOnTermination:
              true


      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


      # ========================================================
      # USER DATA
      # ========================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash

            set -eux


            exec > >(tee /var/log/cloudmart-dashboard-bootstrap.log | logger -t cloudmart-dashboard) 2>&1


            # --------------------------------------------------
            # INSTALL PACKAGES
            # --------------------------------------------------

            dnf update -y

            dnf install -y \
              python3.12 \
              python3.12-pip \
              nginx \
              unzip


            # --------------------------------------------------
            # CREATE APPLICATION DIRECTORY
            # --------------------------------------------------

            mkdir -p /opt/cloudmart-dashboard


            # --------------------------------------------------
            # DOWNLOAD DASHBOARD PACKAGE
            # --------------------------------------------------

            aws s3 cp \
              "s3://${DashboardArtifactBucketName}/${DashboardArtifactKey}" \
              /tmp/cloudmart-dashboard.zip \
              --region ${AWS::Region}


            # --------------------------------------------------
            # EXTRACT APPLICATION
            # --------------------------------------------------

            rm -rf /opt/cloudmart-dashboard/app

            mkdir -p \
              /opt/cloudmart-dashboard/app


            unzip -o \
              /tmp/cloudmart-dashboard.zip \
              -d /opt/cloudmart-dashboard/app


            # --------------------------------------------------
            # PYTHON VIRTUAL ENVIRONMENT
            # --------------------------------------------------

            python3.12 -m venv \
              /opt/cloudmart-dashboard/venv


            /opt/cloudmart-dashboard/venv/bin/pip \
              install --upgrade pip


            /opt/cloudmart-dashboard/venv/bin/pip \
              install \
              Flask \
              boto3 \
              PyMySQL \
              gunicorn


            # --------------------------------------------------
            # SYSTEMD SERVICE
            # --------------------------------------------------

            cat > \
              /etc/systemd/system/cloudmart-dashboard.service \
              <<'SERVICE'

            [Unit]

            Description=CloudMart Flask Operations Dashboard

            After=network-online.target

            Wants=network-online.target


            [Service]

            Type=simple

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard/app/dashboard

            Environment=ENVIRONMENT=${Environment}

            Environment=AWS_REGION=${AWS::Region}

            Environment=DB_HOST_PARAMETER=/cloudmart/${Environment}/db/host

            Environment=DB_PORT_PARAMETER=/cloudmart/${Environment}/db/port

            Environment=DB_NAME_PARAMETER=/cloudmart/${Environment}/db/name

            Environment=DB_USERNAME_PARAMETER=/cloudmart/${Environment}/db/username

            Environment=DB_PASSWORD_PARAMETER=/cloudmart/${Environment}/db/password

            Environment=REPORT_BUCKET=${ReportsBucket}

            ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app

            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target

            SERVICE


            # --------------------------------------------------
            # NGINX
            # --------------------------------------------------

            cat > \
              /etc/nginx/conf.d/cloudmart-dashboard.conf \
              <<'NGINX'

            server {

                listen 80;

                server_name _;


                location / {

                    proxy_pass http://127.0.0.1:8000;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }

            NGINX


            rm -f \
              /etc/nginx/conf.d/default.conf


            # --------------------------------------------------
            # START SERVICES
            # --------------------------------------------------

            systemctl daemon-reload

            systemctl enable --now cloudmart-dashboard

            systemctl enable --now nginx


  # ============================================================
  # CLOUDWATCH OPERATIONS DASHBOARD
  # ============================================================

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName:
        !Sub cloudmart-operations-${Environment}


      DashboardBody:

        !Sub |

          {
            "start": "-PT6H",
            "periodOverride": "inherit",

            "widgets": [

              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 2,

                "properties": {
                  "markdown":
                    "# CloudMart Operations Center\nEnvironment: **${Environment}**\n\nOrder flow, inventory health, Lambda errors, database health, and dashboard host health."
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 2,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "CloudMart/Operations",
                      "OrdersPlaced",
                      "Environment",
                      "${Environment}",
                      {
                        "label": "Orders Placed"
                      }
                    ],

                    [
                      ".",
                      "OrdersFailed",
                      ".",
                      ".",
                      {
                        "label": "Orders Failed"
                      }
                    ]

                  ],

                  "view": "timeSeries",

                  "stacked": false,

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Sum",

                  "title":
                    "Order Flow"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 2,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "CloudMart/Operations",
                      "LowStockEvents",
                      "Environment",
                      "${Environment}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Sum",

                  "title":
                    "Low Stock Events"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 8,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-order-processor"
                    ],

                    [
                      ".",
                      "Errors",
                      ".",
                      "CloudMart-${Environment}-product"
                    ],

                    [
                      ".",
                      "Errors",
                      ".",
                      "CloudMart-${Environment}-authorizer"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Sum",

                  "title":
                    "Lambda Errors"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 8,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/RDS",
                      "CPUUtilization",
                      "DBInstanceIdentifier",
                      "CloudMart-${Environment}-mysql"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Average",

                  "title":
                    "RDS CPU"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 14,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/RDS",
                      "DatabaseConnections",
                      "DBInstanceIdentifier",
                      "CloudMart-${Environment}-mysql"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Average",

                  "title":
                    "RDS Connections"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 14,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/EC2",
                      "CPUUtilization",
                      "InstanceId",
                      "${DashboardEC2}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Average",

                  "title":
                    "Dashboard EC2 CPU"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 20,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "CloudMart-${Environment}-product-api",
                      "Stage",
                      "${Environment}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Sum",

                  "title":
                    "API Requests"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 20,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/ApiGateway",
                      "5XXError",
                      "ApiName",
                      "CloudMart-${Environment}-product-api",
                      "Stage",
                      "${Environment}"
                    ],

                    [
                      ".",
                      "4XXError",
                      ".",
                      ".",
                      ".",
                      "."
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 300,

                  "stat": "Sum",

                  "title":
                    "API Errors"
                }
              },


              {
                "type": "alarm",

                "x": 0,
                "y": 26,
                "width": 24,
                "height": 4,

                "properties": {

                  "title":
                    "CloudMart Alarm Status",

                  "alarms": [

                    "${OrdersFailedAlarm.Arn}",

                    "${LowStockEventsAlarm.Arn}",

                    "${OrderProcessorErrorsAlarm.Arn}",

                    "${RDSHighCPUAlarm.Arn}"

                  ]
                }
              }

            ]
          }


  # ============================================================
  # ALARM 1 - ORDERS FAILED
  # ============================================================

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-OrdersFailed

      AlarmDescription:
        Fires when an order failure is recorded.

      Namespace:
        CloudMart/Operations

      MetricName:
        OrdersFailed

      Dimensions:

        - Name:
            Environment

          Value:
            !Ref Environment

      Statistic:
        Sum

      Period:
        300

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 2 - LOW STOCK
  # ============================================================

  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-LowStockEvents

      AlarmDescription:
        Fires when a low-stock event is recorded.

      Namespace:
        CloudMart/Operations

      MetricName:
        LowStockEvents

      Dimensions:

        - Name:
            Environment

          Value:
            !Ref Environment

      Statistic:
        Sum

      Period:
        300

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 3 - ORDER PROCESSOR ERRORS
  # ============================================================

  OrderProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-OrderProcessorErrors

      AlarmDescription:
        Fires when the order processor Lambda reports an execution error.

      Namespace:
        AWS/Lambda

      MetricName:
        Errors

      Dimensions:

        - Name:
            FunctionName

          Value:
            !Sub CloudMart-${Environment}-order-processor

      Statistic:
        Sum

      Period:
        300

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 4 - RDS CPU
  # ============================================================

  RDSHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-RDSHighCPU

      AlarmDescription:
        Fires when RDS CPU is above 80 percent.

      Namespace:
        AWS/RDS

      MetricName:
        CPUUtilization

      Dimensions:

        - Name:
            DBInstanceIdentifier

          Value:
            !Sub CloudMart-${Environment}-mysql

      Statistic:
        Average

      Period:
        300

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        80

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  ReportsBucketName:

    Description:
      S3 bucket containing CloudMart daily CSV reports

    Value:
      !Ref ReportsBucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportsBucketName


  ReportsBucketArn:

    Description:
      ARN of the CloudMart reports bucket

    Value:
      !GetAtt ReportsBucket.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportsBucketArn


  DailyReportLambdaArn:

    Description:
      Daily report Lambda ARN

    Value:
      !GetAtt DailyReportLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-DailyReportLambdaArn


  OperationsAlarmTopicArn:

    Description:
      SNS topic used by CloudWatch alarms

    Value:
      !Ref OperationsAlarmTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OperationsAlarmTopicArn


  OperationsDashboardName:

    Description:
      CloudWatch operations dashboard name

    Value:
      !Ref OperationsDashboard

    Export:
      Name:
        !Sub CloudMart-${Environment}-OperationsDashboardName


  DashboardInstanceId:

    Description:
      EC2 instance hosting the CloudMart dashboard

    Value:
      !Ref DashboardEC2

    Export:
      Name:
        !Sub CloudMart-${Environment}-DashboardInstanceId


  DashboardUrl:

    Description:
      CloudMart operations dashboard URL

    Value:
      !Sub
        http://${DashboardEC2.PublicDnsName}



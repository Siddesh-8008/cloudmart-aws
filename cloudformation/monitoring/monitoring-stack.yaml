AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 5 monitoring, daily reporting,
  CloudWatch alarms, CloudWatch dashboard, and EC2
  operations dashboard.


# ==============================================================
# PARAMETERS
# ==============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  OperationsEmail:
    Type: String
    Description: Email address for CloudWatch alarm notifications


  DashboardArtifactBucketName:
    Type: String
    Description: S3 bucket containing the dashboard ZIP


  DashboardArtifactKey:
    Type: String
    Description: S3 key for the dashboard ZIP


  ReportLambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the daily report Lambda ZIP


  ReportLambdaCodeKey:
    Type: String
    Description: S3 key for the daily report Lambda ZIP


  ReportsBucketName:
    Type: String
    Default: cloudmart-dev-reports-550684041874
    Description: Existing S3 bucket containing CloudMart daily reports


  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>

    Default:
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # OPERATIONS ALARM SNS
  # ============================================================

  OperationsAlarmTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-operations-alarms

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  OperationsAlarmSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OperationsAlarmTopic

      Protocol:
        email

      Endpoint:
        !Ref OperationsEmail


  # ============================================================
  # DAILY REPORT LAMBDA ROLE
  # ============================================================

  DailyReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-daily-report-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-daily-report


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-daily-report:*


        # --------------------------------------------------------
        # DATABASE SSM PARAMETERS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportReadDatabaseParameters

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # WRITE REPORT TO S3
        # --------------------------------------------------------

        - PolicyName:
            DailyReportWriteS3

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:PutObject

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}/*


        # --------------------------------------------------------
        # VPC ACCESS
        # --------------------------------------------------------

        - PolicyName:
            DailyReportVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface

                  - ec2:DescribeNetworkInterfaces

                  - ec2:DeleteNetworkInterface

                Resource: "*"


  # ============================================================
  # DAILY REPORT LAMBDA
  # ============================================================

  DailyReportLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-daily-report

      Runtime:
        python3.12

      Handler:
        index.lambda_handler

      Role:
        !GetAtt DailyReportLambdaRole.Arn

      Timeout:
        60

      MemorySize:
        256

      Code:

        S3Bucket:
          !Ref ReportLambdaCodeBucket

        S3Key:
          !Ref ReportLambdaCodeKey


      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-PrivateSubnetAId

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub
                CloudMart-${Environment}-LambdaSecurityGroupId


      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          REPORT_BUCKET:
            !Ref ReportsBucketName

          DB_HOST_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/host

          DB_PORT_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/port

          DB_NAME_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/name

          DB_USERNAME_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/username

          DB_PASSWORD_PARAMETER:
            !Sub
              /cloudmart/${Environment}/db/password


  # ============================================================
  # DAILY REPORT EVENTBRIDGE SCHEDULE
  #
  # 18:00 UTC = 23:30 IST
  # ============================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-daily-report-schedule

      Description:
        Runs the CloudMart daily CSV report once per day

      ScheduleExpression:
        cron(0 18 * * ? *)

      State:
        ENABLED

      Targets:

        - Id:
            DailyReportLambdaTarget

          Arn:
            !GetAtt DailyReportLambda.Arn


  DailyReportSchedulePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref DailyReportLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


  # ============================================================
  # EC2 DASHBOARD IAM ROLE
  # ============================================================

  DashboardEC2Role:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-dashboard-ec2-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


      Policies:


        # --------------------------------------------------------
        # DATABASE PARAMETERS
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/admin-token


        # --------------------------------------------------------
        # READ REPORTS
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadReports

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::${ReportsBucketName}


              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::${ReportsBucketName}/*


        # --------------------------------------------------------
        # DOWNLOAD DASHBOARD PACKAGE
        # --------------------------------------------------------

        - PolicyName:
            DashboardReadArtifact

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:s3:::${DashboardArtifactBucketName}/*


  # ============================================================
  # EC2 INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-dashboard-instance-profile

      Roles:

        - !Ref DashboardEC2Role


  # ============================================================
  # EC2 DASHBOARD INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        t3.micro


      SubnetId:

        Fn::ImportValue:
          !Sub
            CloudMart-${Environment}-PublicSubnetId


      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub
              CloudMart-${Environment}-EC2SecurityGroupId


      IamInstanceProfile:
        !Ref DashboardInstanceProfile


      BlockDeviceMappings:

        - DeviceName:
            /dev/xvda

          Ebs:

            VolumeSize:
              10

            VolumeType:
              gp3

            Encrypted:
              true

            DeleteOnTermination:
              true


      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


  # ============================================================
  # CLOUDWATCH OPERATIONS DASHBOARD
  # ============================================================

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName:
        !Sub cloudmart-operations-${Environment}


      DashboardBody:

        !Sub |

          {
            "start": "-PT6H",
            "periodOverride": "inherit",

            "widgets": [

              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 2,

                "properties": {
                  "markdown":
                    "# CloudMart Operations Center\nEnvironment: **${Environment}**\n\nOrder flow, inventory health, Lambda errors, database health, and dashboard host health."
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 2,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "CloudMart/Operations",
                      "OrdersPlaced",
                      "Environment",
                      "${Environment}",
                      {
                        "label": "Orders Placed"
                      }
                    ],

                    [
                      "CloudMart/Operations",
                      "OrdersFailed",
                      "Environment",
                      "${Environment}",
                      {
                        "label": "Orders Failed"
                      }
                    ],

                    [
                      "CloudMart/Operations",
                      "OrdersCancelled",
                      "Environment",
                      "${Environment}",
                      {
                        "label": "Orders Cancelled"
                      }
                    ]

                  ],

                  "view": "timeSeries",

                  "stacked": false,

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Sum",

                  "title":
                    "Order Flow"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 2,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "CloudMart/Operations",
                      "LowStockEvents",
                      "Environment",
                      "${Environment}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Sum",

                  "title":
                    "Low Stock Events"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 8,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-order-processor"
                    ],

                    [
                      ".",
                      "Errors",
                      ".",
                      "CloudMart-${Environment}-product"
                    ],

                    [
                      ".",
                      "Errors",
                      ".",
                      "CloudMart-${Environment}-authorizer"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Sum",

                  "title":
                    "Lambda Errors"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 8,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/RDS",
                      "CPUUtilization",
                      "DBInstanceIdentifier",
                      "cloudmart-${Environment}-mysql"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Average",

                  "title":
                    "RDS CPU"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 14,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/RDS",
                      "DatabaseConnections",
                      "DBInstanceIdentifier",
                      "cloudmart-${Environment}-mysql"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Average",

                  "title":
                    "RDS Connections"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 14,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/EC2",
                      "CPUUtilization",
                      "InstanceId",
                      "${DashboardEC2}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Average",

                  "title":
                    "Dashboard EC2 CPU"
                }
              },


              {
                "type": "metric",
                "x": 0,
                "y": 20,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "CloudMart-${Environment}-product-api",
                      "Stage",
                      "${Environment}"
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Sum",

                  "title":
                    "API Requests"
                }
              },


              {
                "type": "metric",
                "x": 12,
                "y": 20,
                "width": 12,
                "height": 6,

                "properties": {

                  "metrics": [

                    [
                      "AWS/ApiGateway",
                      "5XXError",
                      "ApiName",
                      "CloudMart-${Environment}-product-api",
                      "Stage",
                      "${Environment}"
                    ],

                    [
                      ".",
                      "4XXError",
                      ".",
                      ".",
                      ".",
                      "."
                    ]

                  ],

                  "view": "timeSeries",

                  "region":
                    "${AWS::Region}",

                  "period": 60,

                  "stat": "Sum",

                  "title":
                    "API Errors"
                }
              },


              {
                "type": "alarm",

                "x": 0,
                "y": 26,
                "width": 24,
                "height": 4,

                "properties": {

                  "title":
                    "CloudMart Alarm Status",

                  "alarms": [

                    "${OrdersFailedAlarm.Arn}",

                    "${LowStockEventsAlarm.Arn}",

                    "${OrdersCancelledAlarm.Arn}",


                    "${AuthorizerLambdaErrorsAlarm.Arn}",

                    "${ProductLambdaErrorsAlarm.Arn}",

                    "${OrderProcessorLambdaErrorsAlarm.Arn}",

                    "${SchemaLambdaErrorsAlarm.Arn}",

                    "${DailyReportLambdaErrorsAlarm.Arn}",

                    "${ApiGateway4XXErrorsAlarm.Arn}",

                    "${ApiGateway5XXErrorsAlarm.Arn}",

                    "${RDSHighCPUAlarm.Arn}"

                  ]
                }
              }

            ]
          }


  # ============================================================
  # LAMBDA ERROR ALARMS
  # ============================================================

  AuthorizerLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-AuthorizerLambdaErrors
      AlarmDescription:
        Fires when the Lambda authorizer reports an execution error.
      Namespace:
        AWS/Lambda
      MetricName:
        Errors
      Dimensions:
        - Name:
            FunctionName
          Value:
            !Sub CloudMart-${Environment}-Authorizer
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  ProductLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-ProductLambdaErrors
      AlarmDescription:
        Fires when the Product Service Lambda reports an execution error.
      Namespace:
        AWS/Lambda
      MetricName:
        Errors
      Dimensions:
        - Name:
            FunctionName
          Value:
            !Sub CloudMart-${Environment}-ProductService
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  OrderProcessorLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-OrderProcessorLambdaErrors
      AlarmDescription:
        Fires when the Order Processor Lambda reports an execution error.
      Namespace:
        AWS/Lambda
      MetricName:
        Errors
      Dimensions:
        - Name:
            FunctionName
          Value:
            !Sub CloudMart-${Environment}-order-processor
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  SchemaLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-SchemaLambdaErrors
      AlarmDescription:
        Fires when the Schema Lambda reports an execution error.
      Namespace:
        AWS/Lambda
      MetricName:
        Errors
      Dimensions:
        - Name:
            FunctionName
          Value:
            !Sub CloudMart-${Environment}-schema
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  DailyReportLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-DailyReportLambdaErrors
      AlarmDescription:
        Fires when the Daily Report Lambda reports an execution error.
      Namespace:
        AWS/Lambda
      MetricName:
        Errors
      Dimensions:
        - Name:
            FunctionName
          Value:
            !Sub CloudMart-${Environment}-daily-report
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  # ============================================================
  # API GATEWAY ERROR ALARMS
  # ============================================================

  ApiGateway4XXErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-ApiGateway4XXErrors
      AlarmDescription:
        Fires when the CloudMart API records one or more 4XX responses.
      Namespace:
        AWS/ApiGateway
      MetricName:
        4XXError
      Dimensions:
        - Name:
            ApiName
          Value:
            !Sub CloudMart-${Environment}-API
        - Name:
            Stage
          Value:
            !Ref Environment
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  ApiGateway5XXErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        !Sub CloudMart-${Environment}-ApiGateway5XXErrors
      AlarmDescription:
        Fires when the CloudMart API records one or more 5XX responses.
      Namespace:
        AWS/ApiGateway
      MetricName:
        5XXError
      Dimensions:
        - Name:
            ApiName
          Value:
            !Sub CloudMart-${Environment}-API
        - Name:
            Stage
          Value:
            !Ref Environment
      Statistic:
        Sum
      Period:
        60
      EvaluationPeriods:
        1
      DatapointsToAlarm:
        1
      Threshold:
        1
      ComparisonOperator:
        GreaterThanOrEqualToThreshold
      TreatMissingData:
        notBreaching
      AlarmActions:
        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 1 - ORDERS FAILED
  # ============================================================

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-OrdersFailed

      AlarmDescription:
        Fires when an order failure is recorded.

      Namespace:
        CloudMart/Operations

      MetricName:
        OrdersFailed

      Dimensions:

        - Name:
            Environment

          Value:
            !Ref Environment

      Statistic:
        Sum

      Period:
        60

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 2 - LOW STOCK
  # ============================================================

  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-LowStockEvents

      AlarmDescription:
        Fires when a low-stock event is recorded.

      Namespace:
        CloudMart/Operations

      MetricName:
        LowStockEvents

      Dimensions:

        - Name:
            Environment

          Value:
            !Ref Environment

      Statistic:
        Sum

      Period:
        60

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


  # ============================================================
  # ALARM 3 - ORDERS CANCELLED
  # ============================================================

  OrdersCancelledAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-OrdersCancelled

      AlarmDescription:
        Fires when an order cancellation is recorded.

      Namespace:
        CloudMart/Operations

      MetricName:
        OrdersCancelled

      Dimensions:

        - Name:
            Environment

          Value:
            !Ref Environment

      Statistic:
        Sum

      Period:
        60

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        1

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic




  # ============================================================
  # ALARM 5 - RDS CPU
  # ============================================================

  RDSHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-RDSHighCPU

      AlarmDescription:
        Fires when RDS CPU is above 80 percent.

      Namespace:
        AWS/RDS

      MetricName:
        CPUUtilization

      Dimensions:

        - Name:
            DBInstanceIdentifier

          Value:
            !Sub cloudmart-${Environment}-mysql

      Statistic:
        Average

      Period:
        60

      EvaluationPeriods:
        1

      DatapointsToAlarm:
        1

      Threshold:
        80

      ComparisonOperator:
        GreaterThanOrEqualToThreshold

      TreatMissingData:
        notBreaching

      AlarmActions:

        - !Ref OperationsAlarmTopic


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  ReportsBucketName:

    Description:
      S3 bucket containing CloudMart daily CSV reports

    Value:
      !Ref ReportsBucketName

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportsBucketName


  ReportsBucketArn:

    Description:
      ARN of the CloudMart reports bucket

    Value:
      !Sub arn:${AWS::Partition}:s3:::${ReportsBucketName}

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportsBucketArn


  DailyReportLambdaArn:

    Description:
      Daily report Lambda ARN

    Value:
      !GetAtt DailyReportLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-DailyReportLambdaArn


  OperationsAlarmTopicArn:

    Description:
      SNS topic used by CloudWatch alarms

    Value:
      !Ref OperationsAlarmTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OperationsAlarmTopicArn


  OperationsDashboardName:

    Description:
      CloudWatch operations dashboard name

    Value:
      !Ref OperationsDashboard

    Export:
      Name:
        !Sub CloudMart-${Environment}-OperationsDashboardName


  DashboardInstanceId:

    Description:
      EC2 instance hosting the CloudMart dashboard

    Value:
      !Ref DashboardEC2

    Export:
      Name:
        !Sub CloudMart-${Environment}-DashboardInstanceId


  DashboardUrl:

    Description:
      CloudMart operations dashboard URL

    Value:
      !Sub
        http://${DashboardEC2.PublicDnsName}

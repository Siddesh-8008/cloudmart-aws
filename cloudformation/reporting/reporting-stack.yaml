AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 5 daily reporting stack.
  Generates a daily CSV report from RDS and stores it in S3.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  ReportingLambdaExecutionRoleArn:
    Type: String

  ReportBucketName:
    Type: String

  DBHostParameter:
    Type: String

  DBPortParameter:
    Type: String

  DBNameParameter:
    Type: String

  DBUsernameParameter:
    Type: String

  DBPasswordParameter:
    Type: String

  ReportingLambdaCodeKey:
    Type: String
    Default: reporting/reporting.zip

  ScheduleExpression:
    Type: String
    Default: 'cron(30 18 * * ? *)'
    Description: Daily report schedule in UTC. Default is 23:30 IST.

Resources:

  DailyReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-daily-report
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !Ref ReportingLambdaExecutionRoleArn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref ReportBucketName
        S3Key: !Ref ReportingLambdaCodeKey
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          REPORT_BUCKET: !Ref ReportBucketName
          REPORT_PREFIX: reports/
          DB_HOST_PARAMETER: !Ref DBHostParameter
          DB_PORT_PARAMETER: !Ref DBPortParameter
          DB_NAME_PARAMETER: !Ref DBNameParameter
          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter
          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

  DailyReportSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-${Environment}-daily-report-schedule
      Description: Runs the CloudMart daily reporting Lambda once per day.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: DailyReportLambdaTarget
          Arn: !GetAtt DailyReportLambda.Arn

  DailyReportLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DailyReportLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyReportSchedule.Arn

Outputs:

  DailyReportLambdaArn:
    Description: Daily report Lambda ARN
    Value: !GetAtt DailyReportLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DailyReportLambdaArn

  DailyReportScheduleArn:
    Description: Daily report EventBridge rule ARN
    Value: !GetAtt DailyReportSchedule.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DailyReportScheduleArn

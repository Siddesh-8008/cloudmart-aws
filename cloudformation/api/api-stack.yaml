AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates API Gateway REST API, Product Lambda,
  Lambda Authorizer integration and Product CRUD endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  ProductLambdaRoleArn:
    Type: String
    Description: ARN of the existing IAM execution role for Product Lambda

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ProductCodeKey:
    Type: String
    Description: S3 key for the Product Lambda deployment package

  LambdaSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs used by Product Lambda

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group created by the Network stack

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password


Resources:

  # ------------------------------------------------------------
  # API Gateway
  # ------------------------------------------------------------

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub CloudMart-${Environment}-api

      Description: CloudMart Product Service API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ------------------------------------------------------------
  # Lambda Authorizer
  # ------------------------------------------------------------

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:
      Name: !Sub CloudMart-${Environment}-authorizer

      RestApiId: !Ref CloudMartApi

      Type: TOKEN

      IdentitySource: method.request.header.Authorization

      AuthorizerResultTtlInSeconds: 300

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: !Sub CloudMart-${Environment}-AuthorizerLambdaArn


  # ------------------------------------------------------------
  # Product Lambda
  # ------------------------------------------------------------

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub CloudMart-${Environment}-product

      Description: CloudMart Product Service Lambda

      Runtime: python3.13

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaRoleArn

      Timeout: 30

      MemorySize: 256

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter
          DB_PORT_PARAMETER: !Ref DBPortParameter
          DB_NAME_PARAMETER: !Ref DBNameParameter
          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter
          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProductCodeKey


  # ------------------------------------------------------------
  # API Gateway -> Authorizer Lambda permission
  # ------------------------------------------------------------

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction

      FunctionName:
        Fn::ImportValue: !Sub CloudMart-${Environment}-AuthorizerLambdaArn

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/authorizers/*


  # ------------------------------------------------------------
  # API Gateway -> Product Lambda permission
  # ------------------------------------------------------------

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !GetAtt ProductLambda.Arn

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  # ------------------------------------------------------------
  # /products
  # ------------------------------------------------------------

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi

      ParentId: !GetAtt CloudMartApi.RootResourceId

      PathPart: products


  # ------------------------------------------------------------
  # /products/{product_id}
  # ------------------------------------------------------------

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi

      ParentId: !Ref ProductsResource

      PathPart: '{product_id}'


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductArn}/invocations
            - ProductArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductArn}/invocations
            - ProductArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{product_id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.product_id: true

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductArn}/invocations
            - ProductArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{product_id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.product_id: true

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductArn}/invocations
            - ProductArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{product_id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.product_id: true

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductArn}/invocations
            - ProductArn: !GetAtt ProductLambda.Arn


  # ------------------------------------------------------------
  # API Deployment
  # ------------------------------------------------------------

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetProductsMethod
      - CreateProductMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:
      RestApiId: !Ref CloudMartApi

      Description: !Sub CloudMart ${Environment} Product API deployment


  # ------------------------------------------------------------
  # API Stage
  # ------------------------------------------------------------

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:
      RestApiId: !Ref CloudMartApi

      DeploymentId: !Ref ApiDeployment

      StageName: !Ref Environment

      Description: !Sub CloudMart ${Environment} API stage


Outputs:

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub CloudMart-${Environment}-ApiId


  ApiUrl:
    Description: CloudMart API URL
    Value:
      !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub CloudMart-${Environment}-ApiUrl


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn


  AuthorizerId:
    Description: API Gateway Lambda Authorizer ID
    Value: !Ref CloudMartAuthorizer
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerId
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates Product Lambda, Schema Lambda, API Gateway,
  API Gateway Authorizer, and connects Lambdas to RDS.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id


  ProductLambdaExecutionRoleArn:
    Type: String


  AuthorizerLambdaArn:
    Type: String


  LambdaCodeBucket:
    Type: String


  ProductLambdaCodeKey:
    Type: String


  SchemaLambdaCodeKey:
    Type: String


  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password


  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub "CloudMart-${Environment}-product"

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProductLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter

          DB_NAME_PARAMETER: !Ref DBNameParameter

          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

          DB_PORT_PARAMETER: !Ref DBPortParameter


  # ==========================================================
  # SCHEMA LAMBDA
  # ==========================================================

  SchemaLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub "CloudMart-${Environment}-schema"

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 60

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref SchemaLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter

          DB_NAME_PARAMETER: !Ref DBNameParameter

          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

          DB_PORT_PARAMETER: !Ref DBPortParameter


  # ==========================================================
  # API GATEWAY
  # ==========================================================

  Api:

    Type: AWS::ApiGateway::RestApi

    Properties:

      Name: !Sub "CloudMart-${Environment}-api"


  # ==========================================================
  # /products
  # ==========================================================

  ProductsResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref Api

      ParentId: !GetAtt Api.RootResourceId

      PathPart: products


  # ==========================================================
  # /products/{id}
  # ==========================================================

  ProductIdResource:

    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId: !Ref Api

      ParentId: !Ref ProductsResource

      PathPart: "{id}"


  # ==========================================================
  # API AUTHORIZER
  # ==========================================================

  ApiAuthorizer:

    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name: !Sub "CloudMart-${Environment}-authorizer"

      RestApiId: !Ref Api

      Type: REQUEST

      IdentitySource:
        - method.request.header.Authorization

      AuthorizerUri: !Sub
        - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations"
        - AuthorizerArn: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds: 0

    DependsOn:
      - AuthorizerLambdaPermission


  # ==========================================================
  # PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaPermission:

    Type: AWS::Lambda::Permission

    Properties:

      Action: lambda:InvokeFunction

      FunctionName: !GetAtt ProductLambda.Arn

      Principal: apigateway.amazonaws.com

      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*"

    DependsOn:
      - ProductLambda


  # ==========================================================
  # AUTHORIZE LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaPermission:

    Type: AWS::Lambda::Permission

    Properties:

      Action: lambda:InvokeFunction

      FunctionName: !Ref AuthorizerLambdaArn

      Principal: apigateway.amazonaws.com

      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref Api

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations"
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

    DependsOn:
      - ProductLambdaPermission
      - AuthorizerLambdaPermission


  # ==========================================================
  # POST /products
  # ==========================================================

  PostProductsMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref Api

      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations"
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

    DependsOn:
      - ProductLambdaPermission
      - AuthorizerLambdaPermission


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref Api

      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations"
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

    DependsOn:
      - ProductLambdaPermission
      - AuthorizerLambdaPermission


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  PutProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref Api

      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations"
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

    DependsOn:
      - ProductLambdaPermission
      - AuthorizerLambdaPermission


  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:

    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId: !Ref Api

      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations"
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

    DependsOn:
      - ProductLambdaPermission
      - AuthorizerLambdaPermission


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeployment:

    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId: !Ref Api

      StageName: !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  ApiUrl:

    Description: CloudMart API URL

    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"


  ProductLambdaArn:

    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn


  ProductLambdaName:

    Description: Product Lambda name

    Value: !Ref ProductLambda


  SchemaLambdaArn:

    Description: Schema Lambda ARN

    Value: !GetAtt SchemaLambda.Arn


  SchemaLambdaName:

    Description: Schema Lambda name

    Value: !Ref SchemaLambda


  ApiId:

    Description: API Gateway ID

    Value: !Ref Api


  AuthorizerId:

    Description: API Gateway Authorizer ID

    Value: !Ref ApiAuthorizer
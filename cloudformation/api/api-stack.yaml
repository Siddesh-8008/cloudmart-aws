AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates Product Lambda, Schema Lambda, API Gateway,
  API Gateway Authorizer, and RDS schema initializer.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  ProductLambdaExecutionRoleArn:
    Type: String

  AuthorizerLambdaArn:
    Type: String

  LambdaCodeBucket:
    Type: String

  ProductLambdaCodeKey:
    Type: String

  SchemaLambdaCodeKey:
    Type: String

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password

  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port


Resources:

  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub 'CloudMart-${Environment}-product'

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProductLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter

          DB_NAME_PARAMETER: !Ref DBNameParameter

          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

          DB_PORT_PARAMETER: !Ref DBPortParameter


  # ============================================================
  # SCHEMA LAMBDA
  # ============================================================

  SchemaLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub 'CloudMart-${Environment}-schema'

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 60

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref SchemaLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter

          DB_NAME_PARAMETER: !Ref DBNameParameter

          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

          DB_PORT_PARAMETER: !Ref DBPortParameter


  # ============================================================
  # API GATEWAY
  # ============================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub 'CloudMart-${Environment}-api'


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !GetAtt ProductApi.RootResourceId
      PathPart: products


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !Ref ProductsResource
      PathPart: '{id}'


  # ============================================================
  # API AUTHORIZER
  # ============================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:
      Name: !Sub 'CloudMart-${Environment}-authorizer'

      RestApiId: !Ref ProductApi

      Type: REQUEST

      IdentitySource:
        - method.request.header.Authorization

      AuthorizerUri:
        Fn::Sub:
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations'
          - AuthorizerArn: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds: 0


  # ============================================================
  # PRODUCT LAMBDA PERMISSION
  # ============================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !Ref ProductLambda

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*'
          - ApiId: !Ref ProductApi


  # ============================================================
  # AUTHORIZER LAMBDA PERMISSION
  # ============================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !Ref AuthorizerLambdaArn

      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/authorizers/*'
          - ApiId: !Ref ProductApi


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations'
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations'
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations'
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations'
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations'
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetProductsMethod
      - CreateProductMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:
      RestApiId: !Ref ProductApi


  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:
      RestApiId: !Ref ProductApi

      DeploymentId: !Ref ApiDeployment

      StageName: !Ref Environment


Outputs:

  # ============================================================
  # API URL
  # ============================================================

  ApiUrl:
    Description: CloudMart API URL

    Value:
      Fn::Sub:
        - 'https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
        - ApiId: !Ref ProductApi


  # ============================================================
  # PRODUCT LAMBDA ARN
  # ============================================================

  ProductLambdaArn:
    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn


  # ============================================================
  # SCHEMA LAMBDA ARN
  # ============================================================

  SchemaLambdaArn:
    Description: Schema Lambda ARN

    Value: !GetAtt SchemaLambda.Arn


  # ============================================================
  # API ID
  # ============================================================

  ApiId:
    Description: API Gateway REST API ID

    Value: !Ref ProductApi


  # ============================================================
  # SCHEMA LAMBDA NAME
  # ============================================================

  SchemaLambdaName:
    Description: Schema Lambda name

    Value: !Ref SchemaLambda
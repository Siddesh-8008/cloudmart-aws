AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates API Gateway, Lambda Authorizer and Product Lambda.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Product Lambda


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda


  ProductLambdaExecutionRoleArn:
    Type: String
    Description: IAM role ARN for Product Lambda


  AuthorizerLambdaArn:
    Type: String
    Description: Lambda ARN used by API Gateway Authorizer


  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda packages


  ProductLambdaCodeKey:
    Type: String
    Description: S3 key containing Product Lambda package


  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password


  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # REST API
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub CloudMart-${Environment}-api

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ==========================================================
  # API GATEWAY AUTHORIZER
  # ==========================================================

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-authorizer

      RestApiId:
        !Ref CloudMartApi

      Type: TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AUTHORIZER_ARN}/invocations
          - AUTHORIZER_ARN: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds: 0


  # ==========================================================
  # PRODUCTS RESOURCE
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !GetAtt CloudMartApi.RootResourceId

      PathPart: products


  # ==========================================================
  # PRODUCT ID RESOURCE
  # ==========================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: '{id}'


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-product

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout: 30

      MemorySize: 256

      Code:

        S3Bucket:
          !Ref LambdaCodeBucket

        S3Key:
          !Ref ProductLambdaCodeKey

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          # IMPORTANT:
          # These are parameter PATHS, not secrets.

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter


  # ==========================================================
  # LAMBDA PERMISSION FOR API GATEWAY
  # ==========================================================

  ProductLambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref ProductLambda

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${API_ID}/*
          - API_ID: !Ref CloudMartApi


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # POST /products
  # ==========================================================

  PostProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  PutProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi

      StageName:
        !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  ApiId:
    Description: API Gateway REST API ID

    Value:
      !Ref CloudMartApi


  ApiUrl:
    Description: CloudMart API URL

    Value:
      !Sub
        - https://${API_ID}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
        - API_ID: !Ref CloudMartApi


  ProductLambdaArn:
    Description: Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn
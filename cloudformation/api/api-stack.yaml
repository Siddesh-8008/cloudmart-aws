AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates Product Lambda, API Gateway REST API,
  Lambda authorizer integration, VPC configuration,
  database configuration and API deployment.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for Product Lambda

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: IAM execution role ARN for Product Lambda

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda authorizer

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ProductLambdaCodeKey:
    Type: String
    Description: S3 key for Product Lambda ZIP

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password

  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port

  LowStockEmail:
    Type: String
    Default: ""

Conditions:

  HasLowStockEmail:
    Fn::Not:
      - Fn::Equals:
          - !Ref LowStockEmail
          - ""

Resources:

  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-product

      Description:
        Product CRUD Lambda for CloudMart

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout: 30

      MemorySize: 256

      VpcConfig:
        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

      Code:

        S3Bucket:
          !Ref LambdaCodeBucket

        S3Key:
          !Ref ProductLambdaCodeKey


  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub CloudMart-${Environment}-api

      Description:
        CloudMart Product API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ==========================================================
  # /products
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !GetAtt CloudMartApi.RootResourceId

      PathPart: products


  # ==========================================================
  # /products/{id}
  # ==========================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: "{id}"


  # ==========================================================
  # AUTHORIZER
  # ==========================================================

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-authorizer

      RestApiId:
        !Ref CloudMartApi

      Type: TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerResultTtlInSeconds: 300

      AuthorizerUri:
        !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AUTHORIZER_ARN}/invocations
          - AUTHORIZER_ARN: !Ref AuthorizerLambdaArn


  # ==========================================================
  # PRODUCT LAMBDA GET ALL
  # ==========================================================

  ProductsGetMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PRODUCT_ARN}/invocations
            - PRODUCT_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # PRODUCT CREATE
  # ==========================================================

  ProductsPostMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PRODUCT_ARN}/invocations
            - PRODUCT_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # PRODUCT BY ID GET
  # ==========================================================

  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PRODUCT_ARN}/invocations
            - PRODUCT_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # PRODUCT BY ID PUT
  # ==========================================================

  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PRODUCT_ARN}/invocations
            - PRODUCT_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # PRODUCT BY ID DELETE
  # ==========================================================

  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref ApiAuthorizer

      RequestParameters:

        method.request.path.id: true

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PRODUCT_ARN}/invocations
            - PRODUCT_ARN: !GetAtt ProductLambda.Arn


  # ==========================================================
  # LAMBDA PERMISSION - API GATEWAY
  # ==========================================================

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref ProductLambda

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${API_ID}/*/*
          - API_ID: !Ref CloudMartApi


  # ==========================================================
  # AUTHORIZE LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambdaArn

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${API_ID}/authorizers/*
          - API_ID: !Ref CloudMartApi


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - ProductsGetMethod
      - ProductsPostMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi

      Description:
        !Sub CloudMart ${Environment} API deployment


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


Outputs:

  ApiUrl:
    Description: CloudMart API URL

    Value:
      !Sub
        - https://${API_ID}.execute-api.${AWS::Region}.amazonaws.com/${ENV}
        - API_ID: !Ref CloudMartApi
          ENV: !Ref Environment


  ApiId:
    Description: API Gateway REST API ID

    Value:
      !Ref CloudMartApi


  ProductLambdaArn:
    Description: Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn
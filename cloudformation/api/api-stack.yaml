yaml
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates API Gateway, Product Lambda, Lambda Authorizer integration,
  and Product CRUD endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  # ------------------------------------------------------------
  # Networking
  # ------------------------------------------------------------

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs where Product Lambda will run

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda

  # ------------------------------------------------------------
  # Existing IAM role
  # ------------------------------------------------------------

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: ARN of the IAM execution role for Product Lambda
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$'

  # ------------------------------------------------------------
  # Existing Auth Stack
  # ------------------------------------------------------------

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda Authorizer created by auth-stack
    AllowedPattern: '^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:function:.+$'

  # ------------------------------------------------------------
  # Product Lambda deployment package
  # ------------------------------------------------------------

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ProductLambdaCodeKey:
    Type: String
    Description: S3 key for Product Lambda zip package

  # ------------------------------------------------------------
  # Database configuration
  # ------------------------------------------------------------

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password

  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port

  # ------------------------------------------------------------
  # Authorizer cache
  # ------------------------------------------------------------

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600

Resources:

  # ============================================================
  # API Gateway
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub cloudmart-${Environment}-api
      Description: CloudMart Product API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ============================================================
  # Lambda Authorizer
  # ============================================================

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn:
      - CloudMartApi
      - AuthorizerLambdaPermission

    Properties:
      Name: !Sub cloudmart-${Environment}-authorizer
      RestApiId: !Ref CloudMartApi
      Type: REQUEST

      IdentitySource: method.request.header.Authorization

      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AUTHORIZER_ARN}/invocations
          - AUTHORIZER_ARN: !Ref AuthorizerLambdaArn

  # ============================================================
  # Permission for API Gateway to invoke Authorizer Lambda
  # ============================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerLambdaArn
      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${API_ID}/*
          - API_ID: !Ref CloudMartApi

  # ============================================================
  # Product Lambda
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product

      Runtime: python3.12
      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 30
      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProductLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST:
            Fn::Sub: "{{resolve:ssm:${DBHostParameter}}}"

          DB_NAME:
            Fn::Sub: "{{resolve:ssm:${DBNameParameter}}}"

          DB_USERNAME:
            Fn::Sub: "{{resolve:ssm-secure:${DBUsernameParameter}}}"

          DB_PASSWORD:
            Fn::Sub: "{{resolve:ssm-secure:${DBPasswordParameter}}}"

          DB_PORT:
            Fn::Sub: "{{resolve:ssm:${DBPortParameter}}}"

  # ============================================================
  # API Gateway Resources
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: '{id}'

  # ============================================================
  # Product Lambda API Gateway Permission
  # ============================================================

  ProductLambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        Fn::Sub:
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${API_ID}/*
          - API_ID: !Ref CloudMartApi

  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    DependsOn:
      - ApiAuthorizer
      - ProductLambdaApiGatewayPermission

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn

  # ============================================================
  # POST /products
  # ============================================================

  PostProductsMethod:
    Type: AWS::ApiGateway::Method

    DependsOn:
      - ApiAuthorizer
      - ProductLambdaApiGatewayPermission

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn

  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    DependsOn:
      - ApiAuthorizer
      - ProductLambdaApiGatewayPermission

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn

  # ============================================================
  # PUT /products/{id}
  # ============================================================

  PutProductMethod:
    Type: AWS::ApiGateway::Method

    DependsOn:
      - ApiAuthorizer
      - ProductLambdaApiGatewayPermission

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn

  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    DependsOn:
      - ApiAuthorizer
      - ProductLambdaApiGatewayPermission

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations
            - LAMBDA_ARN: !GetAtt ProductLambda.Arn

  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod

    Properties:
      RestApiId: !Ref CloudMartApi
      Description: !Sub CloudMart ${Environment} Product API deployment

  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment

  # ============================================================
  # LOW STOCK SNS TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

  # ============================================================
  # OUTPUTS
  # ============================================================

Outputs:

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub cloudmart-${Environment}-api-id

  ApiUrl:
    Description: CloudMart Product API URL
    Value:
      Fn::Sub:
        - https://${API_ID}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
        - API_ID: !Ref CloudMartApi

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

  AuthorizerId:
    Description: API Gateway Authorizer ID
    Value: !Ref ApiAuthorizer

  AuthorizerCacheTTL:
    Description: Authorizer cache TTL
    Value: !Ref AuthorizerCacheTTL

  LowStockTopicArn:
    Description: Low stock SNS topic ARN
    Value: !Ref LowStockTopic


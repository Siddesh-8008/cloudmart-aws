AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates API Gateway, Product Lambda, Lambda Authorizer,
  SNS low-stock alert topic and API resources.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Product Lambda

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: ARN of the Product Lambda execution role

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda Authorizer

  ProductLambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Product Lambda package

  ProductLambdaCodeKey:
    Type: String
    Default: product/product.zip
    Description: S3 key of Product Lambda package

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: SSM parameter containing database host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM SecureString parameter containing database username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM SecureString parameter containing database password

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    Description: API Gateway authorizer cache TTL in seconds

  LowStockEmail:
    Type: String
    Description: Email address for low-stock notifications


Resources:

  # ============================================================
  # SNS TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

      Tags:
        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # SNS EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockTopic
      Protocol: email
      Endpoint: !Ref LowStockEmail


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub CloudMart-${Environment}-product

      Description: CloudMart Product Lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref ProductLambdaCodeBucket
        S3Key: !Ref ProductLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          # ----------------------------------------------------
          # IMPORTANT:
          # These are ONLY parameter names.
          # No SecureString values are placed here.
          # ----------------------------------------------------

          DB_HOST_PARAMETER:
            Ref: DBHostParameter

          DB_NAME_PARAMETER:
            Ref: DBNameParameter

          DB_USERNAME_PARAMETER:
            Ref: DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            Ref: DBPasswordParameter

          LOW_STOCK_TOPIC_ARN:
            Ref: LowStockTopic

          ENVIRONMENT:
            Ref: Environment


  # ============================================================
  # API GATEWAY
  # ============================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub CloudMart-${Environment}-product-api

      Description: CloudMart Product API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # API GATEWAY AUTHORIZER
  # ============================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:
      Name: !Sub CloudMart-${Environment}-authorizer

      RestApiId: !Ref ProductApi

      Type: TOKEN

      IdentitySource: method.request.header.Authorization

      AuthorizerUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !GetAtt ProductApi.RootResourceId
      PathPart: products


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref ProductApi

      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri: !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ============================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref ProductLambda

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn: !Sub
        arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/*/*


  # ============================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ============================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref AuthorizerLambdaArn

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com

      SourceArn: !Sub
        arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/authorizers/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetProductsMethod
      - CreateProductMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:
      RestApiId: !Ref ProductApi

      Description: !Sub CloudMart ${Environment} API deployment


  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:
      RestApiId: !Ref ProductApi

      DeploymentId: !Ref ApiDeployment

      StageName: !Ref Environment


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn


  ProductLambdaName:
    Description: Product Lambda name
    Value: !Ref ProductLambda

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaName


  ProductApiId:
    Description: API Gateway REST API ID
    Value: !Ref ProductApi

    Export:
      Name: !Sub CloudMart-${Environment}-ProductApiId


  ProductApiUrl:
    Description: CloudMart Product API URL
    Value: !Sub
      https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/products


  LowStockTopicArn:
    Description: Low-stock SNS topic ARN
    Value: !Ref LowStockTopic

    Export:
      Name: !Sub CloudMart-${Environment}-LowStockTopicArn
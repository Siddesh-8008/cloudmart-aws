AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 4 API Stack.
  Creates Product Lambda, Schema Lambda, Order Lambda,
  Order Processor Lambda, API Gateway, Lambda Authorizer
  integration and low-stock SNS alerts.

Parameters:

  # ============================================================
  # ENVIRONMENT
  # ============================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  # ============================================================
  # NETWORK
  # ============================================================

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda functions


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Lambda functions


  # ============================================================
  # IAM
  # ============================================================

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: >
      IAM role ARN used by Product Lambda and Schema Lambda


  OrderLambdaExecutionRoleArn:
    Type: String
    Description: >
      IAM role ARN used by Order Lambda


  OrderProcessorLambdaExecutionRoleArn:
    Type: String
    Description: >
      IAM role ARN used by Order Processor Lambda


  # ============================================================
  # AUTHORIZER
  # ============================================================

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda Authorizer


  # ============================================================
  # LAMBDA ARTIFACTS
  # ============================================================

  ProductLambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda packages


  ProductLambdaCodeKey:
    Type: String
    Default: product/product.zip
    Description: S3 key of Product Lambda package


  SchemaLambdaCodeKey:
    Type: String
    Default: schema/schema.zip
    Description: S3 key of Schema Lambda package


  OrderLambdaCodeKey:
    Type: String
    Default: order/order.zip
    Description: S3 key of Order Lambda package


  OrderProcessorLambdaCodeKey:
    Type: String
    Default: order-processor/order-processor.zip
    Description: S3 key of Order Processor Lambda package


  # ============================================================
  # DATABASE PARAMETERS
  # ============================================================

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: >
      SSM parameter containing database host


  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: >
      SSM parameter containing database port


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: >
      SSM parameter containing database name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: >
      SSM SecureString parameter containing database username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: >
      SSM SecureString parameter containing database password


  # ============================================================
  # API SETTINGS
  # ============================================================

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    Description: API Gateway authorizer cache TTL in seconds


  # ============================================================
  # EVENTBRIDGE
  # ============================================================

  EventBusName:
    Type: String
    Default: cloudmart-dev-event-bus
    Description: CloudMart EventBridge event bus name


  # ============================================================
  # SNS
  # ============================================================

  LowStockEmail:
    Type: String
    Description: Email address for low-stock notifications


# ==============================================================
# RESOURCES
# ==============================================================

Resources:

  # ============================================================
  # SNS LOW STOCK TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

      Tags:
        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # SNS EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref LowStockTopic

      Protocol: email

      Endpoint: !Ref LowStockEmail


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-product

      Description:
        CloudMart Product Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout:
        30

      MemorySize:
        256

      Code:
        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref ProductLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          LOW_STOCK_TOPIC_ARN:
            !Ref LowStockTopic

          ENVIRONMENT:
            !Ref Environment

          EVENT_BUS_NAME:
            !Ref EventBusName


  # ============================================================
  # SCHEMA LAMBDA
  # ============================================================

  SchemaLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-schema

      Description:
        CloudMart Database Schema Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout:
        120

      MemorySize:
        256

      Code:
        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref SchemaLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # DATABASE PARAMETERS
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          ENVIRONMENT:
            !Ref Environment


  # ============================================================
  # ORDER LAMBDA
  # ============================================================

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-order

      Description:
        CloudMart Order API Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !Ref OrderLambdaExecutionRoleArn

      Timeout:
        30

      MemorySize:
        256

      Code:
        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref OrderLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          EVENT_BUS_NAME:
            !Ref EventBusName

          ENVIRONMENT:
            !Ref Environment

          ORDER_PROCESSOR_FUNCTION:
            !Sub CloudMart-${Environment}-order-processor


  # ============================================================
  # ORDER PROCESSOR LAMBDA
  # ============================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-order-processor

      Description:
        CloudMart asynchronous Order Processor Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !Ref OrderProcessorLambdaExecutionRoleArn

      Timeout:
        60

      MemorySize:
        256

      Code:
        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref OrderProcessorLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          EVENT_BUS_NAME:
            !Ref EventBusName

          ENVIRONMENT:
            !Ref Environment


  # ============================================================
  # ALLOW ORDER LAMBDA TO INVOKE ORDER PROCESSOR
  # ============================================================

  OrderProcessorInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderProcessorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        !GetAtt OrderLambda.Arn


  # ============================================================
  # API GATEWAY REST API
  # ============================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub CloudMart-${Environment}-product-api

      Description:
        CloudMart Product and Order API

      EndpointConfiguration:

        Types:
          - REGIONAL


  # ============================================================
  # API GATEWAY AUTHORIZER
  # ============================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-authorizer

      RestApiId:
        !Ref ProductApi

      Type:
        TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds:
        !Ref AuthorizerCacheTTL


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !GetAtt ProductApi.RootResourceId

      PathPart:
        products


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !Ref ProductsResource

      PathPart:
        "{id}"


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # /orders
  # ============================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !GetAtt ProductApi.RootResourceId

      PathPart:
        orders


  # ============================================================
  # /orders/{id}
  # ============================================================

  OrderIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !Ref OrdersResource

      PathPart:
        "{id}"


  # ============================================================
  # POST /orders
  # ============================================================

  CreateOrderMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref OrdersResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt OrderLambda.Arn


  # ============================================================
  # GET /orders
  # ============================================================

  GetOrdersMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref OrdersResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt OrderLambda.Arn


  # ============================================================
  # GET /orders/{id}
  # ============================================================

  GetOrderMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref OrderIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt OrderLambda.Arn


  # ============================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ============================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/*/*


  # ============================================================
  # API GATEWAY -> ORDER LAMBDA PERMISSION
  # ============================================================

  OrderLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref OrderLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/*/*


  # ============================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ============================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/authorizers/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      # Product methods
      - GetProductsMethod
      - CreateProductMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

      # Order methods
      - CreateOrderMethod
      - GetOrdersMethod
      - GetOrderMethod

    Properties:

      RestApiId:
        !Ref ProductApi

      Description:
        !Sub CloudMart ${Environment} API deployment


  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref ProductApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  # ============================================================
  # PRODUCT LAMBDA OUTPUTS
  # ============================================================

  ProductLambdaArn:
    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaArn


  ProductLambdaName:
    Description:
      Product Lambda name

    Value:
      !Ref ProductLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaName


  # ============================================================
  # SCHEMA LAMBDA OUTPUTS
  # ============================================================

  SchemaLambdaArn:
    Description:
      Schema Lambda ARN

    Value:
      !GetAtt SchemaLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-SchemaLambdaArn


  SchemaLambdaName:
    Description:
      Schema Lambda name

    Value:
      !Ref SchemaLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-SchemaLambdaName


  # ============================================================
  # ORDER LAMBDA OUTPUTS
  # ============================================================

  OrderLambdaArn:
    Description:
      Order Lambda ARN

    Value:
      !GetAtt OrderLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderLambdaArn


  OrderLambdaName:
    Description:
      Order Lambda name

    Value:
      !Ref OrderLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderLambdaName


  # ============================================================
  # ORDER PROCESSOR OUTPUTS
  # ============================================================

  OrderProcessorLambdaArn:
    Description:
      Order Processor Lambda ARN

    Value:
      !GetAtt OrderProcessorLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderProcessorLambdaArn


  OrderProcessorLambdaName:
    Description:
      Order Processor Lambda name

    Value:
      !Ref OrderProcessorLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderProcessorLambdaName


  # ============================================================
  # API OUTPUTS
  # ============================================================

  ProductApiId:
    Description:
      API Gateway REST API ID

    Value:
      !Ref ProductApi

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductApiId


  ProductApiUrl:
    Description:
      CloudMart Product API URL

    Value:
      !Sub
        https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/products


  OrderApiUrl:
    Description:
      CloudMart Order API URL

    Value:
      !Sub
        https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/orders


  # ============================================================
  # SNS OUTPUT
  # ============================================================

  LowStockTopicArn:
    Description:
      Low-stock SNS topic ARN

    Value:
      !Ref LowStockTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-LowStockTopicArn


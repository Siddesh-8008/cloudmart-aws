AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates Product Lambda, Schema Lambda, API Gateway,
  Lambda Authorizer integration, SNS low-stock alerts
  and Product API resources.

Parameters:

  # ============================================================
  # ENVIRONMENT
  # ============================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  # ============================================================
  # NETWORK
  # ============================================================

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Product and Schema Lambdas


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product and Schema Lambdas


  # ============================================================
  # IAM
  # ============================================================

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: >
      IAM role ARN used by Product Lambda and Schema Lambda


  # ============================================================
  # AUTHORIZER
  # ============================================================

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda Authorizer


  # ============================================================
  # LAMBDA ARTIFACTS
  # ============================================================

  ProductLambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda packages


  ProductLambdaCodeKey:
    Type: String
    Default: product/product.zip
    Description: S3 key of Product Lambda package


  SchemaLambdaCodeKey:
    Type: String
    Default: schema/schema.zip
    Description: S3 key of Schema Lambda package


  # ============================================================
  # DATABASE PARAMETERS
  # ============================================================

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: >
      SSM parameter containing database host


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: >
      SSM parameter containing database name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: >
      SSM SecureString parameter containing database username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: >
      SSM SecureString parameter containing database password


  # ============================================================
  # API SETTINGS
  # ============================================================

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    Description: API Gateway authorizer cache TTL in seconds


  # ============================================================
  # SNS
  # ============================================================

  LowStockEmail:
    Type: String
    Description: Email address for low-stock notifications


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # SNS LOW STOCK TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-low-stock-alerts

      Tags:
        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # SNS EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref LowStockTopic

      Protocol: email

      Endpoint: !Ref LowStockEmail


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-product

      Description:
        CloudMart Product Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      # --------------------------------------------------------
      # IMPORTANT
      # Product Lambda uses Product Lambda IAM role
      # --------------------------------------------------------

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout:
        30

      MemorySize:
        256

      Code:

        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref ProductLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      #
      # IMPORTANT:
      # These contain parameter NAMES only.
      #
      # The actual username/password must be retrieved
      # by Lambda from SSM Parameter Store.
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          LOW_STOCK_TOPIC_ARN:
            !Ref LowStockTopic

          ENVIRONMENT:
            !Ref Environment


  # ============================================================
  # SCHEMA LAMBDA
  # ============================================================

  SchemaLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-schema

      Description:
        CloudMart Database Schema Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      # --------------------------------------------------------
      # SAME ROLE AS PRODUCT LAMBDA
      # --------------------------------------------------------

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout:
        120

      MemorySize:
        256

      Code:

        S3Bucket:
          !Ref ProductLambdaCodeBucket

        S3Key:
          !Ref SchemaLambdaCodeKey

      # --------------------------------------------------------
      # VPC CONFIGURATION
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # DATABASE PARAMETERS
      # --------------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          ENVIRONMENT:
            !Ref Environment


  # ============================================================
  # API GATEWAY REST API
  # ============================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub CloudMart-${Environment}-product-api

      Description:
        CloudMart Product API

      EndpointConfiguration:

        Types:
          - REGIONAL


  # ============================================================
  # API GATEWAY AUTHORIZE
  # ============================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-authorizer

      RestApiId:
        !Ref ProductApi

      Type:
        TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn: !Ref AuthorizerLambdaArn

      AuthorizerResultTtlInSeconds:
        !Ref AuthorizerCacheTTL


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !GetAtt ProductApi.RootResourceId

      PathPart:
        products


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !Ref ProductsResource

      PathPart:
        "{id}"


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # API GATEWAY -> PRODUCT LAMBDA PERMISSION
  # ============================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/*/*


  # ============================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ============================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambdaArn

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/authorizers/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - GetProductsMethod
      - CreateProductMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId:
        !Ref ProductApi

      Description:
        !Sub CloudMart ${Environment} API deployment


  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref ProductApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  # ============================================================
  # PRODUCT LAMBDA OUTPUTS
  # ============================================================

  ProductLambdaArn:
    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaArn


  ProductLambdaName:
    Description:
      Product Lambda name

    Value:
      !Ref ProductLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaName


  # ============================================================
  # SCHEMA LAMBDA OUTPUTS
  # ============================================================

  SchemaLambdaArn:
    Description:
      Schema Lambda ARN

    Value:
      !GetAtt SchemaLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-SchemaLambdaArn


  SchemaLambdaName:
    Description:
      Schema Lambda name

    Value:
      !Ref SchemaLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-SchemaLambdaName


  # ============================================================
  # API OUTPUTS
  # ============================================================

  ProductApiId:
    Description:
      API Gateway REST API ID

    Value:
      !Ref ProductApi

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductApiId


  ProductApiUrl:
    Description:
      CloudMart Product API URL

    Value:
      !Sub
        https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/products


  # ============================================================
  # SNS OUTPUT
  # ============================================================

  LowStockTopicArn:
    Description:
      Low-stock SNS topic ARN

    Value:
      !Ref LowStockTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-LowStockTopicArn
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates API Gateway, Lambda Authorizer integration,
  Product Lambda, SNS low-stock alerts and Product CRUD API endpoints.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Product Lambda


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda


  ProductLambdaExecutionRoleArn:
    Type: String
    Description: IAM execution role ARN for Product Lambda


  AuthorizerLambdaArn:
    Type: String
    Description: ARN of Lambda Authorizer


  ProductLambdaCodeKey:
    Type: String
    Default: product/product.zip
    Description: S3 key containing Product Lambda ZIP file


  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: SSM parameter containing RDS hostname


  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing RDS port


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing database name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing database username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password
    NoEcho: true
    Description: SSM SecureString containing database password


  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    Description: Lambda Authorizer cache TTL in seconds


  LowStockEmail:
    Type: String
    Description: Email address for low-stock SNS alerts
    AllowedPattern: '^[A-Za-z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
    ConstraintDescription: Must be a valid email address.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # SNS TOPIC
  # ==========================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-low-stock-alerts

      DisplayName:
        !Sub CloudMart ${Environment} Low Stock Alerts

      Tags:

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SNS EMAIL SUBSCRIPTION
  # ==========================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref LowStockTopic

      Protocol: email

      Endpoint:
        !Ref LowStockEmail


  # ==========================================================
  # API GATEWAY REST API
  # ==========================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi

    Properties:

      Name:
        !Sub CloudMart-${Environment}-ProductApi

      Description:
        !Sub CloudMart ${Environment} Product API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-Authorizer

      RestApiId:
        !Ref ProductApi

      Type:
        TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerResultTtlInSeconds:
        !Ref AuthorizerCacheTTL

      AuthorizerUri:
        !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambdaArn}/invocations


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-product

      Description:
        CloudMart Product CRUD Lambda

      Runtime:
        python3.12

      Handler:
        lambda_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout:
        30

      MemorySize:
        256

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub CloudMart-${Environment}-LambdaArtifactBucketName

        S3Key:
          !Ref ProductLambdaCodeKey

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:

          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          LOW_STOCK_TOPIC_ARN:
            !Ref LowStockTopic


  # ==========================================================
  # PRODUCT LAMBDA PERMISSION
  # ==========================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref ProductLambda

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/*


  # ==========================================================
  # AUTHORIZER LAMBDA PERMISSION
  # ==========================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambdaArn

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ProductApi}/authorizers/${ProductApiAuthorizer}


  # ==========================================================
  # /products
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !GetAtt ProductApi.RootResourceId

      PathPart:
        products


  # ==========================================================
  # /products/{id}
  # ==========================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:

      RestApiId:
        !Ref ProductApi

      ParentId:
        !Ref ProductsResource

      PathPart:
        "{id}"


  # ==========================================================
  # POST /products
  # ==========================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        POST

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations


  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations


  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        GET

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      RequestParameters:

        method.request.path.id:
          true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations


  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        PUT

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      RequestParameters:

        method.request.path.id:
          true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations


  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref ProductApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod:
        DELETE

      AuthorizationType:
        CUSTOM

      AuthorizerId:
        !Ref ProductApiAuthorizer

      RequestParameters:

        method.request.path.id:
          true

      Integration:

        Type:
          AWS_PROXY

        IntegrationHttpMethod:
          POST

        Uri:
          !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambda.Arn}/invocations


  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - CreateProductMethod
      - GetProductsMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId:
        !Ref ProductApi

      Description:
        !Sub CloudMart ${Environment} API deployment


  # ==========================================================
  # API STAGE
  # ==========================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref ProductApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  ApiId:
    Description:
      API Gateway REST API ID

    Value:
      !Ref ProductApi

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiId


  ApiUrl:
    Description:
      CloudMart Product API URL

    Value:
      !Sub https://${ProductApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}


  ProductLambdaArn:
    Description:
      Product Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaArn


  ProductLambdaName:
    Description:
      Product Lambda name

    Value:
      !Ref ProductLambda


  LowStockTopicArn:
    Description:
      SNS topic for low stock alerts

    Value:
      !Ref LowStockTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-LowStockTopicArn


  AuthorizerCacheTTL:
    Description:
      Lambda Authorizer cache TTL

    Value:
      !Ref AuthorizerCacheTTL
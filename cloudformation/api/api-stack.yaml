AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 API Stack.
  Creates API Gateway, Product Lambda, Lambda Authorizer integration,
  and Product CRUD endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  # ------------------------------------------------------------
  # Networking
  # ------------------------------------------------------------

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs where Product Lambda will run

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Product Lambda

  # ------------------------------------------------------------
  # Existing IAM role
  # ------------------------------------------------------------

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: ARN of the IAM execution role for Product Lambda

  # ------------------------------------------------------------
  # Existing Auth Stack
  # ------------------------------------------------------------

  AuthorizerLambdaArn:
    Type: String
    Description: ARN of the Lambda Authorizer created by auth-stack

  # ------------------------------------------------------------
  # Product Lambda deployment package
  # ------------------------------------------------------------

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  ProductLambdaCodeKey:
    Type: String
    Description: S3 key for Product Lambda zip package

  # ------------------------------------------------------------
  # Database configuration
  # ------------------------------------------------------------

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password

  # ------------------------------------------------------------
  # Authorizer cache
  # ------------------------------------------------------------

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    Description: Authorizer cache TTL in seconds


Resources:

  # ============================================================
  # API Gateway
  # ============================================================

  ProductApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub cloudmart-${Environment}-api
      Description: CloudMart Product API
      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # Lambda Authorizer
  # ============================================================

  ProductApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub cloudmart-${Environment}-authorizer
      RestApiId: !Ref ProductApi

      Type: REQUEST

      IdentitySource: method.request.header.Authorization

      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

      AuthorizerUri:
        Fn::Sub:
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambdaArn}/invocations
          - AuthorizerLambdaArn: !Ref AuthorizerLambdaArn


  # ============================================================
  # Permission for API Gateway to invoke Authorizer Lambda
  # ============================================================

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
        - ApiId: !Ref ProductApi


  # ============================================================
  # Product Lambda
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product
      Runtime: python3.12
      Handler: lambda_function.lambda_handler

      Role: !Ref ProductLambdaExecutionRoleArn

      Timeout: 30
      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProductLambdaCodeKey

      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::Sub: "{{resolve:ssm:${DBHostParameter}}}"

          DB_NAME:
            Fn::Sub: "{{resolve:ssm:${DBNameParameter}}}"

          DB_USERNAME:
            Fn::Sub: "{{resolve:ssm-secure:${DBUsernameParameter}}}"

          DB_PASSWORD:
            Fn::Sub: "{{resolve:ssm-secure:${DBPasswordParameter}}}"


  # ============================================================
  # API Gateway Resources
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !GetAtt ProductApi.RootResourceId
      PathPart: products


  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ProductApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  # ============================================================
  # Lambda Permission
  # ============================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
        - ApiId: !Ref ProductApi


  # ============================================================
  # POST /products
  # ============================================================

  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi
      ResourceId: !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products
  # ============================================================

  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi
      ResourceId: !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ProductApi
      ResourceId: !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ProductApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # API Gateway Deployment
  # ============================================================

  ProductApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ProductsPostMethod
      - ProductsGetMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod
    Properties:
      RestApiId: !Ref ProductApi
      Description: !Sub CloudMart ${Environment} Product API deployment


  # ============================================================
  # API Gateway Stage
  # ============================================================

  ProductApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ProductApi
      DeploymentId: !Ref ProductApiDeployment
      StageName: !Ref Environment


Outputs:

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref ProductApi
    Export:
      Name: !Sub cloudmart-${Environment}-api-id


  ApiUrl:
    Description: CloudMart Product API URL
    Value:
      Fn::Sub:
        - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
        - ApiId: !Ref ProductApi


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn


  AuthorizerId:
    Description: API Gateway Authorizer ID
    Value: !Ref ProductApiAuthorizer


  AuthorizerCacheTTL:
    Description: Authorizer cache TTL
    Value: !Ref AuthorizerCacheTTL
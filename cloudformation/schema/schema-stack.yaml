AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart database schema initialization stack.
  Runs schema.sql through a Lambda function inside the VPC
  and creates the required MySQL tables in RDS.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  # ------------------------------------------------------------
  # Networking
  # ------------------------------------------------------------

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs where Schema Lambda will run

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Schema Lambda

  # ------------------------------------------------------------
  # Existing IAM role
  # ------------------------------------------------------------

  ProductLambdaExecutionRoleArn:
    Type: String
    Description: Existing IAM role with SSM and CloudWatch permissions

  # ------------------------------------------------------------
  # Lambda package
  # ------------------------------------------------------------

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  SchemaLambdaCodeKey:
    Type: String
    Description: S3 key for Schema Lambda zip package

  # ------------------------------------------------------------
  # Database SSM parameters
  # ------------------------------------------------------------

  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host

  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name

  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username

  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password

  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port


Resources:

  # ============================================================
  # Schema Lambda
  # ============================================================

  SchemaLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-schema-initializer

      Runtime: python3.12

      Handler: schema_function.lambda_handler

      Role:
        !Ref ProductLambdaExecutionRoleArn

      Timeout: 60

      MemorySize: 256

      Code:
        S3Bucket:
          !Ref LambdaCodeBucket

        S3Key:
          !Ref SchemaLambdaCodeKey

      VpcConfig:

        SubnetIds:
          !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter


  # ============================================================
  # CloudFormation Custom Resource
  # ============================================================

  DatabaseSchema:

    Type: Custom::CloudMartDatabaseSchema

    Properties:

      ServiceToken:
        !GetAtt SchemaLambda.Arn

      Environment:
        !Ref Environment

      SchemaVersion:
        "1"


Outputs:

  SchemaLambdaArn:

    Description: Schema initialization Lambda ARN

    Value:
      !GetAtt SchemaLambda.Arn

  SchemaStatus:

    Description: Database schema initialization status

    Value:
      "Schema initialization completed"
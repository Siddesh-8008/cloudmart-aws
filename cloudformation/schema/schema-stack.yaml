AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart database schema initialization Lambda.
  Connects privately to RDS MySQL and creates the products table.


Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>


  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id


  LambdaExecutionRoleArn:
    Type: String


  LambdaCodeBucket:
    Type: String


  LambdaCodeKey:
    Type: String


  DBHostParameter:
    Type: String
    Default: /cloudmart/dev/db/host


  DBNameParameter:
    Type: String
    Default: /cloudmart/dev/db/name


  DBUsernameParameter:
    Type: String
    Default: /cloudmart/dev/db/username


  DBPasswordParameter:
    Type: String
    Default: /cloudmart/dev/db/password


  DBPortParameter:
    Type: String
    Default: /cloudmart/dev/db/port


Resources:

  SchemaLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub CloudMart-${Environment}-schema

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !Ref LambdaExecutionRoleArn

      Timeout: 60

      MemorySize: 256

      Code:

        S3Bucket: !Ref LambdaCodeBucket

        S3Key: !Ref LambdaCodeKey

      VpcConfig:

        SubnetIds: !Ref PrivateSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:

        Variables:

          ENVIRONMENT: !Ref Environment

          DB_HOST_PARAMETER: !Ref DBHostParameter

          DB_NAME_PARAMETER: !Ref DBNameParameter

          DB_USERNAME_PARAMETER: !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER: !Ref DBPasswordParameter

          DB_PORT_PARAMETER: !Ref DBPortParameter


Outputs:

  SchemaLambdaArn:

    Description: Schema Lambda ARN

    Value: !GetAtt SchemaLambda.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-SchemaLambdaArn


  SchemaLambdaName:

    Description: Schema Lambda name

    Value: !Ref SchemaLambda
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Stack.
  Creates RDS MySQL and S3 Lambda artifact storage.

Parameters:

  # ============================================================
  # ENVIRONMENT
  # ============================================================

  Environment:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Deployment environment name used in resource and parameter names


  # ============================================================
  # DATABASE NAME
  # ============================================================

  DBName:
    Type: String
    Default: cloudmart
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'


  # ============================================================
  # DATABASE USERNAME
  # ============================================================

  DBUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'


  # ============================================================
  # DATABASE PASSWORD SSM PARAMETER
  #
  # The actual password is stored manually in SSM Parameter Store.
  # This stack only receives the parameter name.
  # ============================================================

  DBPasswordParameterName:
    Type: AWS::SSM::Parameter::Name
    Description: Existing SSM String parameter containing the RDS master password.


  # ============================================================
  # RDS INSTANCE CLASS
  # ============================================================

  DBInstanceClass:
    Type: String
    Default: db.t3.micro


  # ============================================================
  # RDS STORAGE
  # ============================================================

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # RDS SUBNET GROUP
  #
  # Uses BOTH private subnets created by Network Stack.
  # ============================================================

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        !Sub CloudMart ${Environment} RDS private subnet group

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetAId

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetBId

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-rds-subnet-group


  # ============================================================
  # RDS MYSQL
  # ============================================================

  RDSInstance:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      # --------------------------------------------------------
      # INSTANCE IDENTIFIER
      # --------------------------------------------------------

      DBInstanceIdentifier:
        !Sub CloudMart-${Environment}-mysql


      # --------------------------------------------------------
      # ENGINE
      # --------------------------------------------------------

      Engine: mysql


      # --------------------------------------------------------
      # DATABASE NAME
      # --------------------------------------------------------

      DBName:
        !Ref DBName


      # --------------------------------------------------------
      # MASTER USERNAME
      # --------------------------------------------------------

      MasterUsername:
        !Ref DBUsername


      # --------------------------------------------------------
      # MASTER PASSWORD
      #
      # Password comes from SSM Parameter Store.
      #
      # IMPORTANT:
      # ManageMasterUserPassword is NOT enabled.
      # Therefore RDS does not generate/manage a
      # Secrets Manager password.
      # --------------------------------------------------------

      MasterUserPassword:
        !Sub '{{resolve:ssm:${DBPasswordParameterName}}}'


      # --------------------------------------------------------
      # RDS INSTANCE CLASS
      # --------------------------------------------------------

      DBInstanceClass:
        !Ref DBInstanceClass


      # --------------------------------------------------------
      # STORAGE
      # --------------------------------------------------------

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true


      # --------------------------------------------------------
      # NETWORK
      # --------------------------------------------------------

      PubliclyAccessible: false

      MultiAZ: false


      # --------------------------------------------------------
      # BACKUP
      # --------------------------------------------------------

      BackupRetentionPeriod: 0

      AutoMinorVersionUpgrade: true

      CopyTagsToSnapshot: true


      # --------------------------------------------------------
      # SUBNET GROUP
      # --------------------------------------------------------

      DBSubnetGroupName:
        !Ref DBSubnetGroup


      # --------------------------------------------------------
      # SECURITY GROUP
      # --------------------------------------------------------

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-mysql

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # LAMBDA ARTIFACT S3 BUCKET
  #
  # Used by GitHub Actions to store Lambda ZIP files.
  #
  # Example:
  #
  # s3://cloudmart-${Environment}-lambda-artifacts-ACCOUNT_ID/
  #     product/product.zip
  #
  # ============================================================

  LambdaArtifactBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-lambda-artifacts-${AWS::AccountId}


      # --------------------------------------------------------
      # BLOCK PUBLIC ACCESS
      # --------------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


      # --------------------------------------------------------
      # VERSIONING
      # --------------------------------------------------------

      VersioningConfiguration:
        Status: Enabled


      # --------------------------------------------------------
      # SERVER-SIDE ENCRYPTION
      # --------------------------------------------------------

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-lambda-artifacts

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # SSM DATABASE PARAMETERS
  #
  # These four values are automatically obtained from RDS.
  #
  # Password is intentionally NOT created here.
  # The password parameter is created/maintained separately.
  # ============================================================


  # ============================================================
  # DATABASE HOST
  # ============================================================

  DBHostParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/host

      Type: String

      Value:
        !GetAtt RDSInstance.Endpoint.Address

      Description: CloudMart RDS MySQL endpoint


  # ============================================================
  # DATABASE PORT
  # ============================================================

  DBPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/port

      Type: String

      Value:
        !GetAtt RDSInstance.Endpoint.Port

      Description: CloudMart RDS MySQL port


  # ============================================================
  # DATABASE NAME
  # ============================================================

  DBNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/name

      Type: String

      Value:
        !Ref DBName

      Description: CloudMart database name


  # ============================================================
  # DATABASE USERNAME
  # ============================================================

  DBUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/username

      Type: String

      Value:
        !Ref DBUsername

      Description: CloudMart RDS MySQL master username


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  # ============================================================
  # RDS OUTPUTS
  # ============================================================

  DBInstanceIdentifier:
    Description: RDS instance identifier
    Value:
      !Ref RDSInstance


  DBEndpoint:
    Description: RDS MySQL endpoint
    Value:
      !GetAtt RDSInstance.Endpoint.Address

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDS-Endpoint


  DBPort:
    Description: RDS MySQL port
    Value:
      !GetAtt RDSInstance.Endpoint.Port

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDS-Port


  DBName:
    Description: RDS database name
    Value:
      !Ref DBName

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDS-DBName


  DBSubnetGroupName:
    Description: RDS DB subnet group
    Value:
      !Ref DBSubnetGroup


  # ============================================================
  # LAMBDA ARTIFACT BUCKET OUTPUTS
  # ============================================================

  LambdaArtifactBucketName:
    Description: S3 bucket used to store Lambda deployment ZIP files
    Value:
      !Ref LambdaArtifactBucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-LambdaArtifactBucketName


  LambdaArtifactBucketArn:
    Description: ARN of the Lambda artifact S3 bucket
    Value:
      !GetAtt LambdaArtifactBucket.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-LambdaArtifactBucketArn
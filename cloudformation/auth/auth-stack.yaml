AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 3 Authentication Stack.
  Creates the Lambda Authorizer used by API Gateway.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the Lambda Authorizer

  # ============================================================
  # ADMIN TOKEN
  # ============================================================

  AdminAuthTokenParameterName:
    Type: String
    Default: /cloudmart/dev/auth/admin-token
    Description: SSM SecureString containing the CloudMart admin authentication token

  # ============================================================
  # CUSTOMER TOKEN
  # ============================================================

  CustomerAuthTokenParameterName:
    Type: String
    Default: /cloudmart/dev/auth/customer-token
    Description: SSM SecureString containing the CloudMart customer authentication token

  # ============================================================
  # CUSTOMER ID
  # ============================================================

  CustomerId:
    Type: String
    Default: CUST001
    Description: Customer ID associated with the customer authentication token


Resources:

  # ============================================================
  # LAMBDA AUTHORIZER FUNCTION
  # ============================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-authorizer

      Description:
        CloudMart Bearer Token Lambda Authorizer

      Runtime:
        python3.13

      Handler:
        index.handler

      # --------------------------------------------------------
      # IAM ROLE
      # --------------------------------------------------------

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout:
        10

      MemorySize:
        128

      # --------------------------------------------------------
      # VPC CONFIGURATION
      #
      # IMPORTANT:
      # Private subnet IDs are imported from the Network Stack.
      # We no longer pass old subnet IDs manually.
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetAId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:

          - !Ref LambdaSecurityGroupId

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          ENVIRONMENT:
            !Ref Environment

          # Admin token SSM parameter
          ADMIN_AUTH_TOKEN_PARAMETER:
            !Ref AdminAuthTokenParameterName

          # Customer token SSM parameter
          CUSTOMER_AUTH_TOKEN_PARAMETER:
            !Ref CustomerAuthTokenParameterName

          # Customer ID associated with customer token
          CUSTOMER_ID:
            !Ref CustomerId

      # --------------------------------------------------------
      # INLINE LAMBDA CODE
      # --------------------------------------------------------

      Code:

        ZipFile: |

          import json
          import os
          import boto3


          # ============================================================
          # AWS CLIENTS
          # ============================================================

          ssm = boto3.client("ssm")


          # ============================================================
          # ENVIRONMENT VARIABLES
          # ============================================================

          ADMIN_PARAMETER_NAME = os.environ[
              "ADMIN_AUTH_TOKEN_PARAMETER"
          ]

          CUSTOMER_PARAMETER_NAME = os.environ[
              "CUSTOMER_AUTH_TOKEN_PARAMETER"
          ]

          CUSTOMER_ID = os.environ[
              "CUSTOMER_ID"
          ]


          # ============================================================
          # POLICY GENERATOR
          # ============================================================

          def generate_policy(
              effect,
              principal_id,
              method_arn,
              role,
              customer_id=None
          ):

              response = {

                  "principalId": principal_id,

                  "policyDocument": {

                      "Version": "2012-10-17",

                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": method_arn
                          }
                      ]
                  },

                  "context": {
                      "role": role
                  }
              }

              # Add customer ID only for customer role
              if customer_id:

                  response["context"]["customerId"] = customer_id

              return response


          # ============================================================
          # READ TOKEN FROM SSM
          # ============================================================

          def get_parameter_value(parameter_name):

              parameter = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )

              return parameter["Parameter"]["Value"]


          # ============================================================
          # MAIN HANDLER
          # ============================================================

          def handler(event, context):

              method_arn = event.get(
                  "methodArn",
                  "*"
              )

              authorization_token = event.get(
                  "authorizationToken"
              )


              # --------------------------------------------------------
              # Missing token
              # --------------------------------------------------------

              if not authorization_token:

                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "missing"
                  }))

                  raise Exception("Unauthorized")


              # --------------------------------------------------------
              # Validate Bearer format
              # --------------------------------------------------------

              if not authorization_token.startswith("Bearer "):

                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "invalid_format"
                  }))

                  raise Exception("Unauthorized")


              supplied_token = authorization_token[7:].strip()


              # --------------------------------------------------------
              # Empty token
              # --------------------------------------------------------

              if not supplied_token:

                  print(json.dumps({
                      "level": "WARN",
                      "event": "token_validation",
                      "result": "empty"
                  }))

                  raise Exception("Unauthorized")


              # ========================================================
              # CHECK ADMIN TOKEN
              # ========================================================

              try:

                  admin_token = get_parameter_value(
                      ADMIN_PARAMETER_NAME
                  )

              except Exception as error:

                  print(json.dumps({
                      "level": "ERROR",
                      "event": "admin_token_read",
                      "result": "configuration_error"
                  }))

                  raise Exception("Unauthorized")


              if supplied_token == admin_token:

                  print(json.dumps({
                      "level": "INFO",
                      "event": "token_validation",
                      "result": "success",
                      "role": "admin"
                  }))

                  return generate_policy(
                      "Allow",
                      "cloudmart-admin",
                      method_arn,
                      "admin"
                  )


              # ========================================================
              # CHECK CUSTOMER TOKEN
              # ========================================================

              try:

                  customer_token = get_parameter_value(
                      CUSTOMER_PARAMETER_NAME
                  )

              except Exception as error:

                  print(json.dumps({
                      "level": "ERROR",
                      "event": "customer_token_read",
                      "result": "configuration_error"
                  }))

                  raise Exception("Unauthorized")


              if supplied_token == customer_token:

                  print(json.dumps({
                      "level": "INFO",
                      "event": "token_validation",
                      "result": "success",
                      "role": "customer",
                      "customerId": CUSTOMER_ID
                  }))

                  return generate_policy(
                      "Allow",
                      "cloudmart-customer",
                      method_arn,
                      "customer",
                      CUSTOMER_ID
                  )


              # ========================================================
              # INVALID TOKEN
              # ========================================================

              print(json.dumps({
                  "level": "WARN",
                  "event": "token_validation",
                  "result": "failure"
              }))

              raise Exception("Unauthorized")


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  # ============================================================
  # AUTHORIZER LAMBDA ARN
  # ============================================================

  AuthorizerLambdaArn:
    Description: ARN of the CloudMart Lambda Authorizer

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaArn


  # ============================================================
  # AUTHORIZER LAMBDA NAME
  # ============================================================

  AuthorizerLambdaName:
    Description: Name of the CloudMart Lambda Authorizer

    Value:
      !Ref LambdaAuthorizer

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaName


  # ============================================================
  # ADMIN TOKEN PARAMETER
  # ============================================================

  AdminAuthTokenParameter:
    Description: SSM parameter used by the Lambda Authorizer for admin authentication

    Value:
      !Ref AdminAuthTokenParameterName


  # ============================================================
  # CUSTOMER TOKEN PARAMETER
  # ============================================================

  CustomerAuthTokenParameter:
    Description: SSM parameter used by the Lambda Authorizer for customer authentication

    Value:
      !Ref CustomerAuthTokenParameterName


  # ============================================================
  # CUSTOMER ID
  # ============================================================

  CustomerId:
    Description: Customer ID associated with the customer token

    Value:
      !Ref CustomerId
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Authentication Stack.
  Creates the Lambda Authorizer used by API Gateway.
  Customer and admin authentication tokens are stored as SHA-256
  hashes in the RDS MySQL customer_auth_tokens table.

Parameters:

  Environment:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Deployment environment name used in resource and parameter names

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the Lambda Authorizer

  DBHostParameter:
    Type: String
    Description: SSM parameter containing the RDS database host

  DBPortParameter:
    Type: String
    Description: SSM parameter containing the RDS database port

  DBNameParameter:
    Type: String
    Description: SSM parameter containing the RDS database name

  DBUsernameParameter:
    Type: String
    Description: SSM parameter containing the RDS database username

  DBPasswordParameter:
    Type: String
    Description: SSM parameter containing the RDS database password

  LambdaArtifactBucketName:
    Type: String
    Description: S3 bucket containing the packaged Authorizer Lambda ZIP

  LambdaArtifactKey:
    Type: String
    Default: authorizer/authorizer.zip
    Description: S3 object key containing the Authorizer Lambda ZIP

Resources:

  LambdaAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        !Sub CloudMart-${Environment}-authorizer

      Description: >
        CloudMart Lambda Authorizer.
        Customer and admin token hashes are validated against RDS MySQL.

      Runtime: python3.13
      Handler: index.handler

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout: 10
      MemorySize: 128

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetAId
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetBId
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT:
            !Ref Environment

          DB_HOST_PARAMETER:
            !Ref DBHostParameter

          DB_PORT_PARAMETER:
            !Ref DBPortParameter

          DB_NAME_PARAMETER:
            !Ref DBNameParameter

          DB_USERNAME_PARAMETER:
            !Ref DBUsernameParameter

          DB_PASSWORD_PARAMETER:
            !Ref DBPasswordParameter

      Code:
        S3Bucket:
          !Ref LambdaArtifactBucketName
        S3Key:
          !Ref LambdaArtifactKey

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        !Ref LambdaAuthorizer
      Principal:
        apigateway.amazonaws.com
      SourceArn:
        !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*'

Outputs:

  AuthorizerLambdaArn:
    Description: Lambda Authorizer ARN
    Value:
      !GetAtt LambdaAuthorizer.Arn
    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaArn

  AuthorizerLambdaName:
    Description: Lambda Authorizer function name
    Value:
      !Ref LambdaAuthorizer
    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaName

AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart network stack

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev

  OperationsCidr:
    Type: String
    Description: CIDR allowed to access the public dashboard and SSH

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH access to the CloudMart dashboard instance

  EC2AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux AMI ID for the CloudMart dashboard EC2 instance

  EC2InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the CloudMart dashboard


Resources:

  # ============================================================
  # VPC
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-vpc


  # ============================================================
  # INTERNET GATEWAY
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-igw


  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway


  # ============================================================
  # PUBLIC SUBNET
  # ============================================================

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-public-a


  # ============================================================
  # PRIVATE SUBNET A
  # ============================================================

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-private-a


  # ============================================================
  # PRIVATE SUBNET B
  # ============================================================

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-private-b


  # ============================================================
  # PUBLIC ROUTE TABLE
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-public-rt


  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA


  # ============================================================
  # PRIVATE ROUTE TABLE
  # ============================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-private-rt


  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA


  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB


  # ============================================================
  # VPC ENDPOINT SECURITY GROUP
  # ============================================================

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS access from CloudMart resources to VPC endpoints
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-endpoint-sg


  # ============================================================
  # LAMBDA SECURITY GROUP
  # ============================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private security group for CloudMart Lambda ENIs
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-lambda-sg


  # ============================================================
  # EC2 SECURITY GROUP
  # ============================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public security group for CloudMart Flask dashboard
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-ec2-sg


  # ============================================================
  # RDS SECURITY GROUP
  # ============================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private security group for CloudMart RDS MySQL
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-rds-sg


  # ============================================================
  # ENDPOINT SECURITY GROUP RULES
  # ============================================================

  EndpointFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Lambda HTTPS to VPC endpoints


  EndpointFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EC2SecurityGroup
      Description: EC2 HTTPS to VPC endpoints


  EndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: -1
      CidrIp: 0.0.0.0/0
      Description: Endpoint response traffic


  # ============================================================
  # LAMBDA SECURITY GROUP RULES
  # ============================================================

  LambdaToRDS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup
      Description: Lambda to RDS MySQL


  LambdaToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: Lambda to interface VPC endpoints


  LambdaToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Lambda HTTPS access for AWS services


  # ============================================================
  # EC2 SECURITY GROUP RULES
  # ============================================================

  EC2ToRDS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup
      Description: Dashboard to RDS MySQL


  EC2ToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: Dashboard to VPC endpoints


  EC2FromOperationsHTTPSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref OperationsCidr
      Description: Operations team HTTPS access


  EC2FromOperationsHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref OperationsCidr
      Description: Operations team dashboard HTTP access


  EC2FromOperationsSSHIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref OperationsCidr
      Description: Operations team SSH access


  # ============================================================
  # RDS SECURITY GROUP RULES
  # ============================================================

  RDSFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: MySQL from Lambda


  RDSFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EC2SecurityGroup
      Description: MySQL from dashboard


  RDSEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: -1
      CidrIp: 0.0.0.0/0
      Description: RDS outbound traffic


  # ============================================================
  # DASHBOARD EC2 IAM ROLE
  #
  # NEW:
  # The role is created in the same stack as the EC2.
  # This avoids a circular dependency between Network and IAM.
  # ============================================================

  DashboardEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-${Environment}-dashboard-ec2-role

      Description: Least-privilege role for the CloudMart Flask operations dashboard

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        # --------------------------------------------------------
        # READ DATABASE PARAMETERS
        # --------------------------------------------------------

        - PolicyName: DashboardReadDatabaseParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # READ REPORTS FROM S3
        # --------------------------------------------------------

        - PolicyName: DashboardReadReports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-lambda-artifacts-${AWS::AccountId}
                Condition:
                  StringLike:
                    s3:prefix:
                      - reports/
                      - reports/*

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-lambda-artifacts-${AWS::AccountId}/reports/*


  # ============================================================
  # DASHBOARD EC2 INSTANCE PROFILE
  # ============================================================

  DashboardEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub CloudMart-${Environment}-dashboard-ec2-profile
      Roles:
        - !Ref DashboardEC2Role


  # ============================================================
  # DASHBOARD EC2
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    DependsOn:
      - DashboardEC2InstanceProfile

    Properties:
      ImageId: !Ref EC2AmiId
      InstanceType: !Ref EC2InstanceType
      KeyName: !Ref KeyPairName

      # ----------------------------------------------------------
      # IAM INSTANCE PROFILE
      # ----------------------------------------------------------
      IamInstanceProfile: !Ref DashboardEC2InstanceProfile

      SubnetId: !Ref PublicSubnetA

      SecurityGroupIds:
        - !Ref EC2SecurityGroup

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-dashboard

        - Key: Environment
          Value: !Ref Environment

        - Key: Project
          Value: CloudMart


  # ============================================================
  # S3 GATEWAY ENDPOINT
  # ============================================================

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PrivateRouteTable


  # ============================================================
  # SNS INTERFACE ENDPOINT
  # ============================================================

  SNSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


  # ============================================================
  # CLOUDWATCH LOGS INTERFACE ENDPOINT
  # ============================================================

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


  # ============================================================
  # CLOUDWATCH MONITORING INTERFACE ENDPOINT
  # ============================================================

  MonitoringEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.monitoring
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


  # ============================================================
  # SSM INTERFACE ENDPOINT
  # ============================================================

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


  # ============================================================
  # KMS INTERFACE ENDPOINT
  # ============================================================

  KMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.kms
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


  # ============================================================
  # EVENTBRIDGE INTERFACE ENDPOINT
  # ============================================================

  EventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.events
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub CloudMart-${Environment}-VpcId


  PublicSubnetId:
    Description: Public subnet for EC2 Flask dashboard
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub CloudMart-${Environment}-PublicSubnetId


  PrivateSubnetAId:
    Description: Private subnet A for Lambda and RDS
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnetAId


  PrivateSubnetBId:
    Description: Private subnet B for Lambda and RDS
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnetBId


  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  EC2SecurityGroupId:
    Description: EC2 security group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-EC2SecurityGroupId


  RDSSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-RDSSecurityGroupId


  EndpointSecurityGroupId:
    Description: VPC endpoint security group ID
    Value: !Ref EndpointSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-EndpointSecurityGroupId


  DashboardInstanceId:
    Description: CloudMart dashboard EC2 instance ID
    Value: !Ref DashboardEC2
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardInstanceId


  # ============================================================
  # NEW: DASHBOARD ROLE OUTPUT
  # ============================================================

  DashboardEC2RoleArn:
    Description: ARN of the CloudMart dashboard EC2 IAM role
    Value: !GetAtt DashboardEC2Role.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2RoleArn


  # ============================================================
  # NEW: DASHBOARD INSTANCE PROFILE OUTPUT
  # ============================================================

  DashboardEC2InstanceProfileArn:
    Description: ARN of the CloudMart dashboard EC2 instance profile
    Value: !GetAtt DashboardEC2InstanceProfile.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-DashboardEC2InstanceProfileArn
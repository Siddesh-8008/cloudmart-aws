AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack for Milestone 4.
  Creates least-privilege execution roles for:
  Lambda Authorizer,
  Product Lambda,
  Schema Lambda,
  Inventory Alert Lambda,
  and the single Order Processor Lambda used by the Orders API.


# ==============================================================
# PARAMETERS
# ==============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # AUTHORIZE LAMBDA ROLE
  # ============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-authorizer-lambda-role

      Description:
        IAM execution role for CloudMart Lambda Authorizer

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: AuthorizerCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-authorizer'


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-authorizer:*'


        # --------------------------------------------------------
        # READ ADMIN AUTH TOKEN FROM SSM
        #
        # Admin token is stored as a normal String.
        # No KMS decrypt permission is required.
        #
        # Customer token is NOT stored in SSM.
        # Customer tokens are validated using RDS.
        # --------------------------------------------------------

        - PolicyName: AuthorizerReadAdminAuthToken

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/admin-token'


        # --------------------------------------------------------
        # READ DATABASE PARAMETERS FROM SSM
        #
        # Database parameters are normal String parameters.
        # --------------------------------------------------------

        - PolicyName: AuthorizerReadDatabaseParameters

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  # Database host
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host'

                  # Database port
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port'

                  # Database name
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name'

                  # Database username
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username'

                  # Database password
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password'


        # --------------------------------------------------------
        # VPC ACCESS
        #
        # Lambda requires these permissions because the
        # Authorizer Lambda runs inside the VPC and connects
        # to RDS in the private subnet.
        # --------------------------------------------------------

        - PolicyName: AuthorizerVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"



  # ============================================================
  # PRODUCT + SCHEMA LAMBDA ROLE
  # ============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-product-lambda-role

      Description:
        IAM execution role for CloudMart Product and Schema Lambdas

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-product:*'

                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-schema:*'


        # --------------------------------------------------------
        # READ DATABASE PARAMETERS FROM SSM
        #
        # All database parameters are normal String parameters.
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaReadSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password'


        # --------------------------------------------------------
        # VPC NETWORK INTERFACE PERMISSIONS
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"



  # ============================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ============================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-order-processor-lambda-role

      Description:
        IAM execution role for CloudMart Order Processor Lambda

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: OrderProcessorCloudWatchLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-order-processor:*'


        # --------------------------------------------------------
        # READ DATABASE PARAMETERS FROM SSM
        # --------------------------------------------------------

        - PolicyName: OrderProcessorReadSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username'

                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password'


        # --------------------------------------------------------
        # VPC NETWORK INTERFACE PERMISSIONS
        # --------------------------------------------------------

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"


        # --------------------------------------------------------
        # EVENTBRIDGE
        #
        # Allows the Order Processor to publish order events.
        # --------------------------------------------------------

        - PolicyName: OrderProcessorEventBridge

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus'


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  # ============================================================
  # AUTHORIZE ROLE ARN
  # ============================================================

  AuthorizerLambdaRoleArn:

    Description:
      ARN of the Lambda Authorizer execution role

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn


  # ============================================================
  # PRODUCT ROLE ARN
  # ============================================================

  ProductLambdaRoleArn:

    Description:
      ARN of the Product Lambda execution role

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  # ============================================================
  # ORDER PROCESSOR ROLE ARN
  # ============================================================

  OrderProcessorLambdaRoleArn:

    Description:
      ARN of the Order Processor Lambda execution role

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderProcessorLambdaRoleArn

AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart IAM Stack for Milestone 4.
  Creates least-privilege execution roles for:
  Lambda Authorizer,
  Product Lambda,
  Schema Lambda,
  Inventory Alert Lambda,
  and the single Order Processor Lambda used by the Orders API.


# ==============================================================
# PARAMETERS
# ==============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


# ==============================================================
# RESOURCES
# ==============================================================

Resources:


  # ============================================================
  # AUTHORIZE LAMBDA ROLE
  # ============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub CloudMart-${Environment}-authorizer-lambda-role

      Description: IAM execution role for CloudMart Lambda Authorizer

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: AuthorizerCloudWatchLogs

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-authorizer:*


        # --------------------------------------------------------
        # READ AUTH TOKEN FROM SSM
        # --------------------------------------------------------

        - PolicyName: AuthorizerReadAuthToken

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token


        # --------------------------------------------------------
        # VPC ACCESS
        # --------------------------------------------------------

        - PolicyName: AuthorizerVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"



  # ============================================================
  # PRODUCT LAMBDA ROLE
  # ============================================================
  #
  # This role is used by:
  #
  # 1. Product Lambda
  # 2. Schema Lambda
  #
  # ============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub CloudMart-${Environment}-product-lambda-role

      Description: >
        IAM execution role for CloudMart Product Lambda
        and Schema Lambda

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: ProductCloudWatchLogs

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # Create log group
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              # Product Lambda logs
              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-product:*


              # Schema Lambda logs
              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-schema:*


        # --------------------------------------------------------
        # READ DATABASE PARAMETERS FROM SSM
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaReadDatabaseParameters

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # KMS DECRYPT
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaReadSSMKMS

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - kms:Decrypt

                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*


        # --------------------------------------------------------
        # VPC NETWORK INTERFACE PERMISSIONS
        # --------------------------------------------------------

        - PolicyName: ProductAndSchemaVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"


        # --------------------------------------------------------
        # PUBLISH INVENTORY EVENTS
        # --------------------------------------------------------

        - PolicyName: ProductPublishInventoryEvents

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus



  # ============================================================
  # INVENTORY ALERT LAMBDA ROLE
  # ============================================================

  InventoryAlertLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub CloudMart-${Environment}-inventory-alert-lambda-role

      Description: IAM execution role for CloudMart Inventory Alert Lambda

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: InventoryAlertCloudWatchLogs

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-inventory-alert:*


        # --------------------------------------------------------
        # PUBLISH LOW STOCK ALERTS TO SNS
        # --------------------------------------------------------

        - PolicyName: InventoryAlertPublishSNS

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:CloudMart-${Environment}-low-stock-alert



  # ============================================================
  # ORDER PROCESSOR LAMBDA ROLE
  # ============================================================
  #
  # IMPORTANT:
  #
  # We now use ONLY ONE Lambda for Orders.
  #
  # API Gateway
  #       |
  #       v
  # Order Processor Lambda
  #
  # Therefore:
  #
  # - There is NO separate OrderLambdaRole.
  # - There is NO Lambda-to-Lambda invocation permission.
  # - API Gateway directly invokes OrderProcessorLambda.
  #
  # This role provides:
  #
  # - CloudWatch Logs
  # - SSM database parameter access
  # - KMS decrypt
  # - VPC access
  # - EventBridge PutEvents
  #
  # ============================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub CloudMart-${Environment}-order-processor-lambda-role

      Description: >
        IAM execution role for CloudMart single Order Processor Lambda.
        Handles POST /orders, GET /orders/{id},
        and GET /orders?customerId=.


      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:

        # --------------------------------------------------------
        # CLOUDWATCH LOGS
        # --------------------------------------------------------

        - PolicyName: OrderProcessorCloudWatchLogs

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # Create log group
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup

                Resource: "*"


              # Write Order Processor logs
              - Effect: Allow

                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-${Environment}-order-processor:*


        # --------------------------------------------------------
        # READ DATABASE PARAMETERS FROM SSM
        # --------------------------------------------------------

        - PolicyName: OrderProcessorReadDatabaseParameters

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  # Database host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/host

                  # Database port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/port

                  # Database name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/name

                  # Database username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/username

                  # Database password
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/password


        # --------------------------------------------------------
        # KMS DECRYPT
        # --------------------------------------------------------

        - PolicyName: OrderProcessorSSMKMSDecrypt

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - kms:Decrypt

                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*


        # --------------------------------------------------------
        # VPC NETWORK INTERFACE PERMISSIONS
        # --------------------------------------------------------

        - PolicyName: OrderProcessorVPCAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"


        # --------------------------------------------------------
        # PUBLISH EVENTS TO EVENTBRIDGE
        # --------------------------------------------------------

        - PolicyName: OrderProcessorPublishEvents

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus



# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  # ============================================================
  # AUTHORIZE ROLE OUTPUTS
  # ============================================================

  AuthorizerLambdaRoleArn:

    Description: ARN of the CloudMart Authorizer Lambda execution role

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn


  AuthorizerLambdaRoleName:

    Description: Name of the CloudMart Authorizer Lambda execution role

    Value:
      !Ref AuthorizerLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerLambdaRoleName



  # ============================================================
  # PRODUCT ROLE OUTPUTS
  # ============================================================

  ProductLambdaRoleArn:

    Description: >
      ARN of the CloudMart Product Lambda execution role.
      This role is also used by Schema Lambda.

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  ProductLambdaRoleName:

    Description: >
      Name of the CloudMart Product Lambda execution role.
      This role is also used by Schema Lambda.

    Value:
      !Ref ProductLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleName



  # ============================================================
  # INVENTORY ALERT ROLE OUTPUTS
  # ============================================================

  InventoryAlertLambdaRoleArn:

    Description: ARN of the CloudMart Inventory Alert Lambda execution role

    Value:
      !GetAtt InventoryAlertLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-InventoryAlertLambdaRoleArn


  InventoryAlertLambdaRoleName:

    Description: Name of the CloudMart Inventory Alert Lambda execution role

    Value:
      !Ref InventoryAlertLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-InventoryAlertLambdaRoleName



  # ============================================================
  # ORDER PROCESSOR ROLE OUTPUTS
  # ============================================================

  OrderProcessorLambdaRoleArn:

    Description: >
      ARN of the CloudMart single Order Processor Lambda
      execution role.

    Value:
      !GetAtt OrderProcessorLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaRoleArn


  OrderProcessorLambdaRoleName:

    Description: >
      Name of the CloudMart single Order Processor Lambda
      execution role.

    Value:
      !Ref OrderProcessorLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaRoleName

AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Milestone 4 EventBridge Stack.
  Creates the CloudMart EventBridge event bus,
  low-stock alert rule, order confirmation notification,
  and order failure event rule.

Parameters:

  # ============================================================
  # ENVIRONMENT
  # ============================================================

  Environment:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Deployment environment name used in resource and parameter names


  # ============================================================
  # LOW STOCK EMAIL
  # ============================================================

  NotificationEmailParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Description: SSM String parameter containing the single email used for all CloudMart SNS notifications.


# ==============================================================
# RESOURCES
# ==============================================================

Resources:

  # ============================================================
  # CLOUDMART EVENT BUS
  # ============================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name:
        !Sub cloudmart-${Environment}-event-bus


  # ============================================================
  # LOW STOCK EVENT RULE
  # ============================================================

  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-low-stock-rule

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - Low Stock Alert

      Targets:

        - Id:
            LowStockSNSTarget

          Arn:
            Fn::ImportValue:
              !Sub CloudMart-${Environment}-LowStockTopicArn

          InputTransformer:
            InputPathsMap:
              productId: $.detail.productId
              productName: $.detail.productName
              stock: $.detail.stock
              lowStockThreshold: $.detail.lowStockThreshold
            InputTemplate: >-
              "CloudMart Low Stock Alert: Product <productName>
              (ID <productId>) currently has stock <stock>,
              which is at or below the low-stock threshold
              <lowStockThreshold>."


  # ============================================================
  # LOW STOCK SNS TOPIC POLICY
  # ============================================================

  LowStockSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-LowStockTopicArn

      PolicyDocument:

        Version:
          '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgePublish

            Effect:
              Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              Fn::ImportValue:
                !Sub CloudMart-${Environment}-LowStockTopicArn


  # ============================================================
  # ORDER CONFIRMED SNS TOPIC
  # ============================================================

  OrderConfirmedTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName:
        !Sub cloudmart-${Environment}-order-confirmed
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  OrderConfirmedEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn:
        !Ref OrderConfirmedTopic
      Protocol: email
      Endpoint:
        !Ref NotificationEmailParameter


  OrderConfirmedSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
        - !Ref OrderConfirmedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sns:Publish
            Resource:
              !Ref OrderConfirmedTopic


  # ============================================================
  # ORDER FAILED SNS TOPIC
  # ============================================================

  OrderFailedTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName:
        !Sub cloudmart-${Environment}-order-failed
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  OrderFailedEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn:
        !Ref OrderFailedTopic
      Protocol: email
      Endpoint:
        !Ref NotificationEmailParameter


  OrderFailedSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
        - !Ref OrderFailedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sns:Publish
            Resource:
              !Ref OrderFailedTopic


  # ============================================================
  # ORDER CONFIRMED EVENT RULE
  # ============================================================

  OrderConfirmedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-confirmed-rule

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderConfirmed

      Targets:

        - Id:
            OrderConfirmedSNSTarget

          Arn:
            !Ref OrderConfirmedTopic

          InputTransformer:
            InputPathsMap:
              orderId: $.detail.orderId
              customerId: $.detail.customerId
              totalAmount: $.detail.totalAmount
              status: $.detail.status
            InputTemplate: >-
              "CloudMart Order Confirmed: Order <orderId> for customer
              <customerId> is <status>. Total amount: <totalAmount>."


  # ============================================================
  # ORDER FAILED EVENT RULE
  # ============================================================

  OrderFailedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-failed-rule

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderFailed

      Targets:

        - Id:
            OrderFailedSNSTarget

          Arn:
            !Ref OrderFailedTopic

          InputTransformer:
            InputPathsMap:
              orderId: $.detail.orderId
              reason: $.detail.reason
            InputTemplate: >-
              "CloudMart Order Failed: Order <orderId> could not be
              completed. Reason: <reason>."


  # ============================================================
  # ORDER CANCELLATION SNS TOPIC
  # ============================================================

  OrderCancellationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub cloudmart-${Environment}-order-cancellations

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # ORDER CANCELLATION EMAIL SUBSCRIPTION
  # ============================================================

  OrderCancellationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderCancellationTopic

      Protocol:
        email

      Endpoint:
        !Ref NotificationEmailParameter


  # ============================================================
  # ORDER CANCELLATION SNS TOPIC POLICY
  # ============================================================

  OrderCancellationSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:

        - !Ref OrderCancellationTopic

      PolicyDocument:

        Version:
          '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgePublish

            Effect:
              Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderCancellationTopic


  # ============================================================
  # ORDER CANCELLED EVENT RULE
  # ============================================================

  OrderCancelledRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub cloudmart-${Environment}-order-cancelled-rule

      EventBusName:
        !Ref CloudMartEventBus

      State:
        ENABLED

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderCancelled

      Targets:

        - Id:
            OrderCancelledSNSTarget

          Arn:
            !Ref OrderCancellationTopic

          InputTransformer:
            InputPathsMap:
              orderId: $.detail.orderId
              customerId: $.detail.customerId
              totalAmount: $.detail.totalAmount
              cancelledBy: $.detail.cancelledBy
            InputTemplate: >-
              "CloudMart Order Cancelled: Order <orderId> for customer
              <customerId> was cancelled by <cancelledBy>.
              Total amount: <totalAmount>."


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  # ============================================================
  # EVENT BUS ARN
  # ============================================================

  CloudMartEventBusArn:
    Description:
      CloudMart EventBridge Event Bus ARN

    Value:
      !GetAtt CloudMartEventBus.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-EventBusArn


  # ============================================================
  # EVENT BUS NAME
  # ============================================================

  CloudMartEventBusName:
    Description:
      CloudMart EventBridge Event Bus Name

    Value:
      !Ref CloudMartEventBus

    Export:
      Name:
        !Sub CloudMart-${Environment}-EventBusName


  # ============================================================
  # LOW STOCK RULE ARN
  # ============================================================

  LowStockRuleArn:
    Description:
      Low Stock EventBridge Rule ARN

    Value:
      !GetAtt LowStockEventRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-LowStockRuleArn


  # ============================================================
  # ORDER CONFIRMED RULE ARN
  # ============================================================

  OrderConfirmedRuleArn:
    Description:
      Order Confirmed EventBridge Rule ARN

    Value:
      !GetAtt OrderConfirmedRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedRuleArn


  # ============================================================
  # ORDER FAILED RULE ARN
  # ============================================================

  OrderFailedRuleArn:
    Description:
      Order Failed EventBridge Rule ARN

    Value:
      !GetAtt OrderFailedRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderFailedRuleArn


  # ============================================================
  # ORDER NOTIFICATION SNS TOPIC ARN
  # ============================================================

  OrderConfirmedTopicArn:
    Description:
      SNS topic ARN for order-confirmed notifications

    Value:
      !Ref OrderConfirmedTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedTopicArn


  OrderFailedTopicArn:
    Description:
      SNS topic ARN for order-failed notifications

    Value:
      !Ref OrderFailedTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderFailedTopicArn


  OrderCancellationTopicArn:
    Description:
      SNS topic ARN for order cancellation notifications

    Value:
      !Ref OrderCancellationTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderCancellationTopicArn


  OrderCancelledRuleArn:
    Description:
      Order Cancelled EventBridge Rule ARN

    Value:
      !GetAtt OrderCancelledRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderCancelledRuleArn
#
